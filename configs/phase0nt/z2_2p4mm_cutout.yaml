# =====================================================================================
# PHASE 0N-T --- Z2-2.4mm-CUTOUT, the physical land-side package candidate
# =====================================================================================
# One explicit configuration for the physical build, replacing the loose environment
# variables used for the historical experiments. Env vars remain honoured for those.
#
# THIS FILE IS CONFIGURATION ONLY -- geometry, materials, architecture and sensitivity
# cases. It carries NO implementation state. Implementation state is owned entirely by
# scripts/phase0nw/audit_physical_gates.py, which evaluates every required gate against
# the config, the meshes and the generated artifacts. A handwritten status list here was
# stale within one phase (it still said "complete physical Z1" was open after Z1 was
# built) and, worse, it listed requirements the generated registry did not contain, so
# nothing checked them.
# =====================================================================================

architecture: ARCH_Z2_BACKSIDE   # geometry family (backside converter in a PCB cutout)
label: Z2-2.4mm-CUTOUT
# FINAL CLOSURE (research/final_closure/Z2_DIRECT_FEED_ARCHITECTURE.md). The PRIMARY Z2 is
# DIRECT-FED: 48 V reaches the backside HVR through a dedicated external connection on the
# cutout side; only the 1 V supply/return cross the substrate, through the explicit VR attach
# below. The BGA-fed construction survives only as Z2_BGA_FED_CONTROL (code key Z2BF), which
# shares this geometry and differs only in its 48 V path.
variant: Z2_DIRECT_FEED
hv_feed:
  mode: DIRECT_FEED            # BGA_FED only for Z2_BGA_FED_CONTROL
  input_terminals: "VIN pad on the high-side RDL of each cell, reached from the cutout side"
  external_loop_parameter: R_Z2_direct_feed_loop     # swept, never assumed
  precedent: "ARM US20260059645A1 claims 6-9, 14-15, [0038], [0040] (DIRECT construction precedent)"
vr_attach:
  layer: conv_attach_vr_substrate
  technology: "Cu pillar + SnAg solder cap + underfill"
  carries: "1 V VDD and GND only"
  thickness_um: 30.0           # the clearance budget's 'cell-to-substrate attach' allowance
  cu_height_um: 14.0
  cap_height_um: 16.0          # Au et al., ECTC 2016 (CLOSE_ANALOG)
  diameter_um: 15.0            # Au et al., ECTC 2016 (CLOSE_ANALOG)
  pitch_um: 30.0               # Au et al., ECTC 2016 (CLOSE_ANALOG)
  status: CLOSE_ANALOG

board:
  case: it968g_2p4mm           # PHASE 0N-V. The legacy fr4_2p4mm is UNSOURCED and is
                               # forbidden on any physical path; a guard enforces it.
  thickness_sensitivity_case: it968g_3p2mm
  model_level: PCB-H0          # single homogenized orthotropic board; H1 validates it
  eta_nominal: 0.50            # conditional: whole-board values are estimates at this
  eta_sensitivity: [0.25, 0.50, 0.75]
  thickness_um: 2400.0
  tolerance_pct: 10.0
  status: VENDOR_EVIDENCE
  source: >-
    18-layer server/HPC PCB offered at 2.4 mm +-10 % (ugpcb); within Schweizer standard
    multilayer 0.6-3.2 mm; PCBWay rigid list. NOT peer-reviewed.
  note: >-
    The historical fr4_* cases are preserved for reproduction only (results/phase0mr3c
    runs on fr4_1p6mm). Commit 30f717b described an annular mesh as "2.4 mm" while it
    still contained a 1600 um board; board_case is an explicit parameter so the claim is
    checkable. Board-level E/CTE/k are DERIVED estimates conditional on eta, not
    measured board properties -- see research/PCB_MATERIAL_PROPERTY_AUDIT.md Sec.5.

substrate:
  thickness_um: 300.0
  size_mm: [30.0, 30.0]
  status: SOURCE_BACKED        # Krishnakumar 2026 Table III power-layer TSV height

cutout:
  width_mm: 23.36
  rule: "49-cell grid bbox 21.36 mm + 2 x 1.0 mm sidewall clearance"
  sidewall_clearance_mm: 1.0
  sidewall_status: BOUNDED     # unsourced; 0.5-1.0 mm carried as a range
  sidewall_content: VOID       # DEFECT #66: the ring between the cell grid and the PCB wall is
                               # empty in the baseline; the sidewall-filled F1 is a class-B variant
  mesh_conforming: true
  breakpoints_mm: [-11.68, 11.68]
  removed_layers: [board, bga]
  precedent: >-
    ARM US20260059645A1 claim 1 and Intel US20250233088A1 "cutoff region 221" --
    PATENT construction precedent, not demonstrated hardware. NEITHER GIVES A DIMENSION.

bga:
  pitch_mm: 0.8
  diameter_mm: 0.4
  height_um: 300.0
  status: SOURCE_BACKED        # Krishnakumar 2026 Table III
  lattice: centred             # (n-1)*p/2 about the origin, NOT -L/2 + (i+0.5)p
  sites_total: 1369
  sites_surviving: 528
  mechanical_field_sites: 528  # BGA_MECHANICAL_FIELD: every surviving site stays in the mechanics
  power_field_48v: none        # BGA_48V_POWER_FIELD of the primary (direct-fed) Z2
  allocation:                  # LEGACY Phase 0N-T interim allocation; superseded by
                               # package_network.json (54/rail) and used only by Z2BF
    rule: "mirror-symmetric pairs per side; whole pairs alternate supply/return"
    supply_balls: 16
    return_balls: 16
    per_side: 4
    first_moment_mm: [0.0, 0.0]
    i_per_ball_a: 1.5
    i_per_ball_status: BOUNDED
    note: >-
      Current is an interim figure. Once the new ET fixed point exists, I_in must be
      recomputed as (P_load + P_converter + P_package)/48 V and this allocation redone.

converter:
  # NOT the Z1 embedded-cell proxy. CONV_CELL_MM (1226/1258 um) structurally excludes
  # the high-side device and must never be used as a Z2 total.
  four_tier_um: 1953.0
  with_land_side_rdl_um: 1963.0
  tiers_from_substrate_downward:
    - {name: land_side_attach_rdl, um: 10.0, status: SOURCE_BACKED}
    - {name: inductor_plus_cout,   um: 500.0, status: SOURCE_BACKED}
    - {name: interlayer_rdl,       um: 10.0, status: SOURCE_BACKED}
    - {name: gan_ls_EPC2057,       um: 638.0, status: SOURCE_BACKED}
    - {name: interlayer_rdl,       um: 10.0, status: SOURCE_BACKED}
    - {name: flying_caps,          um: 100.0, status: BOUNDED}
    - {name: interlayer_rdl,       um: 10.0, status: SOURCE_BACKED}
    - {name: gan_hs_EPC2014C,      um: 685.0, status: SOURCE_BACKED}
  cells: 49
  cell_area_mm2: 5.61
  cell_side_mm: 2.3685
  coverage_pct: 30.5
  material_mapping:
    rule: >-
      The geometry gate does not license inventing material data. Every tier maps to a
      medium already in the framework; the mapping and its status are carried here and
      reproduced in the mesh audit.
    rdl_tiers:      {material: rdl_composite, status: DERIVED,
                     note: framework RDL+bump homogenization}
    # TCPMT revision: cards DERIVED by unit-cell homogenization of the tier contents of the
    # design in force (scripts/tcpmt_converter_cards.py -> research/tcpmt_revision/
    # converter_cards.json, with Voigt/Reuss bounds). The statuses below stay those of the
    # PROPERTY: several inputs are declared (MLCC construction, TY-M5 core k, encapsulant),
    # not sourced. Legacy assignment (silicon / hvr_effective): variant conv_k_legacy.
    gan_hs_and_ls:  {material: conv_gan_hs / conv_gan_ls, status: BOUNDED,
                     note: "dies at their area fraction with their solder terminals in the
                            encapsulant (EPC datasheet outlines); the GaN epi is NOT resolved"}
    inductor_cout:  {material: conv_ind_cout, status: PROVISIONAL,
                     note: "Cu windings (inductor paper Fig. 7), TY-M5 rod, C_out MLCC,
                            output-current posts, encapsulant"}
    flying_caps:    {material: conv_cfly_a0, status: OPEN,
                     note: "MLCC (BaTiO3/Ni body, Cu terminations) in the encapsulant;
                            case A1 (rated 0603 parts) carries conv_cfly_a1"}

out_of_cell:
  # Brief section 15. The opening is 23.36^2 = 545.69 mm2; the 49 cells occupy
  # 49 x 5.61 = 274.89 mm2, so 49.6 % OF THE OPENING is outside a cell.
  # NOTE: the 69.5 % figure in the brief is the fraction of the 30 x 30 mm SUBSTRATE
  # footprint, which applied when the converter was a full-area slab. Now that the
  # converter exists only inside the cutout, 49.6 % is the governing number.
  fraction_of_opening_pct: 49.6
  fraction_of_substrate_pct: 69.5
  primary: F1_clearance        # encapsulant between the cells, 1.0 mm clearance ring VOID
  cases:
    F1_clearance:    {material: underfill_homog, ring: VOID, status: PROVISIONAL,
                      note: "production: fill only inside the 21.36 mm cell-grid bounding box"}
    F1_encapsulated: {material: underfill_homog, status: PROVISIONAL,
                      note: "SENSITIVITY ONLY (f1_sidewall_filled): fills the whole opening and bonds the converter to the PCB sidewall"}
    F2_void:         {material: null, status: BOUNDED,
                      note: "elements are never created; genuinely no material, not an
                             air-property relabel"}
  bracket_required: true       # final mechanical result must be run across F1 and F2


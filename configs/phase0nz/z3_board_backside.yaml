# =====================================================================================
# PHASE 0N-Z --- Z3-BOARD-BACKSIDE: the regulator on the PCB BACKSIDE
# =====================================================================================
# CONFIGURATION ONLY: geometry, materials, thermal boundary and the DECLARED DESIGN
# ASSUMPTIONS of the third architecture. No implementation state and no result lives here.
#
# Z3 keeps the Z2 package ABOVE the board unchanged (compute die, TIM, microbumps, top 1 V
# RDL, 300 um Si substrate with the 1 V VDD/GND TSV fields under each cell) and moves the
# SAME 49-cell regulator out of the PCB cutout onto the BOARD UNDERSIDE, at the same x-y
# positions (beneath the die). The board is therefore a full slab with the full BGA
# lattice, and the ~1 kA 1 V output crosses the BOARD (plated through-holes) and the BGA
# before it reaches the substrate TSVs.
#
# Status labels (every number carries one):
#   SOURCE_BACKED  from a source the framework already cites
#   BOUNDED        unsourced engineering value or range end, carried as a bound
#   DESIGN_CHOICE  a design decision of this architecture, not a measured property
#   ASSUMPTION     a modelling simplification, stated so its consequence can be judged
#
# scripts/phase0nw/physical_package.load_z3_package_config re-derives every quantity this
# file states redundantly (tier sum, cell side, attach height, via annulus, BGA count,
# package z extents against the stack card) and refuses an inconsistent file.
# =====================================================================================

architecture: ARCH_Z3_BOARD_BACKSIDE   # geometry family (converter on the PCB backside)
label: Z3-BOARD-BACKSIDE
variant: Z3_BOARD_BACKSIDE             # code key Z3

hv_feed:
  mode: DIRECT_FEED            # like Z2: 48 V enters the converter's input terminals directly
  input_terminals: "VIN pad on the high-side RDL of each cell (the deepest tier), reached from below the board"
  external_loop_parameter: R_Z3_direct_feed_loop   # outside the package-internal boundary
  boundary: >-
    package-internal boundary: from the converter's 48 V input terminals to the die. The
    external 48 V feed loop is outside it, as for the direct-fed Z2, so the Z3 ledger
    carries NO package 48 V RDL or BGA term.
  status: DESIGN_CHOICE

package:
  # ABOVE THE BOARD: identical to Z2. These values are not re-typed into the mesh: the
  # builder takes the die/TIM/interface from the stack card (configs/phase0b/
  # package_stack.yaml) and the top RDL from z2_converter.TOP_RDL_UM, and the loader
  # refuses this file if they disagree.
  die_um: 300.0                # stack card functional_die.thickness (ASSUMPTION there)
  tim_um: 50.0                 # stack card tim.thickness (DESIGN_CHOICE, as Z1)
  interface_um: 10.0           # microbumps + underfill (DERIVED microbump card, as Z1/Z2)
  top_rdl_um: 10.0             # Z2 top 1 V RDL + ground plane
  size_mm: [30.0, 30.0]
  status: SOURCE_BACKED        # same construction as the Z2 package

substrate:
  thickness_um: 300.0
  tile_band_um: 20.0           # thin RDL band at the substrate top; the TSV field passes through it
  size_mm: [30.0, 30.0]
  status: SOURCE_BACKED        # Krishnakumar 2026 Table III power-layer TSV height
  tsv_field: "1 V VDD/GND, 1444 vias of 30 um per cell under each cell footprint (as Z2)"

board:
  case: it968g_2p4mm           # the same IT-968G board as Z1/Z2
  thickness_um: 2400.0
  model_level: PCB-H0
  eta_nominal: 0.50
  cutout: none                 # FULL slab: Z3 has no PCB opening
  status: VENDOR_EVIDENCE
  source: >-
    18-layer server/HPC PCB offered at 2.4 mm +-10 % (ugpcb); laminate ITEQ IT-968G.
    Board-level E/CTE/k are DERIVED estimates conditional on eta.

bga:
  pitch_mm: 0.8
  diameter_mm: 0.4
  height_um: 300.0
  status: SOURCE_BACKED        # Krishnakumar 2026 Table III
  lattice: centred
  cutout: none                 # the FULL lattice survives (as Z1)
  sites_total: 1369
  mechanical_field_sites: 1369 # the critical-joint search runs over all of them
  power_field_1v:
    carries: "1 V VDD + GND output of the 49 cells (~1 kA per rail)"
    i_ball_criterion_a: 1.5    # the framework's 1.5 A/ball ENGINEERING criterion (no source)
    criterion_status: BOUNDED
    criterion_current_a: 1000.0  # DC 1 V rail current = P_load / V_out (the ledger checks it)
    n_per_rail: 667            # ceil(1000 / 1.5); the loader re-derives it
    sharing: EQUAL             # every 1 V ball of a rail carries I / n
    sharing_status: ASSUMPTION # the real sharing is uneven: the BGA loss is a LOWER BOUND
    resistance: "rho_solder(T) h / A per ball, Krishnakumar 2026 Table III (pad_interface.bga_ball_resistance_ohm)"
    site_assignment: >-
      not resolved: under equal sharing the ledger does not depend on which 1334 sites
      carry 1 V, and the homogenised BGA layer carries all 1369 sites mechanically.

pcb_via_field:
  technology: "plated through-holes through the full board, via-in-pad"
  finished_hole_um: 200.0      # DESIGN_CHOICE
  plating_um: 25.0             # DESIGN_CHOICE (Cu barrel)
  pitch_um: 400.0              # DESIGN_CHOICE, = the VR attach pitch (via-in-pad)
  extent: cell_footprints      # under each cell footprint only
  alignment: via_in_pad        # one via under every VR attach bump of the legal lattice
  allocation: checkerboard     # VDD/GND exactly as the attach bumps
  hole_fill: non_conductive    # ASSUMPTION: the plugged core is board-like; only the annulus conducts
  resistance_model: "R_via = rho_Cu(T) L / A_annulus, L = board thickness; n in parallel per rail per cell"
  card_material: pcb_via_field
  card_fraction_basis: unit_cell   # A_annulus / p^2 = 11.0 % (the declared ~11 %).
                                   # real_lattice = the 5 x 5 via field's own share of the
                                   # 2.3685 mm footprint (7.9 %); switchable, see the loader
  card_thermal: "k_z = f k_Cu + (1 - f) k_z,board (parallel rule); k_xy = Maxwell-Garnett 2-D of Cu cylinders in the board's in-plane matrix"
  card_mechanical: >-
    Voigt rule on the board card: E = f E_Cu + (1 - f) E_board, CTE stiffness-weighted,
    nu linear. Exact along z for aligned barrels and an upper bound in plane; applied
    isotropically because the board card is isotropic at its in-plane modulus.
  card_status: ASSUMPTION
  status: DESIGN_CHOICE

vr_attach:
  layer: z3_attach_vr_pcb
  technology: "SAC305 solder bumps + underfill (board-level attach)"
  carries: "1 V VDD and GND only"
  thickness_um: 100.0          # bump standoff
  cu_height_um: 0.0            # all-solder column: no Cu post
  cap_height_um: 100.0
  diameter_um: 200.0
  pitch_um: 400.0
  lattice: "legal lattice inside each cell: bump inside the cell with edge clearance >= (p - d) / 2 (final_closure_vr_attach.lattice)"
  allocation: checkerboard     # site (i, j) is VDD if i + j is even
  constriction: two_sided      # final_closure_vr_attach constriction on the 10 um / 80 % output
                               # plane, both sides: the framework model, reused unchanged. On
                               # the PCB side the via-in-pad barrel takes the current, so the
                               # second constriction is conservative.
  card_material: vr_attach_pcb
  card_fraction_basis: unit_cell   # the production Z2 attach convention (pi d^2 / 4 p^2)
  underfill: underfill_homog
  mechanical_convention: "underfill-dominated card, as the production Z2 attach and the microbump row"
  status: DESIGN_CHOICE

converter:
  # the SAME 49-cell regulator and the SAME tier order as Z2 (the loader refuses any
  # difference from configs/phase0nt/z2_2p4mm_cutout.yaml), hung from the BOARD UNDERSIDE:
  # land-side/attach RDL against the attach, high-side GaN deepest
  with_land_side_rdl_um: 1963.0
  tiers_from_board_downward:
    - {name: land_side_attach_rdl, um: 10.0, status: SOURCE_BACKED}
    - {name: inductor_plus_cout,   um: 500.0, status: SOURCE_BACKED}
    - {name: interlayer_rdl,       um: 10.0, status: SOURCE_BACKED}
    - {name: gan_ls_EPC2057,       um: 638.0, status: SOURCE_BACKED}
    - {name: interlayer_rdl,       um: 10.0, status: SOURCE_BACKED}
    - {name: flying_caps,          um: 100.0, status: BOUNDED}
    - {name: interlayer_rdl,       um: 10.0, status: SOURCE_BACKED}
    - {name: gan_hs_EPC2014C,      um: 685.0, status: SOURCE_BACKED}
  cells: 49
  cell_area_mm2: 5.61
  cell_side_mm: 2.3685
  placement: "the Z2 cell x-y positions (the 49 cells beneath the die), on the board underside"
  cell_grid_bbox_mm: 21.36     # measured on the mesh and cross-checked to 1e-6 mm
  material_mapping: "as Z2 (z2_converter.TIER_MATERIAL)"
  status: DESIGN_CHOICE

out_of_cell:
  primary: F1_bbox
  fill: underfill_homog        # between the cells INSIDE the cell-grid bbox, in every converter
                               # tier and in the attach tier
  outside_bbox: VOID           # no elements outside the bbox (the Z2 production rule)
  status: PROVISIONAL

thermal_boundary:
  top: "production cold plate (TOP_SI_MICROCHANNEL_27) on the TIM, exactly as Z1/Z2"
  converter_underside:
    type: second top-type cold plate
    h: "the top plate's uniform h at the dissipated power (cooling_production h_uniform)"
    fluid: inlet temperature
    faces: "bottom face of the deepest tier (high-side GaN) over the whole cell-grid bbox"
    precedent: "final_closure_sensitivity.v_z2_cooled, promoted to the Z3 PRODUCTION boundary"
    status: DESIGN_CHOICE
  board_underside_outside_converter: "production h_bottom natural-convection film (the two films never overlap)"

ledger:
  boundary: "converter 48 V input terminals -> die (package-internal)"
  forbidden_terms: [P_pkg_RDL_HV_supply, P_pkg_RDL_HV_return, P_BGA_supply, P_BGA_return]
  required_terms: [P_conv_hs, P_conv_ls, P_conv_inductor_dcr, P_conv_cap_esr,
                   P_intraVR_metal, P_intraVR_vertical,
                   P_VR_PCB_attach_VDD, P_VR_PCB_attach_GND,
                   P_PCB_via_VDD, P_PCB_via_GND,
                   P_BGA_1V_VDD, P_BGA_1V_GND,
                   P_TSV_VDD, P_TSV_GND, P_pad_VDD, P_pad_GND]
  not_modelled:
    - term: P_PCB_plane_1V_spreading
      what: "PCB copper-plane lateral spreading between the cell via fields and the BGA balls"
      consequence: "omitted: the Z3 1 V loss is a LOWER BOUND"
    - term: P_sub_land_1V_spreading
      what: >-
        package land-side redistribution between the BGA balls and the TSV fields. The
        balls cover the whole 30 x 30 mm lattice while the TSV fields sit only under the
        49 cells (30.5 % of the area), and the Z2 package (adopted unchanged above the
        board) has no land-side 1 V RDL to carry that current
      consequence: "omitted: the Z3 1 V loss is a LOWER BOUND"

mechanics:
  model: "the same thermoelastic model as Z1/Z2"
  restraint: "BC_BOARD 3-2-1 rigid-body anchors at the GLOBAL lowest z (the converter underside)"
  joint_search: "full BGA lattice (1369 sites, as Z1)"

expected:
  # re-derived by the loader from the layer list; the tests check them on the MESH
  z_min_um: -4763.0            # converter underside (substrate underside z = 0)
  z_max_um: 670.0              # TIM top
  board_span_um: [-2700.0, -300.0]
  converter_span_um: [-4763.0, -2800.0]

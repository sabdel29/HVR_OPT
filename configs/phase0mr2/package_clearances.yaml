# =====================================================================================
# PHASE 0M-R2 SECTION 4 --- THE THREE PACKAGE CLEARANCES
# =====================================================================================
# These three unsourced numbers are the sole reason every one of the twelve partition
# templates fails FULLY_REALIZABLE. This file records what was searched, what was found,
# and what each is bounded by.
#
# SEARCH PERFORMED, and its outcome:
#   1. the exact package/process source used by this framework  -- NOT AVAILABLE. The
#      June-2026 DVPD source describes embedded components but publishes no cavity or
#      clearance design rule.
#   2. foundry / OSAT / substrate-vendor design rules           -- NOT ACCESSIBLE. These
#      are proprietary documents released under NDA. No public copy was reachable.
#   3. peer-reviewed implementations                            -- SEARCHED, NOTHING
#      USABLE. Crossref and OpenAlex were reachable from this host and returned no paper
#      giving a numeric embedded-component cavity clearance. WebSearch is blocked here.
#   4. explicit bounded engineering envelope                    -- ADOPTED, below.
#   5. OPEN                                                     -- retained for the
#      sourcing status; only the FEASIBILITY question is answered over the bound.
#
# The bounds below are NOT sources and are not presented as such. Each is anchored to a
# length the framework already sources, and the anchor is stated. The purpose is solely
# to answer: does the realizability verdict DEPEND on the unknown, or is it the same over
# the whole plausible interval?
# =====================================================================================

meta:
  sourcing_status: OPEN
  bound_status: BOUNDED
  never: >-
    No single "reasonable" value is adopted. Every template is evaluated at the low, mid
    and high end of every bound, and the verdict is reported per bound corner.

clearances:

  die_to_component_gap_um:
    definition: >-
      Minimum vertical gap between the compute-die underside and the top of the tallest
      component in the tier below it.
    where: "between the top of the converter tier and the bottom of the compute die"
    current_default: null
    sourcing: OPEN
    why_it_matters: >-
      It is added to the charged stack height. A template that fits without it can fail
      with it, and the Z1 embedded cell already uses 1226 of the 1300 um available.
    affects: "every template; binding on ARCH_Z1 where the substrate budget is tightest"
    bound_um: [10.0, 25.0, 50.0]
    bound_anchor: >-
      Lower end 10 um is the sourced `interface_layer` thickness and the sourced 10 um
      hybrid-pad height -- the framework already builds a 10 um gap there, so a required
      clearance below that is excluded by the model's own geometry. Upper end 50 um is
      twice the sourced 25 um Syed solder averaging length and of the same order as the
      50 um cooler fin thickness; nothing in the stack uses a package gap larger than
      that. ANCHORS, NOT SOURCES.
    coupled_to: null

  cavity_sidewall_um:
    definition: >-
      Lateral allowance between an embedded component's edge and the cavity wall milled
      or built into the substrate.
    where: "in plane, around every embedded component in ARCH_Z1's substrate cavity"
    current_default: null
    sourcing: OPEN
    why_it_matters: >-
      It inflates the in-plane area each component consumes, so it acts directly on the
      area bound -- the bound T4 currently misses by about 2 %.
    affects: "ARCH_Z1 (embedded); T4's area margin is the most sensitive"
    bound_um: [15.0, 30.0, 60.0]
    bound_anchor: >-
      Centred on the sourced minimum conductor spacing s_min = 30 um used by
      interconnect.TSVGeometry, with a factor of two either side. A cavity wall is a
      different feature from a via keep-out, so this is an ANALOGY, NOT A SOURCE.
    coupled_to: null

  cooler_standoff_um:
    definition: >-
      Vertical standoff between the cooled surface and the nearest active component.
    where: "between the top of the die/TIM stack and the cooler base"
    current_default: null
    sourcing: OPEN
    why_it_matters: >-
      It adds to the total package height and, more importantly, inserts extra thermal
      resistance directly in series with the only heat-removal path.
    affects: "every template; strongest on ARCH_Z4, whose stack is tallest"
    bound_um: [0.0, 50.0, 100.0]
    bound_anchor: >-
      Lower end 0 um is the present model, which bonds the cooler directly to the TIM.
      Upper end 100 um is the sourced cooler base thickness t_base_um = 100 um: a standoff
      larger than the cooler's own base would dominate the design and is excluded. ANCHOR,
      NOT A SOURCE.
    coupled_to: >-
      die_to_component_gap_um -- both consume the same total height budget, so the height
      feasibility question must be evaluated on the SUM, not on either alone. They are
      swept jointly.

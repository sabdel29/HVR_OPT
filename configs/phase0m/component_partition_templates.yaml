meta:
  phase: 0M
  purpose: A FINITE library of component-partition templates. Phase 0M does NOT allow arbitrary continuous
    z placement; templates first, and only then a decision about which further degree of freedom is
    scientifically useful.
  upstream_finding: HVR_FULL_OPT_EPC_V2::_compute_area returns max(), not sum(), over the four component
    classes -- so four-layer vertical stacking is ALREADY assumed by the converter area model, and
    only by it.

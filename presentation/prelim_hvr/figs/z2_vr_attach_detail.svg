<text x="865.00" y="551.00" font-size="15" text-anchor="start" font-weight="normal"  fill="#10151c">Cu pillar 14 µm tall, Ø15 µm, 30 µm pitch</text>
<polyline points="844.00,588.00 855.00,588.00" fill="none" stroke="#10151c" stroke-width="1.0" stroke-linejoin="round" />

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'Source Sans 3', 'Segoe UI', Arial, Helvetica, sans-serif" data-spec-sha256="4729030cb06868e688c623a4dcc1e46cd8f10e9afd71b31ac6b9d1cdfade4704" data-figure="vr-attach-detail" data-px-per-um="6" data-schematic="true">
<title>Z2 regulator-to-substrate attach</title><desc>Cu pillar + solder cap + underfill; 1 V supply and return only</desc>
<defs><marker id="a48" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e36209"/></marker><marker id="a1v" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8250df"/></marker><marker id="aret" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3d464f"/></marker><marker id="aink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#10151c"/></marker><marker id="amuted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5a6672"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#5a6672" stroke-width="1"/></pattern></defs>
<rect width="1600" height="900" fill="#ffffff"/>

<text x="24.00" y="42.00" font-size="26" text-anchor="start" font-weight="bold"  fill="#10151c">The electrical bridge: regulator → package substrate (Z2)</text>
<text x="24.00" y="68.00" font-size="16" text-anchor="start" font-weight="bold"  fill="#d1442f">Only the 1 V supply and its return cross here, about 1 kA in total; the 48 V input never does — it enters the regulator from below.</text>
<rect x="24.00" y="82.00" width="900.62" height="26.00" fill="#ffffff" stroke="#cf222e" stroke-width="1.6" />
<text x="33.00" y="98.00" font-size="14" text-anchor="start" font-weight="bold"  fill="#cf222e">SCHEMATIC MAGNIFICATION — dimensions from the spec; 48 of the 300 µm TSV shown; landing pads not resolved in the model</text>

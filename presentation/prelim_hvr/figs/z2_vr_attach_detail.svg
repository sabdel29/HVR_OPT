<text x="865.00" y="641.00" font-size="15" text-anchor="start" font-weight="normal"  fill="#10151c">solder cap 16 µm; underfill between the pillars</text>
<polyline points="844.00,684.00 855.00,684.00" fill="none" stroke="#10151c" stroke-width="1.0" stroke-linejoin="round" />
<polyline points="844.00,744.00 855.00,744.00" fill="none" stroke="#10151c" stroke-width="1.0" stroke-linejoin="round" />
<polyline points="849.50,684.00 849.50,744.00" fill="none" stroke="#10151c" stroke-width="1.2" stroke-linejoin="round" />
<text x="865.00" y="719.00" font-size="15" text-anchor="start" font-weight="normal"  fill="#10151c">regulator 1 V output / attach RDL, 10 µm</text>
<text x="868.00" y="200.00" font-size="15" text-anchor="start" font-weight="normal"  fill="#10151c">• 3042 pillars per rail in each 2.37 mm cell (VDD/GND checkerboard): about 4 under every TSV</text>
<text x="868.00" y="248.00" font-size="15" text-anchor="start" font-weight="normal"  fill="#10151c">• 1 kA / 49 cells / 3042 ≈ 7 mA per pillar; no current-density allowable is claimed</text>
<text x="868.00" y="296.00" font-size="15" text-anchor="start" font-weight="normal"  fill="#10151c">• geometry from Au et al., ECTC 2016 (Ø15 µm Cu pillars at 30 µm pitch, 16 µm cap): a CLOSE</text>
<text x="868.00" y="314.00" font-size="15" text-anchor="start" font-weight="normal"  fill="#10151c">   ANALOG, not this package</text>
<text x="868.00" y="344.00" font-size="15" text-anchor="start" font-weight="normal"  fill="#10151c">• height = the 30 µm attach allowance of the clearance budget; other heights and all-solder bumps are</text>
<text x="868.00" y="362.00" font-size="15" text-anchor="start" font-weight="normal"  fill="#10151c">   class-B cases</text>
<polyline points="842.00,837.50 868.00,837.50" fill="none" stroke="#8250df" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#pk1v)" />
<text x="876.00" y="842.30" font-size="14" text-anchor="start" font-weight="normal"  fill="#10151c">1 V supply (up the VDD pillars)</text>
<polyline points="842.00,859.50 868.00,859.50" fill="none" stroke="#3d464f" stroke-width="2.3" stroke-dasharray="7,4" stroke-linejoin="round" marker-end="url(#pkret)" />
<text x="876.00" y="864.30" font-size="14" text-anchor="start" font-weight="normal"  fill="#10151c">1 V return (down the GND pillars)</text>

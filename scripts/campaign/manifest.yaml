# Campaign manifest of the TCPMT paper results; see scripts/campaign/README.md
campaign:
  name: campaign_v3
  results_root: research/{campaign}
  scratch_root: /home/beams0/SABDELZAHER/ETM_project/scratch_campaign/{campaign}
  frozen_fields: /home/beams0/SABDELZAHER/ETM_project/scratch/fields
  python: /home/beams0/MGHARIB/envs/etm/bin/python
  path_prepend:
  - /home/beams0/MGHARIB/envs/etm/bin
  moose: /home/beams0/LPOPRYHO/projects/moose/modules/heat_transfer/heat_transfer-opt
  env:
    OPENBLAS_NUM_THREADS: 1
    MKL_NUM_THREADS: 1
    PYTHONDONTWRITEBYTECODE: 1
    SOURCE_DATE_EPOCH: 1793000000
    FORCE_SOURCE_DATE: 1
    JOINT_BAND_FRAC: '0.16666666666666666'
  design_point:
    name: m36
    design: M = 36, N3K3K_A2, EPC2014C/EPC2055, 805 kHz, rated 0603, 4 mixed tiers (production design
      record entry)
    record: configs/design_points.yaml
    alternates:
      m36t5: 5-tier co-design comparison (N4K4K_A2, 957 kHz, 3.73 mm)
      m36thin: 'thin-capacitor sensitivity (former case A0: m36 at a 100-um capacitor)'
      m25: count neighbour M = 25 (screen ranking check)
      m49: count neighbour M = 49 (screen ranking check)
local:
  max_cores: 35
  nice: 0
pbs:
  host: pioneer
  qsub: /opt/pbs/bin/qsub
  qstat: /opt/pbs/bin/qstat
  qdel: /opt/pbs/bin/qdel
  queue: cpu_only
  select_extra: host=califone
  max_running: 8
  max_queued: 50
  max_walltime_h: 96
  max_ncpus: 112
  max_mem_gb: 512
  resubmit_failed: 1
  hybrid_buffer: null
  jobs_dir: /home/beams/SABDELZAHER/pbs_jobs/etm/{campaign}
stages:
- name: prep
  what: regenerable inputs of the solver chain (network, attach lattices, Z3 land-side sheets, tier order,
    converter cards, rules)
- name: production
  what: the production state (implemented decoupling) and the S0/S1 references, Z1/Z2/Z3 x cooling A/B
    (r21), the converged fields and the local chain
- name: z3_landside
  what: Z3 land-side spreading sensitivities on the coupled basis, report
- name: interface_feedback
  what: TIM-warpage interface feedback, Z1/Z2/Z3 x cooling A/B
- name: hotspots
  what: non-uniform die power map, Z1/Z2/Z3 x cooling A/B
- name: count_study
  what: count neighbours M = 25 and 49 through the chain (Z1 x A/B)
- name: thin_cap
  what: thin-capacitor sensitivity (m36 with a 100-um capacitor), Z1/Z2/Z3 x A/B
- name: co_design
  what: the 5-tier co-design comparison design, Z1/Z2/Z3 x A/B
- name: refinement_ladders
  what: nested mesh ladders r11/r12/r31 around production r21
- name: robustness_map
  what: class-B sensitivity set behind the robustness map + local responses
- name: solder_submodels
  what: local viscoplastic solder studies (constitutive, band, cycles, ...)
- name: moose_checks
  what: 'matched MOOSE references: thermal columns, package RDL, full package'
- name: dse_sweeps
  what: regulator-count design-space sweeps and their summaries
- name: derived
  what: post-processing of solver results into the paper's artifacts
- name: manuscript
  what: macros, tables and figures, written under the campaign root

# =====================================================================================
# PHASE 0M-R3 SECTION 2 --- THE REALIZABILITY CONTRACT
# =====================================================================================
# FROZEN BEFORE ANY ARCHITECTURE WAS MODIFIED. This file is written first so that the
# definition of "buildable" cannot be adjusted after seeing which candidates pass.
#
# Written: Phase 0M-R3 Section 2, before Section 3 (failure decomposition) and before
# Section 4 (repair search) were run.
# =====================================================================================

meta:
  frozen_before: "any candidate evaluation"
  rule: >-
    A candidate is PROVEN_REALIZABLE only if EVERY condition below is satisfied AND every
    input it depends on is SOURCE_BACKED or PROCESS_FEASIBLE. A single OPEN input caps the
    candidate at CONDITIONAL_REALIZABLE, however comfortable its margins.

# -------------------------------------------------------------------------------------
verdict_levels:
  PROVEN_REALIZABLE:
    definition: "every condition passes and no condition depends on an OPEN input"
  CONDITIONAL_REALIZABLE:
    definition: >-
      every condition passes at every corner of every bounded input, but at least one
      input is OPEN or BOUNDED rather than sourced
  NOT_REALIZABLE:
    definition: "at least one condition fails at every corner of the bounded inputs"
  OPEN:
    definition: >-
      the verdict itself depends on which corner of a bounded input is taken -- it passes
      at some and fails at others. NEVER collapsed into PASS.

provenance_levels:
  SOURCE_BACKED: "a named datasheet, paper or process document gives this number"
  PROCESS_FEASIBLE: "demonstrated by the reference process in a cited source"
  MODEL_FEASIBLE: "satisfied by the framework's own validated model, not by a process source"
  BOUNDED: "not sourced, enclosed by a stated interval that is swept"
  OPEN: "not determined and not defaulted"

# -------------------------------------------------------------------------------------
conditions:

  A_component_area:
    test: "sum of component footprints per cell <= per-cell die-shadow budget"
    budget_source: "die shadow 22.36 x 22.36 mm over 49 cells = 10.204 mm2 per cell"
    provenance: SOURCE_BACKED
    hard: true

  B_component_height:
    test: "charged component stack height <= architecture vertical space"
    provenance: SOURCE_BACKED
    hard: true

  C_package_clearance:
    test: "die-to-component gap + cooler standoff fit the height budget; cavity sidewall
           fits the area budget"
    provenance: OPEN
    bound_source: "configs/phase0mr2/package_clearances.yaml, 27-corner sweep"
    hard: true
    note: "OPEN inputs. Passing this caps the candidate at CONDITIONAL_REALIZABLE."

  D_routing_width:
    test: "for every net, required conductor width from J_design <= width physically
           available on the allocated layers"
    provenance: SOURCE_BACKED
    hard: true
    note: >-
      HARD GATE, new in this phase. A candidate whose losses are calculable but whose
      conductors do not fit is NOT realizable. Phase 0M found the 1 V output plane needs
      8.6x the available tile width; that was reported as a loss number, not as a
      feasibility failure.

  E_current_density:
    test: "J_actual <= J_design <= J_process_max on every conductor and every via"
    provenance: SOURCE_BACKED
    hard: true

  F_tsv_count:
    test: "n_required <= n_allocated <= n_available in the field footprint at the pitch rule"
    provenance: SOURCE_BACKED
    hard: true

  G_tsv_aspect_ratio:
    test: "AR = L_TSV / d <= AR_max"
    ar_max: 10.0
    ar_max_source: "June-2026 Table III demonstrates d = 30 um at h = 300 um, i.e. 10:1"
    provenance: PROCESS_FEASIBLE
    hard: true
    margin_rule: "M_AR = AR_max / AR_actual; M_AR = 1.000 is ZERO margin, not comfort"
    note: >-
      Phase 0M-R3 separates the HARD RULE from the DESIGN MARGIN. AR = 10.000 passes the
      rule and has M_AR = 1.000, which no process can hold. Reported separately.

  H_bump_pad_density:
    test: "required bump count <= pads available at the sourced pitch under the die shadow"
    provenance: SOURCE_BACKED
    hard: true

  I_tier_connectivity:
    test: "every tier boundary a net crosses has an allocated via stack"
    provenance: MODEL_FEASIBLE
    hard: true

  J_no_component_overlap:
    test: "no two component footprints on the same tier intersect"
    provenance: MODEL_FEASIBLE
    hard: true

  K_no_z_overlap:
    test: "tier z-extents are disjoint and monotone; no layer occupies negative thickness"
    provenance: MODEL_FEASIBLE
    hard: true

  L_cooling_clearance:
    test: "the cooler base sits above the tallest element of the die stack with the
           standoff charged"
    provenance: OPEN
    hard: true

  M_converter_synthesis:
    test: "the converter compiles at the required load from the existing device library"
    provenance: SOURCE_BACKED
    hard: true

  N_ripple_switching:
    test: "output ripple and switching frequency remain inside the compiled design's own
           declared operating envelope"
    provenance: SOURCE_BACKED
    hard: true

  O_power_path_continuity:
    test: "an unbroken conducting path exists from package input to load for every rail,
           with no tier gap and no unallocated crossing"
    provenance: MODEL_FEASIBLE
    hard: true

# -------------------------------------------------------------------------------------
forbidden_repairs:
  - "inventing a transistor, inductor or capacitor not in the existing library"
  - "scaling any component below its sourced dimensions"
  - "creating an unsourced RDL stack"
  - "exceeding J_process_max"
  - "removing a required clearance"
  - "changing the 1 kW load"
  - "reducing delivered functionality"
  - "enlarging the package beyond the reference definition"

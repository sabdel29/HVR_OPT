# ---------------------------------------------------------------------------
# PHASE 0J -- life-law acquisition result. Added 2026-09-14.
# ---------------------------------------------------------------------------
reliability_metrics:
  note: >-
    THREE metrics, frozen in Phase 0J Sec.1 BEFORE any law was selected, so that no metric
    could be redefined to suit a law found later. All three come from the same solve, the same
    volume-averaged solder core, the same one-element corner exclusion, and the same stabilised
    cycle (cycle 4 of 4, 0.48-2.00 %). All three include plastic AND creep.
  M1:
    name: "accumulated equivalent inelastic PATH per stabilised cycle"
    definition: "d(PEEQ) = PEEQ(t_end,k) - PEEQ(t_end,k-1), volume-averaged"
    units: "dimensionless (strain)"
    character: "PATH LENGTH -- NOT a strain range"
    is_the_phase0i_metric: true
  M2:
    name: "direct within-cycle inelastic strain RANGE"
    definition: "max_t eq(eps_in) - min_t eq(eps_in) over the stabilised cycle"
    units: "dimensionless (strain)"
    computed: "DIRECTLY from the time history -- never as M1 / 3.72"
  M3:
    name: "dissipated inelastic energy density per stabilised cycle"
    definition: "sum sigma_mid : d(eps_in) over the cycle, engineering shear factor 2"
    units: "MJ/m^3"
    integration_region: "whole solder core -- NOT a 12.7 um interface layer"
  M1_over_M2_ratio:
    all_11_dvpd_architecture_cases: "2.023 to 2.027"
    phase0ir_representative_case: 3.72
    finding: >-
      The ratio is a property of the LOADING TRAJECTORY, not of the material, the architecture
      or the geometry. A unidirectional 0->du->0 power cycle gives the textbook factor of ~2; a
      fully-reversed cycle gives 3.7. Across three architectures and a 6.7x span in substrate
      thickness the ratio varies by 0.2 %. Using 3.72 to convert the architecture results would
      have mis-stated M2 by a factor 1.84, and any strain-range life law by 1.84^m -- 2.6x at
      m = 1.5, 6.2x at m = 3.

life_law_status:
  verdict: "NO ADMISSIBLE LAW"
  candidates_evaluated: 10
  admissible: 0
  conditionally_transferable: 1
  inadmissible: 9
  search_scale: >-
    762 unique works from 15 targeted queries across two independent indices (OpenAlex
    title_and_abstract.search, Crossref query.bibliographic); 139 distinct open-access papers
    citing the three canonical calibrations were enumerated; 11 full-text sources retrieved.
  primary_sources_unretrievable:
    - "Syed 2004, 10.1109/ectc.2004.1319419 -- IEEE HTTP 202, Unpaywall is_oa=false, S2 openAccessPdf=null"
    - "Schubert 2003, 10.1109/ectc.2003.1216343 -- IEEE HTTP 202, is_oa=false"
    - "Darveaux 2002, 10.1115/1.1413764 -- ASME HTTP 403, is_oa=false"
  only_constants_obtained: >-
    Syed 2004 SnAgCu C_I = 0.013, C_II = 0.036, via ONE open-access review (Yu et al. 2026,
    Eng. Res. Express 8:132401). SECONDARY provenance; no independent second source found.
  reproduction_gate: >-
    NOT PASSED. Declared tolerance +-25 % on N_f before attempting. The gate fails one step
    earlier than Sec.8 anticipates -- the formulas did not fail to reproduce their data, the
    DATA CANNOT BE REACHED. No absolute lifetime in this project is validated.
  decisive_disqualifications:
    engelmaier: >-
      UNDEFINED for our cycle, not merely inaccurate: c = c0 + c1*T_sj + c2*ln(1 + 360/t_dwell)
      and our cycle has ZERO dwell, so the logarithm diverges.
    darveaux: >-
      Requires dW_ave from three element layers each 0.0005 in (12.7 um) at the pad interface;
      our finest element is 37.5 um, 3x too coarse to reproduce the extraction. The circulated
      K1-K4 are EUTECTIC SnPb. The retrieved IMAPS source states absolute predictions "could be
      off by a factor of 7" under inconsistent methodology.
    syed: >-
      Closest family -- its native metric IS accumulated creep strain per cycle -- but the
      two-mechanism form needs eps_acc PARTITIONED by a double power law, and our Norton card
      is a single power law that cannot produce that partition.
    coffin_manson: "needs a PLASTIC-only strain range; CalculiX aliases CEEQ/CE/PE to PEEQ."
    rejected_on_regime_or_alloy: >-
      A fully-specified SnAgCu VIBRATION law (N_f = 7758.3 W^-1.036) and a fully-specified
      92.5Pb5Sn2.5Ag DIE-ATTACH Darveaux recalibration were both found with primary constants
      and both rejected -- the first on loading regime, the second under the standing
      no-alloy-mixing rule that already rejected SAC405 and SnAgCuCe in Phase 0I.

mission_requirement:
  N_required: OPEN
  category_B_field_mission_requirement: "NONE FOUND"
  what_was_found_and_NOT_promoted:
    category_A_qualification: "-40/+125 C, 1000 cycles board-level; -55/+125 C, 1000 cycles package-level"
    category_C_accelerated_condition: "JESD22-A104-B as applied: 45-min ramp, 15-min dwell, 3.6 C/min"
    category_A_measured_characteristic_life: "SAC305 256 I/O BGA, ENIG, -40/+185 C: eta = 1390 cycles, beta = 5.4"
  why_structural: >-
    Not a search failure. Operating-life limits are set by customer-specific qualification
    programmes and are not published; the public standards family specifies HOW TO TEST, not
    how long a part must last. jedec.org, the ANSI webstore and opencompute.org all return
    HTTP 403. A required life for this system must be DECLARED BY ITS OWNER.
  parametric_sweep_only: >-
    10^2 to 10^5 cycles, labelled PARAMETRIC MISSION SENSITIVITY. Sec.14 forbids promoting the
    1000-cycle qualification count into a mission life, and it is not used as one anywhere.

cycle_compatibility:
  simulated_cycle: >-
    T 25.0 -> 81.1-83.2 C, dT 56.1-58.2 K, T_mean 53.1-54.1 C, period 600 s, ramp ~11.6 K/min,
    SYMMETRIC TRIANGLE WITH ZERO DWELL. write_inp emits *TEMPERATURE with no AMPLITUDE=STEP, so
    CalculiX ramps linearly and the 300 s named DWELL is a 300 s RAMP.
  jedec_reference: "-40/+125 C, dT 165 K, 15-min dwell, ~120 min period"
  compatible: false
  dominant_difference: "dwell -- zero against 15 minutes; and dT 2.9x apart"
  remedies_unavailable: >-
    Sec.15 offers re-running on the law's cycle or a sourced acceleration relation. Neither is
    actionable because there is no admissible law and therefore no calibration cycle to
    reconcile with. Re-running at -40/+125 C was CONSIDERED AND DELIBERATELY NOT DONE: both
    extremes lie outside the validated 7.5-16 MPa Norton window, so it would have produced
    numbers that look like progress and mean nothing.
  sec16_already_satisfied: >-
    The DVPD mission IS power cycling and Phase 0I modelled it that way -- P(t) -> T_local(t)
    -> nonlinear solder solve, with the half-period justified from the package's own thermal
    time constant. The cycle is right for the product and wrong for the literature.

architecture_life:
  status: "CONDITIONAL -- NOT A VALIDATED LIFETIME"
  ranking: "Z2 > Z1 > Z4"
  ranking_robustness: >-
    ROBUST LIFE RANKING in the Sec.20 sense: identical across all three law families
    (strain range, energy, creep damage) and every exponent tested (m = 1, 1.5, 2, 3).
  relative_life_is_parameter_free_for_the_syed_form: >-
    N_f = (C*eps_acc)^-1 is INVERSE-LINEAR, so in a life ratio the constant cancels AND there
    is no exponent to assume: N_f,Z2/N_f,Z1 = M1_Z1/M1_Z2 = 1.558 exactly, N_f,Z4/N_f,Z1 =
    0.890. This is the opposite of the Coffin-Manson case, where Phase 0I-R found the ratio
    spans a factor 7.4 over a plausible exponent range. CONDITIONAL ON THE FORM, not on any
    fitted number.
  conditional_absolute: "Z1 4266, Z2 6647, Z4 3795 cycles -- NOT VALIDATED, quoted only to
    answer Sec.19 and Sec.25"
  absolute_uncertainty: >-
    UNBOUNDED -- two unbounded contributors (no admissible law, cycle incompatibility) on top
    of a factor 2.77 from the choice of constant and -38 % from the choice of eps_acc.
  relative_uncertainty: "6.2 pp on a 35.8 % effect; ZERO contribution from the law constant or
    exponent, both of which cancel"
  mission_life_crossover:
    band: "N_required in (4266, 6647] -- only Z2 feasible"
    width_ratio: 1.558
    note: >-
      The band's POSITION is conditional on the unvalidated constant C. Its WIDTH is not,
      because C cancels. Called MISSION-LIFE CROSSOVER, never a product requirement.
  creep_interpretation_depends_on_law_family: >-
    Enabling creep moves the STRAIN metric DOWN 21.5-32.0 % and the ENERGY metric UP
    115-153 % in every architecture. A strain-based law and an energy-based law disagree about
    the SIGN of what creep does. Any future law must be matched to the measure it was
    calibrated against.
  electrical_cost_of_reliability:
    Z1_to_Z2: "+1.688 W buys 1.56x fatigue life; 8.76 W per decade of N_f"
    supersedes: "W per um of warpage -- WITHDRAWN for local-reliability decisions"
    Z1_vs_Z4: "NOT RANKED ELECTRICALLY -- 0.14 sigma, unresolved since Phase 0I-R"
  temperature_to_life: >-
    +50 K mean-temperature shift moves the metric +22.7 % with temperature-dependent material
    physics against -0.2 % with frozen properties; propagated through the Syed form (m fixed at
    1) that is -18.5 % life. MUST NOT be confused with the architecture comparison, whose joint
    temperatures differ by 2.1 K with r = +0.017 against damage.
  word_damage: >-
    M1, M2 and M3 are RESPONSE METRICS. None is called a fatigue damage parameter, because no
    source uses them as one for this alloy, joint and cycle. PEEQ is not "damage".

# ---------------------------------------------------------------------------
# PHASE 0J-R -- primary life-law access. Added 2026-09-14.
# ---------------------------------------------------------------------------
life_law_status_0jr:
  supersedes: "life_law_status (Phase 0J), which is retained as the historical record"
  verdict: "ADMITTED FOR RELATIVE LIFE ONLY"
  admissible_for_relative_life: 4
  admissible_as_methodology: 1
  admissible_for_acceleration_only: 1
  inadmissible: 3
  entries_changed_by_primary_access: "7 of 10"
  why_phase0j_was_wrong_about_syed: >-
    Phase 0J rejected the Syed paper largely because the PARTITIONED model needs a two-mechanism
    creep split our single Norton law cannot produce. The paper contains THREE formulations. The
    author explicitly offers the TOTAL accumulated creep strain form as the simplification,
    because the low-stress mechanism contributes less than 5 % of strain and less than 2 % of
    damage for SnAgCu -- "there is no need for such a separation for SnAgCu solder". That form
    needs no partition and is the one used here.
  authoritative_constants:
    source: "Syed 2004, AUTHOR-CORRECTED version, not the IEEE ECTC original"
    total_accumulated_creep_strain: "N_f = (0.0468 * eps_acc)^-1   (Eq.14, double power law)"
    creep_energy_density: "N_f = (0.0015 * w_acc)^-1   (Eq.15)"
    hyperbolic_sine_variants: "0.0513 (strain, Eq.16) and 0.0019 (energy, Eq.17)"
    partitioned: "C_I = 0.106, C_II = 0.045 (Eq.13); C_I carries a standard error of 0.08"
    superseded_original_constants: "0.0358, 0.0012, 0.0405, 0.0014, and 0.013/0.036 -- NOT to be
      used"
  why_the_corrected_version_is_MANDATORY_here: >-
    The author's note records errors in data processing; the appended deck gives the mechanism --
    the original constants were regressed on FIRST-CYCLE values, and SnAgCu stabilises only after
    the 2nd cycle with a 20-30 % reduction. This project extracts every metric at the STABILISED
    cycle, so pairing our stabilised eps with a first-cycle-fitted constant would compound the
    very error the author corrected and over-predict life by 31 %. The version match is a
    methodological requirement, not a preference for the later file.
  reproduction:
    status: PASSED
    tolerances_declared_in_advance:
      - "reproduce the paper's own +-25 % claim from its Table 3"
      - "the two INDEPENDENTLY fitted constants must recover a consistent w_acc/eps_acc to 10 %"
    result_a: "worst error 11.7 % on the independent Table 3 validation package"
    result_b: "w/eps = 28.78, 29.85, 28.99, 30.02 MPa -- spread 4.2 %"
    digitisation: "NONE -- every value is a printed table entry"

reliability_metrics_0jr:
  M4:
    name: "accumulated equivalent CREEP strain per stabilised cycle"
    status: "IDENTICAL TO M1, PROVEN BY PROBE -- not approximated"
    proof: >-
      CalculiX's combined *PLASTIC + *CREEP is a PURE VISCOPLASTIC OVERSTRESS model. Probed
      under constant uniaxial load: without the plastic card the creep rate is A*sigma^n to 5
      significant figures; with it, A*(sigma - sigma_y)^n to 3. At 25 MPa against a 15.2 MPa
      yield, PEEQ at the first output is 1.52e-11 where a rate-independent model would need
      5.16e-2. There is NO rate-independent plastic strain, so every PEEQ increment is creep and
      M4 == M1, M5 == M3 identically.
    corroboration: >-
      Syed reports the same for his own model: plastic is 0.125 % of strain and 0.225 % of
      energy, and "No need to model time independent plasticity for Thermal Cycle simulations".
  averaging_volume:
    matched_to_source: true
    definition: "two 25 um solder layers, package side AND board side, TWO 12.5 um elements
      across each -- the source states the constants are valid ONLY for this thickness"
    how: "targeted local refinement of the JOINT SUBMODEL ONLY (graded_joint.py); the global
      package model was not remeshed"
    mesh_convergence: "3.0-3.2 % over the final refinement, against a predeclared 10 % target"
    stabilisation: "0.32-0.56 % at cycle 5 of 6"
    effect_of_matching: "M4 changes by 22-60 % versus the Phase-0I core volume, and by a
      DIFFERENT amount per architecture -- it is not a scale factor"
  numerical_findings_recorded:
    - "a float-noise duplicate in the graded z-grid created ZERO-THICKNESS elements that
      diverged at increment 1; fixed with tolerance-based merging"
    - "the FINAL simulated cycle is systematically ~15 % low, identically in the 4-cycle and
      6-cycle runs whose cycle 3 values agree to four figures. Physics cannot know which cycle
      is last, so the final cycle is discarded and the penultimate one reported."

cycle_waveform_CORRECTED:
  supersedes: "cycle_compatibility (Phase 0J), which is WRONG and is retained only as history"
  actual_waveform: >-
    SQUARE WAVE. The solver's own NT output carries the full hot value 82.8605 C at t = 0.002 s,
    the first increment of a 300 s step; a ramp would give 25.0004 C. The temperature is STEPPED
    and then HELD for the full step duration.
  dwell_at_each_extreme_s: 300
  phase0j_error: >-
    Phase 0J reported ZERO dwell, inherited from a Phase-0I-R note that CalculiX ramps
    *TEMPERATURE across a step. That note was an inference; it does not hold here. Sec.10 of the
    Phase-0J-R brief required the actual input behaviour to be checked rather than inferred, and
    it is a step.
  consequence: >-
    Our cycle is much closer to the calibration set than Phase 0J believed. Syed's TC3 has 5-min
    dwells -- exactly ours.
  dwell_sensitivity: >-
    Over a 30x change in dwell (30 s to 900 s) the ABSOLUTE metric moves only +17 % (Z1) and
    +22 % (Z2), and the RELATIVE Z2/Z1 result moves by +-2 % (1.266-1.320 strain, 1.202-1.282
    energy). The overstress formulation self-limits as sigma approaches sigma_y, so extending a
    hold adds little further damage.

architecture_life_0jr:
  status: "RELATIVE LIFE VALIDATED; ABSOLUTE LIFE CONDITIONAL"
  relative_life_vs_Z1:
    Z2: "1.21 to 1.38 across four admissible primary-source formulations"
    Z4: "0.94 to 0.98 -- NOT RESOLVED and NOT CLAIMED"
    robustness: "ROBUST ACROSS ADMISSIBLE LIFE-LAW FAMILIES -- two authors, two SnAgCu variants,
      two metric families, exponents -1 and -1.3, and a 30x dwell range. Ranking Z2 > Z1 > Z4 in
      every case."
  supersedes_phase0j_ratio: >-
    Phase 0J reported Z2/Z1 = 1.558. That was an ALGEBRAIC RATIO on the Phase-0I core volume,
    which is not the volume Syed calibrated. 1.283 is a TRANSFER-VALIDATED RELATIVE-LIFE RATIO on
    the source's own 25 um extraction. The two are different quantities and the earlier one is
    WITHDRAWN.
  conditional_absolute_life:
    Z1: "2499 (Eq.14 strain) or 610 (Eq.15 energy)"
    Z2: "3206 or 736"
    Z4: "2388 or 601"
    why_not_validated: >-
      The two admitted Syed models disagree by 4.10x on our joint while agreeing to 4-7 % on his
      own independent validation package. The cause is measured: our w_acc/eps_acc is 124-136
      MPa against his 28.8-30.0 MPa, so our joint runs at roughly four times his effective
      stress. Each metric interpolates inside his calibrated range; the PAIR does not.
  domain_classification:
    eps_acc: "INTERPOLATION -- inside 0.00213-0.0777"
    w_acc: "INTERPOLATION -- inside 0.0665-2.424 MPa"
    w_over_eps: "OUTSIDE by 4.3x -- this is the operative limitation"
  electrical_cost: "+1.688 W (1.3 % of 126.1 W) buys 1.21-1.38x solder fatigue life, on a
    primary-source calibration with the averaging volume matched and the source validation
    reproduced"
  power_cycle_transfer: >-
    DEFENSIBLE, and it is the published method. Syed 2001 applies the same damage model to a
    power cycle with the temperature field from a transient thermal solve and NO acceleration
    factor: 260 s cycle, 16 assemblies, measured 5550 vs predicted 6750 (+20 %). Our cycle is
    600 s and the chain is identical. Its SnPb constants are NOT used.

# ---------------------------------------------------------------------------
# PHASE 0K -- mission, identifiability, G2 decision closure. Added 2026-09-14.
# ---------------------------------------------------------------------------
g2_decision_map:
  method: >-
    All FOUR admitted absolute-life formulations applied independently over a 601-point log grid
    in N_required from 1e2 to 1e5. No law is chosen. Schubert 2003 is excluded and the exclusion
    is recorded: it prints exponents but no prefactor, so it yields relative life only and
    cannot vote on an absolute pass/fail. Adding a fifth absolute model could only widen the
    ambiguous band, never narrow it.
  predicted_life_envelope_cycles:
    Z1: "482 to 2499"
    Z2: "581 to 3206"
    Z4: "474 to 2388"
    model_form_spread_within_one_architecture: "5.2x"
  regions:
    robust_all_pass: "N_required <= 474"
    model_form_ambiguous: "474 < N_required <= 3206 -- a factor of 6.8, and 27.6 % of the swept
      decade range"
    robust_all_fail: "N_required > 3206"
  robust_Z1_fail_Z2_pass_band: >-
    NONE. Z1 fails under EVERY law only when N_required > 2499; Z2 passes under EVERY law only
    when N_required <= 581. The conditions are DISJOINT (581 < 2499) and zero of 601 grid points
    classify as a robust G2 reversal. AN EXPERIMENTAL ABSOLUTE-LIFE CALIBRATION IS NECESSARY
    BEFORE MECHANICS CAN ALTER THE FEASIBLE ARCHITECTURE SET.
  why_structural: >-
    The model-form spread within one architecture is 5.2x while the architecture separation is
    1.21-1.38x. A 5.2x uncertainty cannot resolve a 1.3x effect at ANY requirement. The relative
    result survives because the spread cancels in a ratio, and that same cancellation is why
    choosing a requirement cannot recover it.
  sole_blocker_claim: >-
    WITHDRAWN. Phase 0J-R recorded N_required as the sole blocker. At N_required = 1500 both
    architectures PASS under the strain family and FAIL under the energy family, so mission
    definition alone produces no decision. TWO OPEN PIECES for absolute G2: (1) the system
    mission / required life, and (2) an absolute-life calibration OR a decision region
    demonstrably robust to model form.

mission_requirement_0k:
  N_required: USER_INPUT_REQUIRED
  searched: >-
    The ENTIRE repository and all supplied source material, for service life, required cycles,
    cold boots, power cycles, thermal cycles, qualification target, field lifetime, availability
    target, HPC server lifetime, maintenance interval and workload duty cycle. NOTHING found.
    Every n_required in this repository is the TSV VIA COUNT, an unrelated quantity. The
    June-2026 and ECTC reference papers discuss reliability only qualitatively.
  machine_readable_contract: "configs/phase0k/mission_profile.yaml -- every field is
    USER_REQUIRED, UNKNOWN or NOT_APPLICABLE; a numeric value is INVALID without a populated
    mission_source"
  tool_refuses_to_guess: >-
    scripts/phase0k/mission_requirement.py refuses to emit a number without provenance, refuses
    to treat a QUALIFICATION type as a field mission, and refuses to collapse a multi-bin
    spectrum into one count.
  jedec_1000_cycles: "QUALIFICATION REFERENCE ONLY -- shown as a reference line on FIG-0K-A and
    never used as N_required"
  multi_bin_support: >-
    Miner-type summation IS source-backed for this framework: Syed derives the model from
    Monkman-Grant plus the TIME FRACTION RULE and builds it by summing damage over steps within
    a cycle. Caveat recorded: Syed warns the low-stress creep mechanism, under 5 % of strain in
    his accelerated tests, can become prominent at small field dT, so a shallow-cycle-dominated
    spectrum is outside the calibrated range and bins are retained separately.
  illustrative_only_examples: >-
    5 y / 1 boot per day = 1826 (AMBIGUOUS); 7 y / 2 boots per week + 1 workload cycle per day =
    3287 (ROBUST ALL FAIL); 5 y / 1 boot + 4 workload cycles per day = 9131 (ROBUST ALL FAIL);
    3 y never powered down = 0 (mechanism not life-limiting). NOT PROJECT REQUIREMENTS. Every
    non-trivial example lands in the ambiguous band or worse.

absolute_life_identifiability:
  one_condition_cannot_identify_the_law: >-
    PROVEN ALGEBRAICALLY. One measured life is one equation and each law has one free constant,
    so both fit it EXACTLY (C_fit = 1/(N*eps), W_fit = 1/(N*w)). Residual degrees of freedom for
    discrimination = 0. It re-labels the disagreement; it does not resolve it.
  but_one_condition_DOES_collapse_the_G2_ambiguity: >-
    Both laws are forced through the measured point and then extrapolate to the other
    architectures through their own metric ratio. Z1 becomes exact, Z2 known to 6.3 % and Z4 to
    3.0 % under EITHER law, because the three architectures sit within 6 % of each other in
    w/eps (123.2 / 126.9 / 134.9 MPa). Across 3721 (measured-life x required-life) cells the
    ambiguous region VANISHES: 50.8 % all-pass, 47.6 % all-fail, 1.6 % a genuine G2 pass, 0 %
    ambiguous. What it does NOT license is extrapolation to a DIFFERENT cycle, where the two
    laws diverge by up to 85 %.
  discrimination_algebra: "D = (eps_B/eps_A)/(w_B/w_A) = (w/eps)_A / (w/eps)_B -- an experiment
    discriminates ONLY to the extent its two conditions differ in w/eps. Maximising damage is
    irrelevant."
  w_over_eps_by_condition_MPa: >-
    COLD_SHALLOW (-40/+25) 209.2; SHORT_DWELL 142.5; WIDE_HOT 142.8; OP_BASELINE 126.9;
    LONG_DWELL 124.5; SMALL_DT 118.0; HOT_SHALLOW (+55/+125) 113.1. Temperature RANGE moves
    w/eps by 85 %, dT alone by 21 %, dwell by only 14 % -- because the creep law sees the
    OVERSTRESS sigma - sigma_y(T) and sigma_y is high at low temperature.
  minimum_identifiable_design: >-
    TWO CONDITIONS spanning w/eps, on at least ONE architecture. COLD_SHALLOW vs HOT_SHALLOW
    gives D = 1.849, an 84.9 % separation between the two laws' predicted life ratios,
    resolvable at 6.19 sigma with n = 16 even at the pessimistic Weibull slope beta = 6.
  two_architectures_one_profile_is_blind: "D = 1.063, only 6.3 % -- it VALIDATES the relative
    claim but CANNOT identify the law"
  recommended: "2 architectures x 2 conditions x 16 specimens = 64 packages"
  Z4_value_of_information: >-
    DO NOT FABRICATE. D = 1.03 against Z1, so no discrimination; same joint, same cycle, same
    stress regime, so no distinct mechanical regime; and Z4/Z1 = 0.956-0.984 sits INSIDE the
    6.3 % post-calibration model spread, so the test could not distinguish it from Z1.
  specimen_count_basis: >-
    Weibull MLE SE(ln eta) ~ 1/(beta*sqrt(n)); ratio of two cells sqrt(2)/(beta*sqrt(n)); plus
    8 % simulation uncertainty on the predicted metric ratio, STATED AS AN ASSUMPTION and larger
    than the 6.2 pp Phase 0I-R measured because material errors do not fully cancel across
    TEMPERATURE conditions. n = 4 is the bare 3-sigma minimum; n = 16 gives 6.19 sigma; the
    ceiling from simulation uncertainty alone is 7.7 sigma, so specimens beyond ~16 buy almost
    nothing.
  failure_definition: >-
    MATCHED TO THE CALIBRATION -- in-situ resistance > 300 ohms confirmed by ten further events
    within 10 % of the time of the first, Syed's exact rule, with MEAN life reported via
    eta*Gamma(1+1/beta) and beta ESTIMATED, not assumed. Right-censoring by maximum likelihood.
  experiment_status: "DESIGNED, NOT RUN. No measurements exist, none are synthesised, and no
    constant has been fitted to hypothetical data."

electrical_cost_of_reliability_0k:
  current_statement: "+1.688 W, 1.3 % of 126.1 W, buys +21-38 % RELATIVE solder-fatigue life"
  forbidden: "'+1.688 W buys exactly X cycles' -- absolute life is not validated"
  honest_limit: >-
    Even after perfect calibration the robust G2-pass band is N_required in (measured Z1 life,
    1.1665 x measured Z1 life] -- a window only 17 % wide. A 1.2-1.4x advantage reliably buys
    MARGIN; it flips a PASS/FAIL only if the requirement lands in that window.

experimental_priority:
  recommendation: "MISSION + EXPERIMENT IN PARALLEL"
  basis: >-
    Every non-trivial illustrative mission lands in the ambiguous band or in robust all-fail, so
    the mission alone will very probably not decide G2; the calibration alone cannot decide it
    either, because it needs a requirement to test against; the two are independent and neither
    blocks the other; and running them sequentially would add the test duration to the critical
    path for no information gain.

# ---------------------------------------------------------------------------
# PHASE 0K-R -- the Sec.2 structured current-state contract. Added 2026-09-14.
# Current-facing report fragments are generated FROM THESE FIELDS.
# ---------------------------------------------------------------------------
relative_life_0kr:
  status: VALIDATED
  z2_z1_min: 1.21
  z2_z1_max: 1.38
  source_laws: >-
    Four admitted primary-source formulations -- Syed 2004 author-corrected accumulated creep
    strain (Eq.14) and creep energy density (Eq.15), and Schubert 2003 SnAgCu strain (slope 1.3)
    and energy (slope 1.0).
  validated_scope: >-
    At the Phase-0J-R reference condition, on Syed's own 25 um interface extraction, with the
    life-law constant cancelling exactly in a ratio. UNCHANGED BY PHASE 0K-R: the constitutive
    extrapolation applies identically to all three architectures, so it is common mode and
    cancels in a ratio.

absolute_life_0kr:
  status: "CONDITIONAL -- NOT VALIDATED"
  model_form_spread: "4.1x between the strain and energy families on this joint; 5.2x across
    all four admitted formulations within a single architecture"
  calibration_required: true
  additional_limitation_found_in_0kr: >-
    The creep card is evaluated far outside its fitted STRESS window. Weighted by the solver's
    own dPEEQ increments, the median driving overstress is 54-91 MPa in the selected profiles
    and 69 MPa in the operating baseline, against a fitted window of 7.51-15.92 MPa -- 3.4x to
    7.2x above the top. 94-99 % of damage accumulates outside the window in EVERY profile.
    Phase 0J-R checked only the END-OF-HOLD overstress (~15 MPa, inside) and called the card
    "near its calibrated range"; that is corrected here as an overstatement.

mission_0kr:
  n_required_status: OPEN
  provenance_status: "USER_INPUT_REQUIRED -- no field or product requirement exists anywhere in
    this repository or in any supplied source; every n_required in the repo is the TSV via count"

g2_0kr:
  status: NOT_TESTED
  all_pass_region: "N_required <= 474 cycles"
  all_fail_region: "N_required > 3206 cycles"
  robust_z1_fail_z2_pass_region: >-
    NONE. Z1 fails under every admitted law only above 2499; Z2 passes under every law only
    below 581. The conditions are DISJOINT.
  ambiguous_interval_wording: >-
    The ambiguous interval 474-3206 cycles spans approximately 0.83 DECADES -- about 27.6 % of
    the three-decade 100-100,000-cycle LOGARITHMIC sweep. As a linear fraction it would be
    2.7 %, an order of magnitude smaller and misleading; the linear figure is not used.
  post_calibration_window_wording: >-
    After a package-specific calibration at one condition, a robust Z1-fail / Z2-pass decision
    requires N_f,Z1 < N_required <= R_min * N_f,Z1 with R_min = 1.1665 (the conservative,
    energy-law ratio). That is a relative window of (1.000, 1.1665], i.e. 16.65 % OF THE
    MEASURED Z1 LIFE, or 0.0669 decades -- 333 cycles wide if Z1 measured 2000.

experiment_0kr:
  status: >-
    READY TO EXECUTE WITH A DECLARED LIMITATION -- NOT FROZEN. Seven of the eight Sec.31
    acceptance criteria pass; criterion 2 (stress inside or defensibly near the calibration
    domain) FAILS and cannot be met by any profile.
  proposed_architectures: ["Z1 embedded", "Z2 backside"]
  z4_excluded_because: "w/eps 123.2 vs Z1's 126.9 gives D = 1.030 -- 3 % of model separation for
    a 50 % increase in specimen count"
  proposed_profiles:
    - "LOW_WIDE  45 -> 125 C, 5-min dwells, 3 C/min, 1.06 h/cycle"
    - "HIGH_NARROW 110 -> 150 C, 5-min dwells, 3 C/min, 0.61 h/cycle"
  withdrawn_profile: >-
    COLD_SHALLOW -40 -> +25 C. WITHDRAWN: 100 % of its damage accumulates below the 45 C creep
    calibration floor, and no sub-zero SAC305 creep data exists to extend the model. The
    Phase-0K claims attached to it -- D = 1.849, 85 % separation, 6.19 sigma -- are WITHDRAWN as
    current and retained only as historical experiment-design screening.
  temperature_domain_status: "PASS -- both selected profiles have T_min >= 45 C and accumulate
    0 % of damage below the creep floor"
  stress_domain_status: >-
    FAIL, IRREDUCIBLY. Damage-weighted median driving overstress 54-91 MPa against a 7.51-15.92
    MPa fit. This is a property of how hard this package loads its joints, not of the thermal
    profile, and no profile choice removes it.
  sample_size_status: >-
    n = 34 per cell, 4 cells, 136 packages. The Phase-0K n = 16 is SUFFICIENT for model
    discrimination (Z = 3.41) but INSUFFICIENT for the Z2/Z1 architecture test (Z = 2.49).
    Sec.15 requires the larger when one campaign answers both.
  model_discrimination_status: >-
    D = 1.4395, a 44.0 % separation between the two laws' predicted life ratios, at an EXPECTED
    DISCRIMINATION Z-SCORE of 3.44 with beta = 5.1 and n = 16, rising with n. NOT called a
    sigma: the statistic omits uncertainty in beta itself, censoring loss and the
    constitutive-domain error in the predicted D.
  weibull_beta:
    source_backed_range: "5.1 to 20.4 across 16 primary SnAgCu/SAC305 cells"
    sac305_only: [5.1, 5.4, 5.6, 10.1]
    observed_minimum_used: 5.1
    beta_6_is_conservative: false
    beta_6_percentile: "25th -- 4 of 16 cells fall below it"
  failure_criterion: >-
    Syed's rule, verified verbatim against the primary and now exact: in-situ continuity sampled
    every 2 minutes, event threshold > 300 ohms, failure = first crossing followed by ten
    further crossings within 10 % of the time of the first, manual confirmation within one week,
    intermittent opens counted. Reported statistic MEAN life via eta*Gamma(1+1/beta), with beta
    ESTIMATED, not assumed. Right-censoring by maximum likelihood.
  terminology:
    CONDITION: "one thermal profile"
    CELL: "one architecture x one thermal profile"
    CAMPAIGN: "the complete multi-cell experiment"
    rule: "A single thermal-cycle CONDITION cannot identify the fatigue-law family. A
      multi-condition CAMPAIGN can."
  experiment_has_been_run: false

next_step_0kr:
  mission_definition: "results/phase0k/SYSTEM_OWNER_MISSION_REQUEST.md -- eight questions,
    unchanged and still outstanding"
  experiment_preparation: "results/phase0kr/FINAL_BOARD_LEVEL_EXPERIMENT_PLAN.md -- 4 cells,
    136 packages, ready to execute with the stress-domain limitation declared"
  in_parallel: true
  parallel_basis: >-
    The mission defines demand and the experiment calibrates capability; neither depends on the
    other to begin. Re-verified against the updated decision map rather than assumed.
  optimizer_allowed: false

current_facing:

  executive_summary:
    hypothesis: "Distributed vertical power delivery is normally optimised on electrical and
                 thermal grounds alone. This project asked whether package thermo-mechanics --
                 warpage and stress -- is a SYNTHESIS constraint that changes which DVPD
                 architecture one would choose, rather than a downstream signoff check."
    answer: "No, on the evidence available. Phases 0G through 0I find a real, sign-stable,
             cross-validated mechanical RESPONSE to the electrical design variables -- now
             including a resolved, architecture-dependent SOLDER-FATIGUE response -- and no
             admissible inequality anywhere that could turn any of it into a constraint. Phase
             0H tested nine candidate thresholds against six admissibility conditions and
             admitted none. Phase 0I then added vertical placement as a genuine design variable
             and a temperature-dependent elastic/plastic/creep joint model, and Phase 0I-R
             verified that model's damage metric; the architectures separate by -35.8 % and
             +12.4 % in per-cycle inelastic strain, at 5.8x and 5.1x their uncertainty. What is
             still missing is not the response but the THRESHOLD. Phase 0J searched for a
             life law and a required life and found neither, recording ACCESS as the cause.
             The primary calibration papers were then supplied, and Phase 0J-R closes half of
             that gap: four SnAgCu formulations are admitted for RELATIVE life, Syed 2004's
             author-corrected calibration is reproduced, its 25 um averaging volume is matched,
             and Z2 outlives Z1. Phases 0L and 0L-R then audited the constitutive model under
             that result and found it fitted in the wrong stress variable, on a different alloy,
             and evaluated far outside its source window. The ORDERING survives all of that for
             a structural reason; its MAGNITUDE is a conditional envelope of 1.19 to 1.22, not a
             validated number. ABSOLUTE life stays conditional and NO required life exists.
             Mechanics is design-relevant as a response model, with a robust RELATIVE ordering
             and a conditional magnitude, and is still not a feasibility-set restriction."
    failure_mechanism_availability: "Of the eight mechanisms enumerated in Phase 0H, computability
             is now three-way and must not be reported as a single count. GLOBAL BENDING is
             available at M0 and is a driver rather than a failure. SOLDER FATIGUE / cyclic
             inelastic response is available at M2 as of Phase 0I -- convergent, verified in
             Phase 0I-R, and lacking only a life law. The remaining six -- RDL fracture,
             delamination, via fatigue, dielectric cracking, pad cratering and EM-assisted
             damage -- remain OPEN and uncomputed."
    method: "Nineteen sequential falsification gates (0B, 0C, 0D, 0D-R, 0E, 0F, 0G, 0H,
             0I, 0I-R, 0J, 0J-R, 0K, 0K-R, 0L, 0L-R, 0M, 0M-R, 0M-R2), each designed so that a negative result
             would stop the project rather than be absorbed. No gate was allowed to pass on a
             metric that failed mesh convergence, and no mechanical allowable was ever chosen
             after seeing results. From Phase 0H onward every automated guard must also be
             shown to FAIL on an injected violation before it is trusted."

    survived:
      - "Mechanics responds strongly to architecture: die warpage spans 1.8-15.6 um across the
         frozen 20-case DOE at fixed load, footprint and heat (Phase 0C)."
      - "Substrate thickness is a genuine three-domain variable and the electrical and
         mechanical preferences OPPOSE: electrically thinner is better (ARCH_B monotone in
         9 corners of 9), mechanically thicker is better (S_h = -0.039 to -0.886 in the free
         package and all five explicit boards). Over the realizable band the trade is
         4.04 W of ARCH_B loss against 29.3 % of mounted warpage. The thickness trend is
         PRESERVED in the M2-rung solder metrics and is smaller there than in global warpage:
         across all eleven z-sweep points it is monotone in every architecture, -5.6 % (Z1),
         -6.1 % (Z2) and -17.2 % (Z4) in accumulated inelastic path, against 29.7-52.6 % in
         warpage over the same range, so warpage overstates the benefit by 3-5x. The
         superseded Phase-0H figure of 1.96 %, which belonged to the REJECTED smeared
         interface-shear proxy and sat 7x below that proxy's own uncertainty, is withdrawn as
         a current result and is retained only in the Phase-0H historical section."
      - "The GaN device heights are now SOURCED from manufacturer datasheets -- 685 um high
         side, 606 um low side -- against the 0/100/250 um envelope earlier phases invented."
      - "COMPONENT-HEIGHT REALIZABILITY IS ARCHITECTURE DEPENDENT. Component height constrains
         substrate thickness only where the converter is EMBEDDED (h_sub >= 1.276 mm). Where it
         sits below, above or beside the substrate, nothing it contains constrains h_sub and
         the bound falls to the source-demonstrated 0.300 mm TSV layer -- a 4.3x wider range."
      - "Vertical integration is a real architecture variable with a measurable reliability
           consequence, and the effect is RESOLVED against uncertainty: the backside
           architecture shows 35.8 % less local damage than embedded and the power-die
           architecture 12.4 % more, against a 6.2 pp and 2.4 pp spread across all material,
           mesh and regularisation perturbations (5.8x and 5.1x). All three inelastic measures
           -- accumulated path length, strain range and dissipated energy -- give the same
           ranking and magnitudes to within 2 pp."
      - "Temperature-dependent failure physics materially changes the answer, but the SIGN of
           the change depends on which inelastic measure is used, and Phase 0I-R makes that
           explicit. Against a no-creep model the STRAIN-based metric falls 29.8 % while the
           DISSIPATED INELASTIC ENERGY rises 164.6 % over the same solves. Creep relaxes stress
           and suppresses plastic strain accumulation, yet deforms at sustained stress and so
           dissipates far more. Neither number may be quoted as `damage decreased` without
           naming the measure. The Phase-0I -27.2 % figure is valid ONLY as a statement about
           the strain-based metric."
      - "Temperature enters the damage physics through more than thermal expansion: a
           temperature-INDEPENDENT model moves only -0.2 % as the cycle mean shifts 25 to 75 C,
           while the full model moves +22.7 %. The older model class was structurally blind to
           where in temperature a cycle sits."
      - "Under the PHYSICAL cooler the Z-architectures DO separate in temperature, and
           ARCH_Z2 is the hottest of the principal candidates: 127.06 C against 118.80 C for
           ARCH_Z1. It nevertheless carries 16.3 % LESS corner-joint driver. Under the retired
           calibrated boundary the joint temperatures spanned only 81.10-83.21 C and their
           correlation with damage was r = +0.017, which is why earlier phases described these
           architectures as separating on mechanics alone; that statement is historical and
           belongs to that boundary condition. Ranking by package T_max is NOT equivalent to
           ranking by the solder-fatigue driver, because geometry- and CTE-induced deformation
           and the local constitutive response are distinct mechanisms. Temperature-dependent
           physics matters and must not be dismissed."
      - "The physical metal stack is sourced, not assumed: 10 um Cu, 10/2 um line/space, 2 VDD
         + 2 GND layers from ECTC-2024 Table I, whose own derived quantities the model
         reproduces to better than 2 %."
      - "No AC correction is needed at the switching frequency -- HFSS shows loop resistance
         flat to 0.18 % below the 19.1 MHz skin crossover, with f_sw two orders below it."
      - "The rail carried by a vertical interconnect changes its loss by ~1960x for fixed
         transferred power, and which rail it carries is architecture-specific."
      - "A via field's loss is proportional to current only under minimum-capability
         provisioning; under geometric allocation the same field obeys P ~ I^2."
      - "The model chain is numerically sound: energy balance closes to +-0.000 %, warpage is
         mesh-converged to 0.50 %, and an independent solver (MOOSE) reproduces candidate
         ordering at both 240 W and 1 kW."

    failed:
      - "Regulator count is mechanically inert (+0.02 % for 4->6, -4.07 % for 4->8), which
         killed the variable the original novelty argument leaned on."
      - "Tile aspect ratio is inert (-1.76 %), and on this square vehicle the two aspect cases
         are provably identical by symmetry."
      - "Interface peel never converged (19-20 % per refinement against a <10 % target) and is
         excluded from all decision logic."
      - "The geometry used by Phases 0B-0E was not buildable: the selected converter needs a
         720 um cell and the mechanical vehicle used a 150 um tile inside 200 or 500 um
         substrates. Trend DIRECTIONS survive re-running on realizable geometry; every absolute
         magnitude from those phases is superseded."
      - "The Phase-0B cooling calibration was not transferable -- at 1 kW the correct film
         coefficient is 9.47x larger."
      - "Substrate-side-only cooling, which is the reference system's actual topology, cannot
         reach the reference junction temperature at 1 kW: it floors at 90.96 C and reaches
         110.4 C at h_sub = 2.00 mm."
      - "The compact BC-B foundation is not a valid model of a mounted package. It clamps all
         three degrees of freedom, never recovers its own free limit (0.739 um against
         8.287 um on the identical mesh), and no support stiffness k* exists over seven
         decades."
      - "DEFECT #30: per-regulator and system-wide loss terms were summed together for three
         phases, understating every vertical tier by n_vr -- 49x at the 1 kW reference. It
         inverted the Phase-0F architecture conclusion and survived a 25x tighter convergence
         tolerance."
      - "DEFECT #31: the semantic ledger built to catch stale claims could not fail, because
         its exonerating vocabulary matched ordinary English prose within a +-800-character
         window."
      - "DEFECT #32: the single source of truth controlled the claims ledger but not the
         Executive Summary, governing equations, validation status, novelty, limitations,
         publication claims or next steps. Seven current-facing statements were stale behind a
         green build."
      - "Global warpage does not predict local interconnect loading (Spearman 0.112 over 70
         paired runs) and inverts sign between assembly states (-0.793 free, +0.349 mounted).
         The quantity the project measured best is not the quantity that matters."
      - "Of eight enumerated failure mechanisms, TWO are now computable and SIX are not. Global
         bending is computable at M0 but is a driver, not a failure. Solder fatigue became
         computable at M2 in Phase 0I, was verified in Phase 0I-R, and Phase 0J-R admitted
           four primary-source SnAgCu life laws for it -- so it now yields a ROBUST
           RELATIVE ORDERING with a CONDITIONAL magnitude, though still no pass/fail: absolute life is model-form
           uncertain at 4.1x and no required life exists.
         mechanisms the reference paper itself names -- RDL shear and delamination -- which are
         absent from the mechanical model entirely."
      - "No admissible mechanical criterion exists. Nine candidates, zero admitted; every
         published warpage allowable located is a manufacturing or solderability limit."

    novelty: "The defensible contribution is NOT 'mechanics changes the optimum' -- it does
              not, and with a pure added objective it structurally cannot. It is an AUDITED
              CROSS-DOMAIN DVPD MODEL AND A FALSIFICATION SEQUENCE that establishes where
              mechanics is and is not design-relevant: physical-realizability coupling that
              excludes an entire previously-swept design range; rail-aware interconnect
              modelling; corrected RDL / bump / TSV losses with explicit allocation policy; an
              electrothermal fixed point with per-regulator local temperature; a mounted
              package-mechanics model that is continuous with its own free limit; a
              demonstrated thickness response opposition; and the negative result that
              footprint opposition disappears once the package is actually mounted."

    limitations:
      - "No admissible mechanical criterion exists, so G2 is NOT TESTED and no mechanical term
           may enter a feasibility test. Phase 0I supplies the METRIC half of G2 -- convergent,
           validated, tied to a documented failure mechanism. Phase 0J-R then supplied part of
           the ALLOWABLE half: four primary-source SnAgCu formulations are ADMITTED FOR RELATIVE
           LIFE, Syed 2004's author-corrected calibration was reproduced, and its 25 um averaging
           volume was matched. ABSOLUTE life remains CONDITIONAL -- the strain- and energy-based
           models disagree 4.1x on this joint, whose w_acc/eps_acc sits 4.3x off the calibration
           locus -- and NO required life exists. The Phase-0J statement that no SAC305 life law
           was retrievable is SUPERSEDED: it was an ACCESS limitation and the primary papers have
           since been supplied."
      - "THREE DIFFERENT THINGS, AND THEY MUST NOT BE CONFLATED. (1) THE RELATIVE ORDERING
             IS ROBUST: Z2 accumulates less solder-fatigue damage than Z1 under every admitted
             constitutive model, every admitted life law, every profile and all three response
             metrics. It originates in the GLOBAL thermoelastic model, which imposes a 32 %
             larger corner shear on Z1 and contains no solder law at all: the global package
             supplies a constitutive-law-independent deformation driver favoring Z2, and every
             presently testable constitutive/life-law combination preserves that ordering.
             (2) THE MAGNITUDE IS CONDITIONAL, NOT
             VALIDATED: the strain-family envelope is 1.19 to 1.22 at the operating baseline,
             conditional because 99.8 % of the joint's damage is generated above the
             7.51-15.92 MPa window the creep law was fitted in, on Sn3.9Ag0.6Cu rather than
             SAC305. The permitted wording is 'conditional relative-life envelope'; 'validated
             relative life' is NOT earned. (3) ABSOLUTE LIFE AND REQUIRED LIFE REMAIN OPEN --
             the strain and energy formulations disagree 4.1x on this joint, and no field or
             product requirement exists anywhere in this repository."
      - "Two of eight failure mechanisms are now addressable: global bending (a driver) and
           solder fatigue (a real mechanism, added in Phase 0I). RDL damage, delamination, CPI
           and TSV interaction still need geometry or physics the model does not have, and two of
           those are mechanisms the reference paper itself names."
      - "The reliability submodel is displacement-driven and models one joint at the worst
             location. Its creep law is a variable-consistent SnAgCu Norton surrogate,
             high-stress extrapolative: fitted over 7.51-15.92 MPa on Sn3.9Ag0.6Cu, while the
             joint's damage-weighted median stress is about 82 MPa and 99.8 % of its damage lies
             outside that window. Two constitutive FAMILIES can be parameterised there and only
             one can be integrated, because this solver fails above a Norton exponent of 9 to 10."
      - "The two PHASE-0H local proxies remain unfit for decisions: smeared interface shear is
           non-monotone under mesh refinement (7.6 % spread) and relative displacement carries
           26.5 % spread from an unsourced underfill modulus. THEY ARE NOT THE CURRENT METRIC.
           The Phase-0I M2 metric replaces them and passes mesh convergence (1.90 %), creep-
           tolerance insensitivity (0.02 %) and corner-regularisation stability (6.4 %)."
      - "MLCC height remains OPEN -- Murata is not retrievable in this environment -- so the
           realizable substrate bound is a 250 um band rather than a number."
      - "Mounted warpage magnitudes (9.7-29.2 um) are an engineering envelope from an assumed
           board, not a prediction. Only signs and orderings are claimed."
      - "All warpage is INCREMENTAL OPERATIONAL with a 25 C stress-free reference. Assembly
           pre-stress is bounded, not modelled: a 175 C reference raises mounted magnitudes by
           up to 54 %."
      - "GaN device height is SOURCE_BACKED (manufacturer datasheets, Phase 0H). MLCC height
           remains OPEN. Complete packaging clearance for the thinnest non-embedded stack is
           OPEN: 0.300 mm is COMPONENT-HEIGHT-REALIZABLE under the current Z-architecture model
           and a source-demonstrated TSV-layer thickness, NOT a manufacturability guarantee."
      - "The electromigration reliability limit for copper TSVs is open; what is closed is the
           provisioning current density the sources actually used."
      - "ECTC-2024's absolute loss magnitudes are not reproducible from its printed model, so
           RDL magnitudes are always quoted with their stack."
      - "Q3D Extractor is not licensed, so DC resistance is validated with a conduction FE
           rather than a commercial extractor. Icepak returned a clamped 5000 K solution on this
           package model and is unusable."
      - "Interface peel is excluded for non-convergence; interface shear converged but has no
           allowable."

    next_work: "Phase 0M-R2 is the current authoritative phase, and its ranked follow-up
                is recorded in results/phase0mr2/open_items.md. In order: (1) source the
                power-die construction, which is the only thing keeping the ARCH_Z4 ordering
                conditional; (2) obtain a transitional-regime Nusselt correlation, or restrict
                the cooling model to Re < 2300 and say so; (3) attack the area, routing and
                current-density shortfalls TOGETHER with the three package clearances, because
                clearances alone make nothing buildable; (4) high-stress SAC305
                characterisation, which remains the dominant blocker on every absolute
                reliability number and is untouched by this phase; (5) complete the conjugate
                CFD benchmark. The mission requirement remains separately OPEN and the
                optimizer remains FORBIDDEN."


  governing_equations:
    - id: tsv_allocation
      equation: "n_req = ceil(I / I_max);  n_req <= n_alloc <= n_avail;
                 R_field = R_single / n_alloc"
      status: CURRENT
      note: "Phase 0E separated three quantities that Phase 0D-R had conflated into one.
             Electrical resistance uses n_ALLOCATED, which is what the design actually
             instantiates. Using n_req makes P ~ I look like a physical law when it is an
             allocation policy."
      superseded_form: "R_field = R_single / n_req  (Phases 0D, 0D-R)"
      symbols_required: ["n_req", "n_alloc", "n_avail"]
    - id: feasibility
      equation: "infeasible if n_req > n_avail(A_fp, pitch)"
      status: CURRENT
      note: "Unchanged. Feasibility is set by what the footprint can physically hold, not by
             what the allocation policy chose."
    - id: m2_constitutive
      equation: "sigma = C(T) : (eps_total - eps_thermal(T) - eps_in);
                 eps_dot_in = A(T) * (sigma_vm - sigma_y(epsbar_in))**n(T) for
                 sigma_vm > sigma_y, and eps_dot_in = 0 identically otherwise; m = 0"
      status: CURRENT
      rung: "LOCAL M2 -- solder-joint submodel only, NOT the global package model"
      note: "CORRECTED IN PHASES 0L AND 0L-R. The earlier form eps_dot_cr = A(T) sigma^n(T)
             is WITHDRAWN: it is NOT what a *VISCO step executes. The solver drives creep
             with the OVERSTRESS sigma_vm - sigma_y and returns exactly zero below yield,
             traced in CalculiX 2.23 src/incplas.f and confirmed to 1.2e-5 over 7603 probe
             increments. There is NO rate-independent plastic strain in a *VISCO step.
             A(T), n(T) come from 19 creep points on Sn3.9Ag0.6Cu -- NOT SAC305 -- fitted
             over 7.51-15.92 MPa against TOTAL APPLIED STRESS, which is not the variable
             the solver consumes (DEFECT #40). The selected model M1 removes the yield
             threshold so that fit and solver share a variable; it is labelled a
             variable-consistent SnAgCu Norton surrogate, high-stress extrapolative, and
             99.8 % of the joint damage is generated outside its fitted window. A(T) and n
             are interpolated LINEARLY between card rows by the solver, not by Arrhenius;
             any Arrhenius relation exists only in how the row values were generated."
    - id: m2_damage_metric
      equation: "d_eps_in(cycle k) = PEEQ(t_end,k) - PEEQ(t_end,k-1),
                 volume-averaged over the solder core with a one-element corner exclusion band"
      status: CURRENT
      rung: "LOCAL M2"
      note: "PEEQ is CalculiX's ACCUMULATED equivalent inelastic strain. Phase 0I-R proved by
             experiment that it includes BOTH plastic and creep: with a creep-only material and
             no *PLASTIC card, PEEQ / eq(eps_inelastic) = 1.0000. The metric is therefore the
             inelastic PATH LENGTH traversed per cycle, not a strain RANGE; the two differ by a
             factor of 3.72 here and the naming is fixed accordingly."
    - id: m2_stabilised_cycle
      equation: "the stabilised cycle is the first whose d_eps_in differs from the previous
                 cycle by less than 5 %; reported values are from cycle 4 of 4"
      status: CURRENT
      rung: "LOCAL M2"
      note: "Achieved 0.48-2.00 % cycle-to-cycle change at cycle 4 for every architecture. The
             metric is a per-cycle DIFFERENCE of an accumulated quantity, so it is not
             contaminated by total accumulated creep."
    - id: no_life_equation
      equation: "NONE"
      status: AVAILABLE_FOR_RELATIVE_LIFE_ONLY
      phase0j_result: "The search was RUN, not deferred: 762 works, 10 candidate laws, 10
                 predeclared admissibility criteria, 0 ADMISSIBLE -- with ACCESS recorded as the
                 cause."
      phase0jr_result: "SUPERSEDED. With the primary papers supplied, the current life equation
                 is N_f = (0.0468 * eps_acc)^-1 (Syed 2004 author-corrected, Eq.14, accumulated
                 creep strain over two 25 um solder layers), with N_f = (0.0015 * w_acc)^-1 as
                 the energy-based companion. Both are ADMITTED FOR RELATIVE LIFE. Neither is
                 admitted for ABSOLUTE life: they disagree 4.1x on this joint because its
                 w_acc/eps_acc is 4.3x off the calibration locus."
      note: "SUPERSEDED BY PHASE 0J-R. The Phase-0I statement that no exponent is sourced no
             longer holds: two primary sources now bound it -- Syed 2004 derives -1
             theoretically and measures -0.9607, and Schubert 2003 fits -1.3 for SnAgCu. C
             still cancels in a ratio. That is necessary but NOT sufficient: Phase 0L-R
             shows the response metric the law consumes is itself produced by an
             extrapolated constitutive model, so the RELATIVE ORDERING is robust while the
             MAGNITUDE is a CONDITIONAL envelope of 1.19 to 1.22. 'Validated relative life' is
             WITHDRAWN. What is also NOT current is an ABSOLUTE lifetime equation: the strain and energy
             formulations both have constants but disagree 4.1x on this joint."
    - id: scope_rule
      equation: "P_tier,SYSTEM = n_vr * P_tier,PER_REGULATOR;  P_PDN = sum over tiers of
                 SYSTEM-scope terms only"
      status: CURRENT
      note: "Phase-0H structural guard for DEFECT #30. vertical_tier_per_regulator() returns a
             PER_REGULATOR quantity and rdl_network_solve() returns a SYSTEM quantity; adding
             them raises ScopeError. Negative-tested in tests/phase0h/test_scope.py."

  validation_status:
    electrical:
      status: SUPPORTED
      done: "Multilayer RDL sheet model agrees with an independent MOOSE conduction solve to
             0.45-1.10 % on power across three placements under one calibration. HFSS confirms
             no AC correction is needed below the 19.1 MHz skin crossover."
      not_done: "Q3D Extractor is not licensed, so no commercial-extractor cross-check of DC
                 resistance exists."
    thermal:
      status: PROVEN
      done: "Full 3-D MOOSE package thermal cross-check COMPLETED. Phase 0E ran TH-1..TH-5 with
             spatially mapped Joule heat: candidate ordering preserved exactly, maximum
             discrepancy 1.66 %, mean 1.05 %. Phase 0F repeated it at the 1-kW reference on the
             decisive thickness pair: 2.2-2.8 K on T_max, same thickness trend, energy balance
             closed to 3e-8 % in both codes."
      not_done: "Icepak remains unusable -- it returned exactly 5000 K on every object, a
                 solver clamp from applying an external boundary condition to an internal
                 solid/air interface. That result was discarded and is never used."
    mechanical:
      status: SUPPORTED
      done: "Analytic free-expansion check exact; four graded mesh levels with die warpage
             converged to 0.50 %; BC-A reaction forces <= 4.3e-10 N, so the constraint
             manufactures no stress; the explicit BGA + board assembly is continuous with the
             free package (+18.1 % with a vanishing board, the residual being the BGA layer's
             own contribution)."
      not_done: "No ANSYS structural validation exists. No assembly pre-stress model, no
                 fracture mechanics, no cohesive zone."
      model_rungs: "TWO DISTINCT MODELS, and they must not be conflated.
        GLOBAL M0 -- linear thermoelastic package mechanics: warpage, curvature, and the
        relative displacement handed to the submodel. No plasticity, no creep. This is what
        Phases 0B-0H used and every warpage statement in this project belongs to it.
        LOCAL M2 -- temperature-dependent elastic + VISCOPLASTIC OVERSTRESS creep
        solder-joint submodel, cycled to a stabilised hysteresis loop. Phase 0L proved
        from the CalculiX source and by probe that a *VISCO step executes NO
        rate-independent plastic corrector -- one consistency parameter carries the whole
        inelastic increment, so the *PLASTIC card supplies only a threshold to the creep
        law. The earlier wording 'rate-independent plastic + Norton creep' is WITHDRAWN. Added in Phase 0I,
        verified in Phase 0I-R. Every damage statement belongs to it.
        M1 is the intermediate rung used in Phase 0G Sec.11: M0 with a shifted stress-free
        reference, a pre-stress SENSITIVITY rather than a pre-stress model."
      local_m2_validation: "free thermal expansion exact to 0.000 % with zero inelastic strain;
        creep rate x535 and yield -57 % across the operating range; -49.6 % stress relaxation in
        a 600 s constant-strain hold; per-cycle metric stabilised to 0.4 %. Mesh 1.90 %, creep
        tolerance 0.02 %, corner-exclusion band 6.4 %."
      restraint_models: "BC-A is 3-2-1 rigid-body suppression. BC-B applies *BOUNDARY {n},1,3 --
                         ALL THREE degrees of freedom on the underside plane -- so it is a
                         CLAMP and NOT a compliant mounted support; Phase 0G withdrew it as a
                         model of a mounted package. BC_BOARD is an explicit BGA + PCB stack
                         restrained only by 3-2-1 anchors and is the model used for mounted
                         conclusions."

  publication_claims:
    defensible:
      - "Physical realizability is a first-class DVPD design coupling: the converter component
         stack sets a hard lower bound on substrate thickness that excluded the entire range
         swept in Phases 0B-0E."
      - "The rail a vertical interconnect carries changes its loss by ~1960x at fixed
         transferred power, and it is architecture-specific."
      - "Via-field loss scaling is set by allocation policy, not by physics alone."
      - "An electrothermal fixed point with per-regulator local temperature is required at
         kilowatt scale; a single global T_max is not adequate."
      - "The mechanical thickness response opposes the electrical one, with a sign that is
         stable across 20 combinations of assembly model, stress-free reference and thermal
         boundary."
      - "NEGATIVE RESULT: footprint opposition does not exist in a mounted assembly. It is
         positive only in the unmounted and clamped idealisations and negative on all five
         explicit boards, in the direction the reference paper itself asserts."
      - "NEGATIVE RESULT: a compact clamped foundation is not a substitute for an explicit
         board. It sits in the opposite regime and cannot reproduce its own free limit."
    must_not_claim:
      - "That mechanics binds, constrains, or restricts the feasible design set. No admissible
         criterion exists."
      - "That footprint is an ETM opposition in a mounted assembly."
      - "Any absolute mounted warpage value as a prediction."
      - "Any comparison of the computed warpage against a 'conventional' or 'typical'
         package limit. No source satisfying the admissibility test has been obtained. The
         only supportable statement is that simulated mounted INCREMENTAL OPERATIONAL warpage
         stays below 40 um over the tested envelope; whether that is safe or constraining is
         UNKNOWN."
      - "Any board-level conclusion drawn from a BC-A or BC-B result."

# ============================================================================================
# ARCHITECTURE AND MECHANISM STATUS (Phase-0I Sec.27)
# ============================================================================================
# Phases 0B-0H reported a single status for "the architecture" and a single status for
# "mechanics". Neither is a single thing. Vertical integration is an architecture VARIABLE
# (DEFECT #33) and the mechanical side has three separable layers -- global deformation, local
# damage, and a lifetime criterion -- which are at three different maturities.
architecture_status:
  ARCH_Z1_EMBEDDED:
    source_status: "described by June-2026, but the source itself calls multi-layer substrate
                    stacking with active and passive components an OPEN CHALLENGE"
    realizability: "h_sub >= 1.276 mm (MLCC nominal); the ONLY architecture whose components
                    constrain substrate thickness"
    tsv_rail: "HV, 23.4 A"
    electrical: "BEST, 126.090 W at its 1.30 mm floor -- because the embedded cell shortens
                 the via field to 74 um"
    local_damage: "6.512e-3 per stabilised cycle -- the baseline"
    status: SUPPORTED
  ARCH_Z2_BACKSIDE:
    source_status: "SOURCE-BACKED. June-2026 Sec. I 'in-substrate AND backside'; Sec. II
                    'VR components can be vertically stacked on the backside of a substrate
                    and interconnected through TSVs'"
    realizability: "h_sub >= 0.300 mm; no component constrains it"
    tsv_rail: "LV, 1000 A -- forced by geometry, not chosen. 14 148 TSVs, which matches
               June-2026 Table III's own PL3 count exactly"
    electrical: "+1.688 W vs embedded, and it must stay thin: via loss runs 1.698 W at
                 0.30 mm to 11.319 W at 2.00 mm"
    local_damage: "4.179e-3, the LOWEST -- 35.8 % below embedded, resolved at 5.8x the
                   perturbation spread. Any conversion to life is PARAMETRIC in the fatigue
                   exponent, which is UNSOURCED; the Phase-0I '1.9-3.8x' is withdrawn."
    status: SUPPORTED
  ARCH_Z4_POWER_DIE:
    source_status: "PARTIAL -- an extrapolation of the source's chiplet framing, not a
                    configuration it states"
    realizability: "h_sub >= 0.300 mm"
    tsv_rail: "HV, 23.4 A"
    electrical: "+0.030 W vs embedded -- effectively free"
    local_damage: "7.320e-3, the HIGHEST -- 12.4 % above embedded, 0.70-0.84x relative life"
    thermal_note: "its converter sits in the die-to-cooler path, but at the joint this does
                   not show: T_joint 81.10 C, the coolest of the three"
    status: SUPPORTED
  ARCH_Z5_2P5D_LATERAL:
    source_status: "not the source's architecture; retained as the LATERAL-PATH BOUND"
    realizability: "h_sub >= 0.300 mm"
    electrical: "THE TESTED TOPOLOGY IS ELIMINATED -- 768.07 W of modelled lateral RDL loss,
                 52.8 % efficiency. This prices the specific arrangement in which a long lateral
                 interposer path carries the ~1 V / 1 kA rail."
    scope_correction: "Phase 0I wrote 'Z5 is eliminated' and read this as pricing 2.5D as a
      CLASS. That over-reaches and is withdrawn. The result eliminates THE TESTED
      LOW-VOLTAGE-LATERAL TOPOLOGY only. Untested 2.5D variants that would change the answer
      include higher-voltage lateral distribution, distributed conversion across the interposer,
      shorter low-voltage runs, intermediate-voltage distribution with local point-of-load
      conversion, and different plane geometries. None were modelled, and Phase 0I-R does not
      model them either -- it only corrects the claim."
    status: REJECTED_ON_ELECTRICAL_GROUNDS
  ARCH_Z3_TOPSIDE:
    status: REJECTED_AS_PHYSICALLY_UNSOUND
    reason: "puts the 1 V / 1000 A rail on a multi-millimetre lateral path -- the very loss
             DVPD removes -- while consuming the die's cooling surface. Strictly worse than
             Z5, which at least uses a purpose-built interposer."

mechanical_layer_status:
  global_deformation:
    status: PROVEN
    what: "die and package warpage under the operational thermal load"
    maturity: "mesh-converged to 0.02-0.50 %, material-robust to 4.0 %, sign-stable across
               20 combinations of assembly model, reference state and thermal boundary"
    caveat: "It is a DRIVER, not a failure mechanism, and Phase 0I shows it OVERSTATES the
             reliability benefit of a thicker substrate by 3-5x: over the same thickness range
             warpage moves 29.7-52.6 % while local damage moves only 5.6-17.2 %."
    phase0h_correction: "Phase 0H reported no correlation (Spearman 0.11) between global
      warpage and a SMEARED-SHEAR proxy. Phase 0I reported Spearman 1.000 within each
      architecture and 0.909 pooled against the new damage metric, and described that as
      warpage tracking damage. Phase 0I-R rescopes it: within a single architecture the
      substrate-thickness sweep is monotonic and BOTH quantities move monotonically with it, so
      a rank correlation of 1.000 is close to guaranteed by construction and carries little
      information. The defensible statement is DIRECTIONAL ONLY -- within the tested thickness
      sweeps global warpage tracks the DIRECTION of the local damage metric but not its
      magnitude, changing 29.7-52.6 % where damage changes only 5.6-17.2 % and so exaggerating
      the apparent reliability benefit by roughly 3-5x. GLOBAL WARPAGE IS NOT A QUANTITATIVELY
      CALIBRATED RELIABILITY SURROGATE."
  local_damage:
    status: SUPPORTED
    what: "Delta-eps_in per stabilised cycle in the corner BGA, volume-averaged with a corner
           exclusion band"
    maturity: "FIRST local mechanical metric in this project to pass mesh convergence
               (1.90 %), tolerance insensitivity (0.02 %) and regularisation stability (6.4 %)
               together. Constitutive model sourced for SAC305 and cross-checked twice."
    caveat: "displacement-driven submodel, one joint at the worst location, Norton surrogate
             valid 7.5-16 MPa, E(T) slope and CTE assumed"
  lifetime_criterion:
    status: NOT_AVAILABLE
    what: "N_f = f(Delta-eps_in) for SAC305, and a required life"
    blocker: "both candidate open-access life-law sources return HTTP 403 to publisher
              servers; no mission profile exists for the reference system"
    consequence: "no N_f is predicted anywhere in this project. Relative life is reported
                  instead, which is parameter-free in the life-law constant C."

# ============================================================================================
# PHASE-0I-R CLOSURE FIELDS (Sec.19)
# ============================================================================================
# Phase 0I reported a quantity called "damage" and a set of architecture claims. These fields
# state exactly what that quantity is, exactly how far each claim reaches, and which parts are
# resolved against uncertainty. Report text is generated from here.
reliability_metric:
  name: "d_eps_in -- accumulated equivalent inelastic strain per stabilised cycle"
  exact_definition: "d_eps_in(k) = PEEQ(t_end of cycle k) - PEEQ(t_end of cycle k-1),
    volume-averaged over the solder core with a one-element corner exclusion band:
    d_eps_in = sum_e(d_PEEQ_e * V_e) / sum_e(V_e)"
  units: dimensionless (strain)
  solver_output: "CalculiX 2.23 PEEQ from *EL PRINT. CEEQ, CE and PE are aliased to PEEQ by the
    solver; no separate creep field is produced."
  plastic_component: INCLUDED
  creep_component: INCLUDED
  creep_verification: "PROVEN BY EXPERIMENT, not inferred. With a creep-only material and NO
    *PLASTIC card in the deck, PEEQ is non-zero and PEEQ / eq(eps_inelastic) = 1.0000. The
    identity holds in four single-element probes and, at the first output, in the multiaxial
    temperature-varying joint (1.0029-1.0035)."
  is_a_range: false
  range_clarification: "PEEQ is an ACCUMULATED path length, not a state, so the per-cycle
    difference is the inelastic PATH LENGTH traversed in one cycle, NOT a strain range. At
    stabilisation the ratio path-length / range is 3.72, not the 2.0 a fully-reversed uniaxial
    cycle would give, because the OFF-ON-OFF cycle is a multi-reversal path in strain space.
    Any future life law must be matched to the path-length form or the metric converted."
  stabilized_cycle_definition: "the first cycle whose d_eps_in differs from the previous cycle
    by less than 5 %; all reported values are cycle 4 of 4, achieved at 0.48-2.00 %"
  numerical_status: "CONVERGENT -- mesh 1.90 % over the final refinement, creep tolerance
    0.02 %, corner-exclusion band 6.4 % across 0-2 elements. Including the corner LOWERS the
    value, so the metric is not corner-dominated."
  metric_agreement: "The architecture ranking and magnitudes are the SAME under all three
    inelastic measures -- accumulated path length, instantaneous strain range, and dissipated
    inelastic energy -- to within 2 pp (Z2 -35.8/-35.7/-37.7 %, Z4 +12.4/+12.6/+13.0 %). The
    architecture conclusion therefore does not depend on the choice of measure."
  metric_disagreement: "The CREEP-INCLUSION question DOES depend on the measure: enabling creep
    moves the strain metric -29.8 % and the energy metric +164.6 %. Direction-of-change
    statements must always name the measure."

relative_life:
  status: PARAMETRIC LIFE-LAW SENSITIVITY -- NOT A LIFETIME PREDICTION
  formula: "N_f = C * d_eps_in^(-m);  N_f,2/N_f,1 = (d_eps_in,1 / d_eps_in,2)^m"
  C_cancels: true
  exponent_required: true
  exponent_status: "SOURCED AS OF PHASE 0J-R -- was UNSOURCED in Phase 0I-R. Syed 2004 derives
    -1 from Monkman-Grant plus a time-fraction rule and measures -0.9607; Schubert 2003 fits
    -1.3 for SnAgCu. The exponent is bounded, not free."
  exponent_provenance: "Phase 0I annotated a figure with 'typical solder k is 1.5-3'. That range
    was written from general knowledge, appears in no retrieved source, and was never labelled.
    It WAS the sole basis of the Phase-0I headline '1.9-3.8x relative life'. SUPERSEDED: Phase
    0J-R obtained the exponent from two primary sources, so the Phase-0I parametric span
    (m = 0.5-5, ratio 1.25 to 9.18) is withdrawn."
  correction: "Phase 0I said relative life is 'parameter-free in the life-law constant'. That is
    literally true of C and MISLEADING as written, because it invites the reading that the
    ratio is parameter-free. It is not: the exponent m does not cancel. Over m = 0.5 to 5 the
    Z2/Z1 ratio spans 1.25 to 9.18 -- a factor of 7.4 from the exponent alone."
  what_may_be_claimed: "the METRIC ratio, which is a model output: Z2 is 35.8 % below Z1 and Z4
    is 12.4 % above it. Any conversion to life must be labelled parametric in m."


# SINGLE SOURCE OF TRUTH for what this project currently claims.
#
# WHY THIS FILE EXISTS (Phase-0G defect #29)
# The full report stated the same claim in several places -- Executive Summary, Positive
# Results, Negative Results, the uncertainty ladder, Next Steps -- and each phase updated
# only some of them. By Phase 0F the document simultaneously asserted that "200 -> 500 um is
# win/win/win and survived every correction" and that those thicknesses are unbuildable; that
# "no architecture-dependent thickness tradeoff exists" and that one appears at 1 kW; and it
# still listed kW-scale behaviour as NOT TESTED after the 1-kW gate had run.
#
# Regex assertions cannot catch that: every individual sentence was true when written. The
# fix is structural. Every current-status section of the report is now GENERATED from this
# file, and tests compare the generated text against it.
#
# STATUS VOCABULARY
#   PROVEN      numerically converged AND cross-checked against an independent solver
#   SUPPORTED   converged in one solver, no independent cross-check
#   CONDITIONAL true only under an input that is still open; the condition is named
#   SUPERSEDED  was asserted in an earlier phase and is no longer current; names what replaced it
#   OPEN        not determined
#   NOT_TESTED  a gate that has never been evaluated

meta:
  current_phase: "0M-R2"
  phase_name: "Architecture realizability, cooling-regime and current-state consistency closure"
  extends_verdict_of_0mr: "0M"
  extends_verdict_of_0mr2: "0M-R"
  extends_verdict_of_0m: "0L-R"
  supersedes_verdict_of: "0H"
  rescopes_verdict_of: "0I"
  extends_verdict_of: "0I-R"
  supersedes_verdict_of_also: "0J"
  date: "2026-09-17"
  extends_verdict_of_also: "0J-R"
  extends_verdict_of_0l: "0K-R"
  note_on_0j: >-
    The Phase-0J verdict NO ADMISSIBLE SAC305 LIFE LAW is SUPERSEDED. It was correct on the
    evidence then available and explicitly recorded its own cause as ACCESS, not physics.
    The primary papers were subsequently supplied and 7 of its 10 database entries change.
  note_on_0h: "The Phase-0H verdict is NOT withdrawn. It was correct for the M0
    thermoelastic model and the single architecture then modelled, and it said so.
    Phase 0I adds the two things it named as missing -- z-placement as a real
    variable, and temperature-dependent failure physics -- and reports what changes."
  optimiser_built: false
  optimiser_recommended: false   # see verdict.optimiser_gate

authoritative_model:
  geometry:
    status: PROVEN
    hvr_cell_height_um: 720
    basis: "500 um inductor (SOURCED, upstream INDUCTOR_LIBRARY) + GaN and MLCC layers (OPEN,
            nominal bound) + 2 x 10 um inter-layer RDL"
    substrate_rule: "t_cell + h_tsv <= h_sub, h_tsv >= 50 um"
    realizable_substrate_range_mm: [0.80, 2.00]
    note: "h_sub = 200 um and 500 um are GEOMETRICALLY INFEASIBLE for the selected converter.
           All Phase-0B..0E absolute magnitudes rest on a geometry that cannot be built."
  cooling:
    status: SUPPORTED
    model: "equivalent Robin boundary on the TIM top surface"
    h_top_W_m2K_at_1kW: 166000.0
    calibrated_to: "June-2026 T_j,max = 84 C at 1 kW"
    phase0b_value_W_m2K: 17521.6
    ratio: 9.47
    caveat: "June cools with substrate-embedded micro-channels adjacent to the GaN layer.
             That topology cannot reach 84 C in this package model at any film coefficient
             (floors near 91 C), so the top-cooled field is the only one consistent with the
             junction target. The through-thickness gradient direction is therefore an
             assumption."
    phase0g_bound: "Phase 0G bounded this rather than leaving it open. Swapping to the
                    substrate-side topology changes warpage magnitudes by up to +45 % and
                    halves S_h (-0.886 -> -0.431), but flips NO sign and changes NO ordering.
                    Across a 4x band in h_top the MOUNTED normalized response is invariant to
                    0.07 % (S_h = -0.4419 / -0.4421 / -0.4422). Substrate-side-only cooling is
                    separately THERMALLY INFEASIBLE at 1 kW (floors at 90.96 C, reaching
                    110.4 C at h = 2.00 mm)."
    evidence: "results/phase0g/cooling_topology_comparison.csv,
               results/phase0g/thermal_boundary_closure.md"
  rdl_stack:
    status: PROVEN
    source: "ECTC-2024 Table I"
    t_cu_um: 10
    line_space_um: [10, 2]
    layers: {vdd: 2, gnd: 2}
    occupancy_derived: 0.8333
    r_sheet_per_net_mohm_sq: 1.020
  tsv_allocation:
    status: PROVEN
    rule: "n_required <= n_allocated <= n_available; R_field = R_single / n_ALLOCATED"
    provisioning_J_cu_A_per_m2: {conservative: 1.0e+8, aggressive: 4.0e+8}
    reliability_limit: OPEN
  reference_point_1kw:
    load_w: 1000
    m_vr: 49
    j_target_A_per_mm2: 3.5
    areal_utilisation_pct: 55.0
    note: "June's own optimum is M = 70; 70 tiles of this footprint cannot be placed under
           this project's 0.5 mm keepout and gap rules."

claims:
  proven:
    - id: geometry_realizability
      statement: "A DVPD converter's component stack sets a hard lower bound on substrate
                  thickness, and that bound excluded both thicknesses swept in Phases 0B-0E."
      evidence: "results/phase0f/GEOMETRY_REALIZABILITY_AUDIT.md"
      phase: "0F"
    - id: rail_dependence
      statement: "The rail carried by a vertical interconnect changes its loss by ~1960x for
                  fixed transferred power, and which rail it carries is architecture-specific."
      evidence: "results/phase0dr/POWER_PATH_AUDIT.md"
      phase: "0D-R"
    - id: allocation_policy
      statement: "A via field's loss is proportional to current only under minimum-capability
                  provisioning; under geometric allocation the same field obeys P ~ I^2."
      evidence: "results/phase0e/tsv_allocation_sensitivity.csv"
      phase: "0E"
    - id: no_ac_correction
      statement: "No AC correction to the vertical interconnect is required at the switching
                  frequency; HFSS shows loop resistance flat to 0.18 % below the 19.1 MHz
                  skin crossover."
      evidence: "results/phase0e/em_validation.md"
      phase: "0E"
    - id: thermal_ordering
      statement: "An independent 3-D thermal solver reproduces candidate ordering exactly at
                  both 240 W and 1 kW."
      evidence: "results/phase0e/thermal_validation.md, results/phase0f/thermal_moose_1kw.csv"
      phase: "0E,0F"
    - id: unit_consistency_defect
      statement: "Vertical-tier losses were evaluated per regulator and summed with a
                  system-wide lateral loss, understating every vertical tier by n_vr -- 4x at
                  240 W and 49x at the 1 kW reference."
      quantitative: "P_TSV / P_TSV,corrected = 49.004 to 49.055 at all nine thicknesses;
                     independent hand check 89.7768 mW/VR x 49 = 4.399 W agrees"
      evidence: "results/phase0g/electrical_crossover_uncertainty.md, DEFECT #30"
      phase: "0G"
    - id: bcb_is_a_clamp
      statement: "The compact BC-B foundation restrains all three DOF on the underside plane,
                  so it models a clamp and not a board. It never recovers its own free limit:
                  at vanishing stiffness it gives 0.739 um where the free package on the
                  identical mesh gives 8.287 um."
      quantitative: "S_h > 0 at all 12 stiffnesses over 7 decades -- no crossover k* exists"
      evidence: "results/phase0g/support_stiffness_sweep.csv,
                 results/phase0g/board_foundation_calibration.md"
      phase: "0G"
    - id: thickness_ordering_universal
      statement: "Thicker substrate reduces warpage in the free package and in every
                  explicitly constructed assembly, across the whole board envelope from
                  compliant to metal-backed, at every stress-free reference temperature and
                  under every thermal boundary tested."
      quantitative: "S_h = -0.039 to -0.886 in 5 board cases; sign stable across 3 reference
                     temperatures and 4 thermal boundaries; 0 sign flips in 20 combinations"
      evidence: "results/phase0g/explicit_board_crosscheck.csv,
                 results/phase0g/footprint_m1_1kw.csv,
                 results/phase0g/cooling_topology_comparison.csv"
      phase: "0G"

    - id: gan_height_sourced
      statement: "The GaN device heights are no longer open. Manufacturer datasheets give
                  685 um nominal (815 max) for the high-side EPC2212 and 606 um for the
                  low-side EPC2090, against the 0/100/250 um envelope Phases 0F-0G invented."
      quantitative: "for the EMBEDDED architecture this raises h_sub,min from 0.770 mm to
                     1.176-1.426 mm"
      evidence: "results/phase0h/geometry_height_closure.md"
      phase: "0H"
      amended_by: "Phase 0I -- see architecture_dependent_realizability. The heights are
                   sourced and unchanged; what changed is that the BOUND they imply applies
                   only to the architecture that embeds them."
    - id: architecture_dependent_realizability
      statement: "COMPONENT-HEIGHT REALIZABILITY IS ARCHITECTURE DEPENDENT. Component height
                  constrains substrate thickness ONLY for the embedded architecture. Where the
                  converter is below, above or beside the substrate, nothing it contains
                  constrains h_sub, and the binding constraint becomes TSV manufacturability."
      quantitative: "h_sub,min = 1.276 mm embedded (MLCC nominal) against 0.300 mm for
                     backside, power-die and 2.5D -- the source-demonstrated TSV layer
                     thickness (June-2026 Table III, d = 30 um at h = 300 um, AR 10:1).
                     A 4.3x wider realizable range."
      supersedes: "the Phase-0H phrasing, which stated the bound universally"
      evidence: "results/phase0i/REALIZABILITY_BY_Z_ARCHITECTURE.md, DEFECT #33"
      phase: "0I"
    - id: warpage_is_not_a_reliability_proxy
      statement: "Global die warpage does not predict the local interconnect loading for this
                  architecture, and the relationship is not even sign-stable across assembly
                  states."
      quantitative: "70 paired runs: Spearman rho = 0.112 (all cases), 0.349 (mounted),
                     -0.793 (free) against interface shear. Across the mounted thickness sweep
                     warpage varies 3.0x (9.66 -> 29.23 um) while shear stays within +-9 %."
      evidence: "results/phase0h/warpage_local_correlation.csv,
                 results/phase0h/local_metric_selection.md"
      phase: "0H"
    - id: defect30_changed_a_240w_ranking
      statement: "DEFECT #30 inverted an architecture comparison at 240 W as well as at 1 kW.
                  Replaying the eleven Phase-0E candidates with the scope-guarded evaluator
                  moves three ranking positions."
      quantitative: "ARCH_B distributed j=2.0 h=0.5 shifts +356.83 mW (+1.576 %) and falls from
                     third-best to worst of the five distributed cases; ARCH_A cases shift
                     16-25 mW because their vias carry only leakage-scale current"
      evidence: "results/phase0h/DEFECT30_GLOBAL_PROPAGATION_AUDIT.md"
      phase: "0H"

  supported:
    - id: footprint_agreement_mounted
      statement: "In a mounted assembly the electrical and mechanical preferences on the
                  footprint lever AGREE: the larger, finer-partitioned footprint is both
                  lower loss and lower warpage."
      quantitative: "electrical -6.633 W for M = 36 -> 49 (259.2 -> 329.3 mm2);
                     mechanical S_A = -0.166 to -0.290 in all 5 board cases"
      evidence: "results/phase0g/footprint_board_envelope.csv,
                 results/phase0g/footprint_placement_recheck.md"
      corroboration: "June-2026 Sec. I asserts the same direction qualitatively -- distributed
                      VRs produce localized deformation rather than global package deflection,
                      reducing overall warpage sensitivity. Direction only; no number is given."
      phase: "0G"
    - id: count_inert
      statement: "Regulator count is mechanically inert at constant total footprint and heat."
      evidence: "results/phase0b, results/phase0c"
      phase: "0B,0C"
    - id: rdl_dominates_arch_conditional
      statement: "Package distribution loss is dominated by lateral RDL spreading for ARCH_A at
                  every realizable thickness, but NOT for ARCH_B, whose via field exceeds the
                  RDL by up to 11x above roughly 0.9 mm."
      quantitative: "ARCH_A: RDL 0.642 W against TSV 0.010-0.163 W. ARCH_B: TSV 0.450 W at
                     0.80 mm rising to 7.210 W at 2.00 mm against a flat 0.642 W RDL."
      evidence: "results/phase0h/interconnect_decomposition_1kw.csv"
      phase: "0H"
      supersedes: "rdl_dominates (Phase 0D-R), which stated it unconditionally"

  conditional:
    - id: archA_interior_optimum
      statement: "ARCH_A retains a numerically resolved interior electrical optimum at
                  h_sub = 0.90 mm."
      condition: "resolved but NOT actionable -- the optimum is 8.634 mW deep on a 125 W
                  budget (0.0069 %). The ARCH_A/ARCH_B gap at fixed thickness is 52x larger
                  than the entire depth of this optimum."
      quantitative: "numerical floor 0.0977 mW; depth vs 0.80 mm = 88.4x floor, vs 1.00 mm
                     = 9.6x floor"
      evidence: "results/phase0g/crossover_hires_ARCH_A_fixedA.csv"
      phase: "0G"
    - id: thickness_opposition
      statement: "Substrate thickness is a genuine ETM opposition: electrically thinner is
                  better, mechanically thicker is better."
      condition: "the opposition is real and sign-stable, but NO criterion exists to make it
                  binding (G2 NOT TESTED), so it cannot restrict a feasible set. It is a
                  response coupling, not a constraint."
      quantitative: "electrical +6.706 W for 0.80 -> 2.00 mm (ARCH_B nominal);
                     mechanical -44 % warpage over the same range (FR-4 1.6 mm board)"
      evidence: "results/phase0g/electrical_crossover_uncertainty.md,
                 results/phase0g/explicit_board_crosscheck.csv"
      phase: "0G"
    - id: mounted_warpage_floor
      statement: "A mounted assembly cannot reach the warpage levels the free package
                  suggests: its floor is 14.03 um where the free package reaches 1.27 um."
      condition: "magnitudes are NOT validated -- board CTE, board modulus envelope and the
                  absence of a solder-mask/copper-plane laminate structure are engineering
                  values, not measurements of the reference system."
      evidence: "results/phase0g/mechanical_epsilon_corrected.csv"
      phase: "0G"
  superseded:
    - id: footprint_opposition
      statement: "HVR footprint is simultaneously an electrical and a mechanical design
                  variable and the two OPPOSE: larger footprint lowers electrical loss and
                  raises warpage. Sign preserved in both assembly states."
      superseded_by: "Phase 0G: the sign is ASSEMBLY-STATE DEPENDENT. It is positive in the
                      free package (+0.203) and the compact clamp (+0.058) and NEGATIVE in all
                      five explicit assemblies (-0.166 to -0.290). In a mounted assembly the
                      two disciplines AGREE. The reference paper asserts the mounted direction.
                      Replaced by claim footprint_agreement_mounted."
      phases_asserted: "0C,0D,0D-R,0E,0F"
    - id: assembly_state_reversal
      statement: "The mechanical thickness preference REVERSES between assembly states: free
                  packages prefer thicker substrates, mounted packages prefer thinner ones."
      superseded_by: "Phase 0G: an artifact of BC-B's three-DOF in-plane clamp. No explicit
                      assembly reproduces it -- S_h < 0 in all five board cases, at three
                      reference temperatures and four thermal boundaries. BC-B cannot recover
                      its own free limit (0.739 vs 8.287 um) and no support stiffness k*
                      exists over seven decades."
      phases_asserted: "0F"
    - id: archB_interior_optimum
      statement: "ARCH_B has an interior electrical thickness optimum near h_sub = 1.0 mm."
      superseded_by: "Phase 0G: an artifact of DEFECT #30. The minimum SURVIVED a 25x tighter
                      convergence tolerance -- it was not numerical -- but vanished when the
                      vertical-tier unit error was fixed. Corrected ARCH_B is monotonically
                      increasing with the optimum on the thin boundary in 9 corners of 9."
      phases_asserted: "0F"
    - id: win_win_win_200_500
      statement: "Substrate thickness 200 -> 500 um is win/win/win and survived every
                  correction."
      superseded_by: "Phase 0F: both thicknesses are GEOMETRICALLY INFEASIBLE for the selected
                      converter. The trend DIRECTION survives on realizable geometry
                      (800 -> 1500 um, -81.9 % warpage) but the magnitudes and the swept range
                      do not."
      phases_asserted: "0B,0C,0D,0D-R,0E"
    - id: no_arch_dependent_thickness
      statement: "No architecture-dependent thickness tradeoff exists."
      superseded_by: "Phase 0F: at 1 kW ARCH_B's electrical optimum is interior while its
                      mechanical preference is monotone. Phase 0G audits whether that
                      interior optimum is numerically resolved."
      phases_asserted: "0D-R,0E"
    - id: archB_infeasible
      statement: "ARCH_B is infeasible."
      superseded_by: "Phase 0E: feasible under every source-backed current density; the
                      verdict rested on an unsourced 4.8 mA per-via limit."
      phases_asserted: "0D-R"
    - id: placement_spread_188
      statement: "The electrical spread across placements is 188.8 %."
      superseded_by: "Phase 0E: 46.7 % on the sourced RDL stack."
      phases_asserted: "0D-R"
    - id: exchange_rate_16
      statement: "The footprint ETM exchange rate is 16.2 W/um."
      superseded_by: "Phase 0E: 11.48 W/um; Phase 0F at 1 kW: 12.86 W/um."
      phases_asserted: "0D-R"
    - id: ansys_unavailable
      statement: "ANSYS cross-validation is impossible because the licence server is down."
      superseded_by: "Licence restored 2026-09-06. HFSS and Icepak used; Q3D is not licensed."
      phases_asserted: "0B,0C,0D,0D-R,0E"

open:
  - id: gan_mlcc_layer_heights
    what: "GaN device and MLCC layer heights"
    why_it_matters: "sets the HVR cell height and hence the minimum realizable substrate"
  - id: em_lifetime_limit
    what: "electromigration lifetime current density for copper TSVs"
    why_it_matters: "the provisioning density is closed; the reliability limit is not"
  - id: rdl_dielectric_and_stitching
    what: "RDL dielectric stack and inter-layer stitching via density"
  - id: board_laminate_structure
    what: "real board laminate structure -- copper plane fractions, solder mask, stiffener,
           and the board's true in-plane CTE"
    why_it_matters: "Phase 0G CLOSED the question the Phase-0F reversal rested on: BC-B is a
                     clamp, no k* exists, and every explicit board gives the free-package
                     sign. What remains open is only MAGNITUDE. The 9.7-29.2 um range is an
                     engineering envelope, not a prediction, and must not be quoted as
                     predicted warpage."
    status_change: "was board_foundation_stiffness (OPEN, Phase 0F) -- the SIGN question is
                    now closed; only magnitude remains"
  - id: cooling_topology
    what: "whether the real package is cooled from the top or from inside the substrate"
    why_it_matters: "sets the sign of the through-thickness thermal gradient"
    status_change: "BOUNDED in Phase 0G rather than closed. It moves warpage magnitudes by up
                    to 45 % and halves S_h, but flips no sign in any configuration tested.
                    The mounted normalized response is invariant to 0.07 % across a 4x h_top
                    band. Substrate-side-only cooling is separately thermally infeasible at
                    1 kW."
  - id: assembly_pre_stress
    what: "assembly / cure / cooldown reference state (M1)"
    why_it_matters: "all warpage here is INCREMENTAL OPERATIONAL, not TOTAL ASSEMBLED"
    status_change: "BOUNDED in Phase 0G. Raising the reference to 150/175 C changes MAGNITUDES
                    by up to +54 % (25.1 -> 38.7 um mounted) but leaves the mounted normalized
                    response stable to 0.5 % (S_h = -0.4421 / -0.4397 / -0.4400) and flips no
                    ordering. Every absolute warpage number in this project is therefore a
                    LOWER BOUND. A validated pre-stress model still requires the cure schedule,
                    cure shrinkage, viscoelastic relaxation and reflow profile -- none
                    available for the reference system."
  - id: mechanical_criterion
    what: "an admissible operational-state warpage or RDL-shear allowable for this stack"
    why_it_matters: "this is the single blocking item for G2 and for any constraint-based
                     optimizer. Phase 0G searched the full corpus and found none: June-2026
                     names the failure mechanisms (global package warpage, delamination, RDL
                     shear) but attaches no number to any of them. External standards are
                     unretrievable in this environment AND inadmissible on inspection --
                     package-outline coplanarity governs the ball plane of a component as
                     supplied at a defined measurement temperature for solderability at
                     reflow, which matches neither the package state, the temperature, the
                     measurement definition nor the failure mechanism analysed here."
    evidence: "results/phase0g/mechanical_criterion_audit.md"

not_tested:
  - id: G2
    what: "feasible-set reversal under a mechanical criterion"
    why: "no source-backed criterion matching this package state, temperature, size,
          measurement definition and failure mechanism could be found"
    consequence: "the epsilon sweep is PARAMETRIC CONSTRAINT SENSITIVITY, never feasibility"
  - id: transient
    what: "transient electrothermal and mechanical response"
  - id: m1_full
    what: "full assembly-pre-stress model with plasticity and lifetime"

verdict:
  phase0g: "NO ACTIVE MECHANICAL CONSTRAINT -- RESPONSE COUPLING ONLY"
  phase0h: "NO ADMISSIBLE MECHANICAL CRITERION FOUND -- RESPONSE COUPLING ONLY"
  phase0i: "ARCHITECTURE-DEPENDENT RELIABILITY RESPONSE -- NO ACTIVE CONSTRAINT"
  phase0ir: "PHASE-0I METRIC VALID AFTER REDEFINITION -- READY FOR LIFE-LAW ACQUISITION"
  phase0j: "NO ADMISSIBLE SAC305 LIFE LAW FOUND FOR THE CURRENT METRIC / REGIME"
  phase0j_supersession: >-
    SUPERSEDED by Phase 0J-R. The verdict string above is retained VERBATIM as the
    historical record. Phase 0J recorded its own cause as ACCESS rather than physics;
    the primary calibration papers were subsequently supplied and 7 of its 10 database
    entries change. See verdict.phase0jr.
  phase0jr: "SAC/SnAgCu LIFE LAW ADMITTED FOR RELATIVE LIFE ONLY"
  phase0k: "MISSION REQUIREMENT STILL OPEN -- ABSOLUTE-LIFE CALIBRATION ALSO REQUIRED"
  phase0lr: "Z2>Z1 ORDERING ROBUST -- RELATIVE-LIFE MAGNITUDE REMAINS CONDITIONAL"
  phase0lr_option_letter: "C"
  phase0m: "MULTIPLE MISSING PHYSICAL COUPLINGS ARE FIRST ORDER -- OPTIMIZATION STILL PREMATURE"
  phase0mr: "PRODUCTION COUPLING PRESERVES THE DECIDING ARCHITECTURE ORDERING -- ABSOLUTE RESPONSES CHANGE MATERIALLY"
  phase0mr2: "PRODUCTION MODEL STILL NOT PHYSICALLY CLOSED -- NO ARCHITECTURE VERDICT BEYOND Z1/Z2 IS DEFENSIBLE"
  phase0mr2_option_letter: "H"
  phase0mr2_dominant_blocker: >-
    Three independent gaps, none of which touches the Z1/Z2 ordering and each of which
    prevents any wider architecture claim. Zero of twelve template-architecture
    combinations are realizable at any of the 27 corners of the clearance bound, and area,
    routing and current density block more of them than the clearances do. The ARCH_Z4
    power-die construction is unsourced, and Z4 takes first or second place depending on
    which construction is real. The cooling model has no validated correlation between
    Re 2300 and Re 3000, where the Phase-0M-R 50 g/s point sits.
  phase0mr_option_letter: "C"
  phase0mr_dominant_blocker: >-
    Not a blocker but a scope statement: the deciding ordering survives integration, so the
    architecture conclusion stands, while every absolute number moves enough that none of them
    may be quoted from the Phase-0M production path. The largest single contributor is the
    cooling boundary, which alone supplies most of the +47 K.
  phase0m_option_letter: "G"
  phase0m_dominant_blocker: >-
    The cooling boundary, which is inverse-calibrated rather than derived and hides 7.4 % of
    the load in uncharged pumping power. Stated in prose alongside the verdict; G is the
    single official verdict and E -- cooling as a first-order ETM design variable -- is its
    largest single instance rather than an alternative to it.
  rejected_verdicts_phase0mr2:
    "PHYSICAL ARCHITECTURE GEOMETRY CLOSED; Z2 < Z1 ORDERING SURVIVES": >-
      rejected. The ordering half is true; the closure half is not. The ARCH_Z4 power-die
      construction is unsourced, three package clearances are OPEN, and no template is
      realizable. Geometry is better resolved than it was, and it is not closed.
    "Z2 < Z1 ORDERING SURVIVES, BUT FULL ARCHITECTURE REALIZABILITY REMAINS OPEN": >-
      rejected as the dominant statement only, and true as far as it goes. It is a strict
      subset of option H: it captures the realizability gap but says nothing about ARCH_Z4
      remaining conditional or about the cooling correlation hole, both of which
      independently prevent any architecture claim beyond Z1 against Z2.
    "COOLING-MODEL VALIDITY CHANGES ABSOLUTE RESPONSES BUT NOT THE DECIDING ORDERING": >-
      rejected. The cooling correlation audit did find a real model-domain defect, but it
      did NOT change absolute responses at the production point, which was already inside
      the laminar domain. The largest absolute change in this phase came from DEFECT #55,
      the board material, not from cooling.
    "Z4 REORDERING WAS A GEOMETRIC SUBSTITUTION ARTIFACT; Z1/Z2 RESULT SURVIVES": >-
      rejected, and contradicted by the measurement. With the power die represented as
      real geometry ARCH_Z4 moves FURTHER ahead rather than back: from second place at
      3.6681 um in Phase 0M-R to FIRST at 3.5306 um under the stacked construction. Only
      the planar construction returns it to second. Calling the reordering an artifact
      would state the opposite of what the corrected model shows.
    "ARCHITECTURE ORDERING CHANGES AFTER PHYSICAL-GEOMETRY CLOSURE": >-
      rejected. The Z1/Z2 ordering does not change, and geometry is not closed. What
      changes is ARCH_Z4's rank, and it changes with the unsourced construction rather
      than with the geometry correction.
    "TSV/PACKAGE REALIZABILITY INVALIDATES ONE OR MORE CURRENT ARCHITECTURES": >-
      rejected as too strong. No architecture is shown to be physically impossible. Every
      architecture is shown to be NOT YET BUILDABLE against constraints that are partly
      unsourced, which is a different and weaker statement. Three of the four do sit
      exactly on the 10:1 TSV aspect limit with no margin, and that is reported.
    "COOLING CORRELATION IS OUTSIDE ITS VALID DOMAIN; THERMAL MAGNITUDES MUST BE WITHDRAWN": >-
      rejected as stated, because it over-generalises a real finding. Only the 50 g/s point
      is outside the domain, and its numbers ARE withdrawn. The production point at 27 g/s
      is laminar at Re = 1264.8 and inside the correlation's validated range, so the
      Phase-0M-R thermal magnitudes that rest on it stand.
  rejected_verdicts_phase0mr:
    "PHYSICAL PRODUCTION ETM PATH CLOSED -- CONTROLLED ARCHITECTURE REPLAY AUTHORISED": >-
      rejected. The replay ran and is sound, but "closed" is not earned. Six items remain OPEN
      and blocking, no partition template is fully realizable because three package clearances
      are unsourced, and the RDL is not yet the default mechanical or thermal representation.
    "PRODUCTION COUPLING CHANGES ARCHITECTURE ORDERING -- FURTHER PHYSICS CLOSURE REQUIRED": >-
      rejected as the DOMINANT statement, though it is partly true. Two of four orderings change,
      but the ordering the scientific claim rests on is preserved, and the changed reliability
      ordering is an artifact of a heat-deposition substitution rather than physics. Adopting
      this verdict would report a modelling gap as a physical reordering.
    "THE COOLING MODEL DOMINATES CURRENT ARCHITECTURE UNCERTAINTY": >-
      rejected as the DOMINANT statement only, and otherwise largely TRUE: cooling is the
      single largest contributor, supplying most of the 47 K and, through temperature, most of
      the warpage and driver change, and the cooler choice alone moves the peak by 15.4 K and
      the driver by 15.4 %. It is not the dominant verdict because the question this gate had
      to settle was what integration does to the ORDERING, which is what option C states.
    "RDL AND ROUTING PHYSICS DOMINATE": >-
      rejected on measurement. Intra-VR routing is about 0.5 % of the load and the RDL moves the
      Z1/Z2 driver ratio by at most 0.11 %. The cooling boundary is an order of magnitude larger.
    "INDEPENDENT VALIDATION FAILED -- PRODUCTION MODELS NOT TRUSTWORTHY": >-
      rejected, and contradicted by the measurements. 5 of 5 transition geometries ACCEPTED
      against MOOSE at 0.25-0.73 %, the uniform bar exact in both codes, spreading resistance
      within 0.9 % of the analytic value, and the fluid-side energy balance exact. The one
      REJECTED cooling case is outside the production regime and is reported rather than tuned
      away.
    "MULTIPLE FIRST-ORDER COUPLINGS REMAIN OPEN -- PRODUCTION FRAMEWORK STILL NOT CLOSED": >-
      rejected as the dominant statement, though several couplings DO remain open. This was
      Phase 0M's verdict and this phase wired five of the models it named into production and
      cross-validated two of them. Repeating it would understate what changed and would make
      the gate uninformative.
  rejected_verdicts_phase0m:
    "GEOMETRY-RESOLVED ARCHITECTURE MODEL CLOSED -- NEW ETM DESIGN VARIABLES PROVEN": >-
      rejected. The variables are promoted and several new levers are proven, but the model is
      not closed: the electromigration current-density limit is still OPEN, no first-stage
      converter compiles below 48 V, the meshed-plane RDL anisotropy is unvalidated, and no
      cohesive-zone parameters exist.
    "INTERCONNECT GEOMETRY MATERIALLY CHANGES ARCHITECTURE RANKING": >-
      rejected on measurement. Under the minimum-capability allocation the framework actually
      uses, the TSV cross-section cancels identically out of the field resistance AND out of
      the copper fraction, so radius changes nothing electrically, thermally or mechanically.
      Carried to the mechanical driver, the largest ratio shift from any interconnect-geometry
      change is 2.4 %, against a 32 % architecture gap. The ORDER never changes.
    "COMPONENT-LEVEL STACK PARTITIONING MATERIALLY CHANGES ARCHITECTURE RANKING": >-
      rejected as stated. Partitioning changes FEASIBILITY decisively -- a single-level VR
      misses the die shadow by 1.76x and three of eight templates do not fit -- but no
      partition reorders Z1, Z2 and Z4.
    "Z5 CONCLUSION CHANGES AFTER PHYSICAL ROUTING RE-AUDIT": >-
      rejected as stated. The ~768 W survives: it is computed on interposer RDL geometry, is
      grid-converged to 0.15 %, and did NOT inherit PCB routing -- the PCB row is 4.56x more
      conductive per square, so PCB inheritance would have given about 169 W. The CLASS framing
      does move, and Phase 0I-R had already narrowed it to the tested topology.
    "COOLING ARCHITECTURE IS A FIRST-ORDER ETM DESIGN VARIABLE": >-
      rejected AS THE DOMINANT VERDICT while being TRUE as a statement -- the distinction
      matters and is recorded rather than hidden. The cooling boundary is not tied to any
      hardware, no laminar cooler reaches the calibrated coefficient, reaching it costs 7.4 %
      of the load in uncharged pumping power, and a real coolant temperature rise moves die
      warpage by up to 8.2 %. It is the LARGEST SINGLE INSTANCE of G rather than a competing
      verdict, and exactly one verdict may be dominant.
    "CURRENT COMPACT MODELS REMAIN ADEQUATE -- NEW GEOMETRY VARIABLES ARE SECOND ORDER": >-
      rejected. Contradicted four separate ways: the cooling boundary cannot be realised by any
      laminar cooler and charges no pumping power; intra-VR routing is absent and worth up to
      3.9 % of the load; the RDL is modelled isotropic when it is 153x anisotropic; and the
      crowding constant spans 2.4x when measured.
  phase0lr_dominant_blocker: >-
    Primary-data access, then material characterisation. Stated in prose alongside the
    verdict as the brief permits; C is the single official verdict.
  rejected_verdicts_phase0lr:
    "HIGH-STRESS SAC305 MODEL CLOSED -- RELATIVE-LIFE MAGNITUDE VALIDATED": >-
      rejected -- no SAC305 data exists anywhere in the creep-rate regime at 45-150 C, and
      99.8 % of the joint damage is still generated outside the calibration window.
    "HIGH-STRESS MODEL IMPROVED -- Z2/Z1 MAGNITUDE NARROWED": >-
      rejected -- the envelope did not narrow. A second constitutive FAMILY was admitted
      (Anand, on the Yamin SAC305 parameterisation), but it cannot be integrated at package
      stresses because this solver fails above a Norton exponent of about 9-10, and the
      predeclared gate returns INSUFFICIENT EVIDENCE on the family count.
    "Z2>Z1 ORDERING ITSELF BECOMES MODEL-FORM DEPENDENT": >-
      rejected -- refuted by measurement and by structure. All 12 architecture ratios exceed
      unity, and the ordering originates in the GLOBAL thermoelastic model, which imposes a
      32 % larger corner shear on Z1 and contains no solder constitutive law at all.
    "DIRECT MATERIAL CHARACTERIZATION REQUIRED BEFORE RELIABILITY QUANTIFICATION": >-
      rejected as the HEADLINE, though true of the MAGNITUDE and recommended in Part 16. It
      understates what is already established: the ordering is robust for a structural
      reason and is quantified as a conditional envelope.
    "PRIMARY DATA ACCESS REQUIRED BEFORE CONSTITUTIVE CLOSURE": >-
      rejected as the HEADLINE, and named instead as the dominant blocker in the verdict
      prose. As the headline it would describe only the constitutive half of the phase and
      omit the reliability conclusion, which C carries.
  phase0l: "HIGH-STRESS MODEL-FORM UNCERTAINTY PRESENT BUT Z2/Z1 RANKING SURVIVES"
  phase0l_option_letter: "C"
  rejected_verdicts_phase0l:
    "HIGH-STRESS SAC305 CONSTITUTIVE MODEL VALIDATED -- RELATIVE-LIFE RESULT CONFIRMED": >-
      rejected -- the card fails its own source-data test. Fed back through the
      solver it reproduces 0 of its 19 calibration points, so nothing about it is
      validated.
    "CONSTITUTIVE LAW CORRECTED -- RELATIVE-LIFE RESULT SURVIVES": >-
      rejected -- the law WAS corrected (the yield threshold removed, so the fit
      and solver variables agree), but that correction does not close the
      high-stress problem: the 3.4x-7.2x stress extrapolation and the
      Sn3.9Ag0.6Cu alloy mismatch both remain, so "survives" overstates it.
    "RELATIVE-LIFE MAGNITUDE CHANGES -- RANKING SURVIVES": >-
      rejected -- true but incomplete. It names the symptom and not the cause. The
      magnitude moved BECAUSE model-form uncertainty is present and was previously
      assumed away; C carries both halves and D carries only one.
    "RELATIVE-LIFE CLAIM NOT ROBUST TO HIGH-STRESS CONSTITUTIVE MODEL": >-
      rejected -- refuted by measurement. No admissible model, under any admitted
      fatigue law, at any profile, reverses the Z2/Z1 ordering; every ratio exceeds
      1 and the worst spread S = 0.1059 is half the architecture effect.
    "AVAILABLE SAC305 DATA INSUFFICIENT TO CLOSE HIGH-STRESS CONSTITUTIVE RESPONSE": >-
      rejected as the HEADLINE, though true as a sub-finding and recorded in
      sac305_constitutive.high_stress_status. It describes deliverable A only; the
      phase also answered the ranking question, which C reports.
  phase0kr: "LOW-TEMPERATURE DATA INSUFFICIENT -- ORIGINAL PROFILE WITHDRAWN"
  wording_rule: "The word CONSTRAINT is reserved for a defined mechanical inequality that
                 binds. A change of sign in a mechanical response is a RESPONSE REVERSAL, not
                 a constraint. A published number is a CRITERION only if it survives the
                 six-condition admissibility test."
  basis_phase0mr2:
    - "THE DECIDING ORDERING SURVIVES EVERY CORRECTION MADE IN THIS PHASE. driver_Z1 /
       driver_Z2 = 1.1942 (4.6450 against 3.8896 um), against 1.2552 in Phase 0M-R. It
       survives real ARCH_Z4 geometry, a corrected board material, architecture-aware TSV
       spans, a regime-checked cooler and a promoted RDL tensor, and it does not approach
       unity. ROBUST ORDERING, not validated magnitude."
    - "NOTHING IS BUILDABLE. Zero of twelve template-architecture combinations are
       realizable at any of the 27 corners of the bounded clearance envelope. The three
       package clearances remain OPEN, but they are NOT the binding constraint: at their
       most favourable values area still blocks 9 of 12, height 8 of 12, and routing and
       current density 6 of 12 each. Closing them would make nothing buildable."
    - "ARCH_Z4 IS STILL CONDITIONAL, FOR A NEW REASON. The heat-source substitution is
       gone and the power die is explicit geometry 1.928 mm below the cooled face. But no
       source describes a monolithic power-die process, and Z4 takes FIRST place under the
       stacked construction (3.5306 um) and SECOND under the planar one (3.9937 um), with
       die warpage differing by a factor of two. Phase-0M-R's Z1/Z4 reordering was NOT a
       substitution artifact: with real geometry Z4 moves further ahead, not back."
    - "TWO PRE-EXISTING DEFECTS WERE FOUND, BOTH AFFECTING THE DECIDING METRIC. DEFECT #55:
       the TSV-field material override was keyed on in-plane FOOTPRINT, so the PCB, the BGA
       field and ARCH_Z2's backside converter were all modelled as a copper/silicon
       composite -- k too high by 530x, E by 6.3x, CTE too low by 3.4x, in the layers that
       set package warpage. DEFECT #54: the current-state checker matched each report as
       one flat string and could not detect an omission, so 17 stale current-facing
       findings survived a green 46/46 run and a '0 stale claims' assertion."
    - "THE COOLING MODEL HAS A DOMAIN HOLE, AND THE PRODUCTION POINT IS NOT IN IT. The
       50 g/s point Phase 0M-R quoted sits at Re = 2342, above the laminar ceiling of 2300
       and below Gnielinski's floor of 3000, where the two neighbouring correlations differ
       by 2.76x. Its numbers -- h = 166 000 W/m2K, 1.46 MPa, 74 W -- are WITHDRAWN. The
       production point at 27 g/s is laminar at Re = 1264.8 and inside the domain, so every
       Phase-0M-R conclusion resting on it stands."
    - "TEMPERATURE AND THE FATIGUE DRIVER STILL DO NOT TRACK, AND MORE STRONGLY. ARCH_Z2 is
       the hottest of the principal candidates at 127.06 C against ARCH_Z1's 118.80 C and
       carries 16.3 % less corner-joint driver. This must NOT be read as a claim that
       temperature is irrelevant to fatigue, which would be false: temperature-dependent
       constitutive behaviour is among the dominant physics here. The correct statement is
       that ranking by package T_max is not equivalent to ranking by the solder-fatigue
       driver, because geometry- and CTE-induced deformation and the local constitutive
       response are distinct mechanisms."
  basis_phase0mr:
    - "THE DECIDING ORDERING SURVIVES. Z2 carries less corner-joint shear than Z1 before
       integration (2.0754 against 2.7447 um) and after it (3.4101 against 4.2803 um). The
       architecture claim this project rests on is not an artifact of the screening path."
    - "TWO OF FOUR ORDERINGS DO CHANGE, FOR DIFFERENT REASONS, AND ONLY ONE IS PHYSICS. Peak
       temperature reorders because Z2's backside converter sits 1.273 mm below the cooled face
       against Z1's 0.973 mm and a physical cooler charges for that depth -- REAL. Corner-joint
       shear reorders between Z1 and Z4 only because Z4's heat is deposited in a substituted
       layer 0.355 mm below the cooler -- CONDITIONAL, and not evidence about Z4."
    - "ABSOLUTE RESPONSES MOVE FAR MORE THAN ORDERINGS. Up to +13.8 % in system loss, +47.0 K in
       peak temperature, +31.2 % in die warpage and +64.3 % in the reliability driver. No
       absolute number from the Phase-0M production path may be quoted."
    - "PEAK TEMPERATURE AND THE FATIGUE DRIVER DO NOT TRACK. Z2 becomes the HOTTEST architecture
       and remains the BEST on the driver, because the driver is set by CTE mismatch across a
       thin substrate rather than by absolute temperature. Ranking on T_max alone would have
       ordered the architectures wrongly for the metric that decides the design."
    - "THE INTEGRATION IS INDEPENDENTLY VALIDATED WHERE IT COULD BE. Transition resistance
       against MOOSE: 5/5 ACCEPTED at 0.25-0.73 %. Cooling solid side against MOOSE with explicit
       fins: 2/4 ACCEPTED, 1 CONDITIONAL, 1 REJECTED at 10.11 % and left visible, with the
       production geometry in the accepted band at 3.78 %. Fluid-side energy balance exact."
    - "FOUR PHASE-0M STATEMENTS ARE NARROWED, NONE WITHDRAWN. Intra-VR routing is common mode
       only at fixed component topology (7.5 % across templates); the 153x-276x RDL anisotropy is
       in-plane for single-direction lines only, and every realistic organisation is in-plane
       isotropic with the real anisotropy through-thickness; Delta_R is a difference against a
       stated 1-D reference and can legitimately be negative; TSV radius is not a FIELD-LOSS
       lever but is decisively a FEASIBILITY variable."
  basis_phase0m:
    - "PRODUCTION PATH, NOT SCREENING MODELS. Five Phase-0M findings exist as validated
       screening models that the production electrical, thermal and mechanical path does not
       yet use: intra-VR routing, geometry-specific transition resistance, physical cooling,
       RDL thermal anisotropy, and component-level z partitioning. Until they drive P_elec,
       T(x,y,z) and M(x,y,z), they are measurements ABOUT the framework rather than
       properties OF it."
    - "COOLING IS THE LARGEST SINGLE GAP. The production boundary is an inverse-calibrated
       Robin coefficient of 166 000 W/m2K with one uniform sink temperature. No laminar
       microchannel architecture reaches it; the calibrated value needs 50 g/s, 74 W of
       pumping -- 7.4 % of the load -- and 1.46 MPa, none of which is charged anywhere. At
       the source's own stated 1.6 g/s the coolant would rise 168 K."
    - "TWO of eight enumerated failure mechanisms are addressable, not one: global bending as
       a driver, and solder fatigue as a real mechanism added in Phase 0I and verified in
       0I-R. RDL fracture, delamination, via fatigue, dielectric cracking, pad cratering and
       EM-assisted damage remain uncomputed, and the RDL is absent from the mechanical mesh."
    - "THE LIFE LAW IS AVAILABLE FOR RELATIVE LIFE. The primary sources were obtained in
       Phase 0J-R and Syed 2004's author-corrected calibration was reproduced. Access is no
       longer the blocker. The CONSTITUTIVE model is: it is fitted on Sn3.9Ag0.6Cu over
       7.51-15.92 MPa while 99.8 % of package damage is generated outside that window."
    - "G2 REMAINS UNTESTABLE FOR TWO INDEPENDENT REASONS, either sufficient: no required life
       exists, and absolute N_f is unvalidated. A mechanical ALLOWABLE is still absent, so a
       relative ordering does not activate the gate. N_required alone was never the sole
       blocker -- Phase 0K withdrew that framing."
    - "THE ORDERING IS ROBUST AND ITS MAGNITUDE IS NOT. Z2 accumulates less solder-fatigue
       damage than Z1 under every presently testable constitutive and life-law combination,
       because the global package supplies a constitutive-law-independent deformation driver
       favoring Z2. The magnitude is a conditional envelope of 1.19 to 1.22, not a validated
       number."
  basis:
    - "Nine candidate thresholds were tested against the six admissibility conditions and NONE
       passed. The best scored 3 of 6. Zero admitted (criterion_admissibility.csv)."
    - "Every published package-warpage allowable located is CATEGORY 1 -- manufacturing and
       solderability. JEP95 80 um room-temperature ball-plane coplanarity, SPP-024 -120/+170 um
       peak-reflow warpage, and wafer-level-packaging yield guidance of 0.2 mm (0.1 mm
       preferred). All govern the package as supplied, at reflow or handling temperature, for
       joint-formation defects."
    - "JESD22-B112C is a MEASUREMENT METHOD, not an allowable. The allowables live in JEP95 and
       SPP-024. IPC-9641, read directly, governs printed BOARD flatness through a reflow
       profile and contains no limit at all."
    - "Of eight enumerated failure mechanisms, ONE is computable at M0 -- global bending -- and
       it is not a failure mechanism. Two of the three mechanisms June-2026 itself names
       (RDL shear, delamination) are outside the mechanical model entirely."
    - "Global warpage does not predict local interconnect loading (Spearman 0.112 overall) and
       inverts sign between assembly states (-0.793 free, +0.349 mounted), so it cannot serve
       as a reliability surrogate."
    - "Neither local candidate survives validation for decision use: interface shear is
       non-monotone under refinement (7.6 % spread, samples a bimaterial corner) and relative
       displacement carries 26.5 % material spread from an underfill modulus the project has
       never sourced."
  what_this_is_not: "This is NOT a finding that the mechanics is wrong or irrelevant. The
                     response model is converged, cross-validated and sign-stable, and since
                     Phase 0I it measures DAMAGE and not only load. It is a finding that no
                     admissible mechanical inequality exists to turn that response into a
                     constraint, and that several first-order physical models exist as
                     validated screening tools without yet driving the production path."
  what_this_is_not_superseded_note: >-
    The Phase-0H phrasing "the project has been measuring the LOAD rather than the DAMAGE" is
    WITHDRAWN as a current statement. It was true at Phase 0H and was corrected by Phase 0I,
    which added the local inelastic damage metric. It survived in this current-facing field
    for eight phases. DEFECT #53.
  rejected_verdicts_phase0kr:
    EXPERIMENT_DESIGN_FROZEN_CURRENT_MATERIAL_MODEL_SUFFICIENT: >-
      rejected -- the model is not sufficient. The -40 C profile sits 85 K below the creep
      calibration floor, and the creep card is evaluated 3.4-7.2x above its fitted stress window
      in EVERY profile including the operating baseline.
    EXPERIMENT_DESIGN_FROZEN_AFTER_WITHIN_DOMAIN_PROFILE_REDESIGN: >-
      rejected although the redesign SUCCEEDED and is adopted. "FROZEN" requires all eight Sec.31
      acceptance criteria, and criterion 2 -- stress inside or defensibly near the calibration
      domain -- fails irreducibly. Claiming frozen would paper over the single most important
      finding of this phase. The design is READY TO EXECUTE WITH A DECLARED LIMITATION.
    LOW_TEMPERATURE_SAC305_MODEL_VALIDATED_ORIGINAL_PROFILE_RETAINED: >-
      rejected -- no sub-zero SAC305 steady-state creep data exists. The low-temperature
      literature for this alloy is high-strain-rate impact work, which the creep framework
      explicitly excludes. Nothing was validated because nothing was extended.
    STATISTICAL_POWER_INSUFFICIENT_SAMPLE_COUNT_MUST_INCREASE: >-
      rejected as the VERDICT although it is true and is recorded as a secondary correction:
      n = 16 answers the life-law question but not the Z2/Z1 architecture question at the
      observed worst Weibull slope of 5.1, and the count rises to 34 per cell. It is a fix
      applied within this phase, not the dominant finding.
    EXPERIMENT_DESIGN_NOT_YET_IDENTIFIABLE: >-
      rejected -- the design IS identifiable. The within-domain pair gives D = 1.4395, a 44.0 %
      separation between the two laws' predicted life ratios, at an expected discrimination
      Z-score of 3.44 with a stated specimen count.
  rejected_verdicts_phase0k:
    MISSION_REQUIREMENT_ACQUIRED_CURRENT_MODELS_ROBUSTLY_PASS_G2: >-
      rejected -- no mission requirement exists. The entire repository and all supplied source
      material were searched and nothing was found; every n_required here is the TSV via count.
    MISSION_REQUIREMENT_ACQUIRED_G2_ROBUSTLY_NON_BINDING: "rejected -- no mission requirement
      exists."
    MISSION_REQUIREMENT_ACQUIRED_MODEL_FORM_UNCERTAINTY_PREVENTS_G2_DECISION: >-
      rejected -- the second half is exactly right and is the central Phase-0K finding, but the
      first half is false. No requirement was acquired.
    ABSOLUTE_LIFE_CALIBRATION_REQUIRED_BEFORE_G2_CAN_BE_DECIDED: >-
      rejected as INCOMPLETE, though true as far as it goes. It is silent on the mission, which
      is equally open and equally blocking. Choosing it would repeat the Phase-0J-R error of
      naming one blocker when there are two -- the error this phase exists to correct.
    MISSION_REQUIREMENT_STILL_OPEN_CURRENT_RELATIVE_LIFE_RESULT_IS_THE_MAXIMUM_DEFENSIBLE_CLAIM: >-
      rejected as UNDERSTATING the phase. It is true that relative life is the maximum currently
      VALIDATED claim, but this verdict implies nothing further is obtainable. Phase 0K shows
      precisely what is obtainable, how, and at what cost: 64 packages, two temperature ranges,
      6.19 sigma of model discrimination.
  rejected_verdicts_phase0jr:
    SAC305_LIFE_LAW_ADMITTED_ABSOLUTE_FATIGUE_LIFE_PREDICTION_VALIDATED: >-
      rejected -- the two admitted Syed models disagree by 4.10x on our joint (2499 vs 610
      cycles for Z1) while agreeing to 4-7 % on the author's own independent validation
      package. The cause is measured, not speculative: our w_acc/eps_acc is 124-136 MPa against
      his 28.8-30.0 MPa. Each metric interpolates inside his range; the PAIR sits 4.3x off the
      calibration locus.
    PRIMARY_SOURCES_ACCESSED_LIFE_LAW_TRANSFER_REMAINS_CONDITIONAL: >-
      rejected as too weak. It would understate a reproduced calibration (11.7 % worst error,
      4.2 % constant consistency), an averaging volume matched to the source's own 25 um layers,
      and a relative ratio robust across four independent formulations. "Conditional" is the
      right word for the ABSOLUTE result and is used for it; it is the wrong word for the phase.
    PRIMARY_SOURCES_CONFIRM_NO_ADMISSIBLE_LIFE_LAW_FOR_CURRENT_REGIME: >-
      rejected -- four formulations are admitted for relative life, one as methodology and one
      for acceleration scaling. This was the Phase-0J verdict and the supplied papers overturn
      it, exactly as Phase 0J said access would.
    SAC_LIFE_LAW_FAMILIES_DISAGREE_MODEL_FORM_UNCERTAINTY_DOMINATES: >-
      rejected for the RANKING, which is identical across every law, exponent and dwell tested
      (Z2 > Z1 > Z4, Z2/Z1 = 1.21-1.38). Model-form uncertainty dominates the ABSOLUTE value
      only, at 4.1x, and that is reported as such rather than promoted to the verdict.
    CURRENT_ZERO_DWELL_LOAD_PROFILE_IS_INCOMPATIBLE_WITH_AVAILABLE_CALIBRATIONS: >-
      rejected, and DOUBLY false. The premise is wrong -- the solver's own NT output shows a
      STEP followed by a 300 s HOLD at each extreme, not a ramp, so there is a real 300 s dwell
      that matches Syed's TC3 exactly. And the conclusion is wrong -- over a 30x dwell change
      the relative result moves by only +-2 %.
  rejected_verdicts_phase0j:
    G2_PASSED_RELIABILITY_CONSTRAINT_CHANGES_THE_FEASIBLE_SET: >-
      rejected -- both halves of the inequality are missing. No admissible life law and no
      required life. Sec.24 is explicit that G2 is not passed merely because lifetimes differ.
    LIFE_LAW_ACQUIRED_ALL_ARCHITECTURES_PASS: "rejected -- no law was acquired."
    LIFE_LAW_ACQUIRED_ALL_ARCHITECTURES_FAIL: "rejected -- no law was acquired."
    ARCHITECTURE_DEPENDENT_FATIGUE_LIFE_PROVEN_NO_REQUIRED_LIFE_FOUND: >-
      rejected although half of it is true. The METRIC difference is proven and resolved at
      5.8x its paired-perturbation spread, and no required life was found. But FATIGUE LIFE is
      not proven, because no admissible law converts the metric into a life. Saying "proven"
      would claim the bridge this phase failed to acquire.
    FATIGUE_LIFE_RANKING_IS_MODEL_FORM_DEPENDENT: >-
      rejected -- the OPPOSITE is true and it is a genuine positive result. The ranking
      Z2 > Z1 > Z4 is identical across all three law families and every exponent tested.
      Reporting this verdict would invert a finding.
    LIFE_LAW_FOUND_BUT_LOADING_OUTSIDE_ITS_VALID_DOMAIN: >-
      rejected as the verdict, though the cycle IS incompatible (zero dwell against 15 min,
      dT 2.9x apart). It is not the operative blocker, and the domain is not even knowable
      because no accessible source states it. Verdict F names the primary cause.
  rejected_verdicts_phase0ir:
    PHASE_0I_LOCAL_RELIABILITY_METRIC_VALIDATED_AS_IS: "rejected -- the metric's VALUE is
      correct and its creep content is verified, but its LABEL was wrong. Phase 0I called it a
      strain range; it is an accumulated inelastic PATH LENGTH per cycle, larger than the range
      by a factor of 3.72 here. A future life law matched to a range would be misapplied by that
      factor. That is a redefinition, so 'validated as is' overstates the outcome."
    PHASE_0I_DAMAGE_METRIC_OMITTED_CREEP_CONTRIBUTION: "rejected -- DISPROVED by experiment.
      This was the specific failure mode the audit was commissioned to look for, and it did not
      occur. With a creep-only material and no *PLASTIC card, PEEQ / eq(eps_inelastic) = 1.0000.
      No replay of the Phase-0I results is required and none was performed."
    PHASE_0I_LOCAL_RELIABILITY_METRIC_NOT_PHYSICALLY_CLOSED: "rejected -- it is closed. The
      quantity is exactly defined, its plastic and creep content is verified, the stabilised
      cycle is correctly extracted, and it converges on mesh, creep tolerance and corner
      regularisation."
    PHASE_0I_ARCHITECTURE_CLAIMS_VALID_BUT_LIFE_INTERPRETATION_WITHDRAWN: "rejected as the
      VERDICT although both halves are true and are recorded. The life interpretation IS
      withdrawn (see relative_life) and the architecture claims ARE valid and resolved. It is
      rejected only because it omits the operative finding: the metric itself needed redefining,
      and once redefined it satisfies every condition for Phase 0J."
  rejected_verdicts_phase0i:
    RELIABILITY_CONSTRAINT_PROVEN_MECHANICS_ENTERS_SYNTHESIS: "rejected -- a constraint needs
      both halves of an inequality. The local metric now exists and is validated; the allowable
      does not. No admissible SAC305 life law was retrievable and no mission requirement exists."
    GLOBAL_WARPAGE_DOES_NOT_TRACK_LOCAL_DAMAGE: "rejected -- it DOES track: Spearman +1.000
      within every architecture and +0.909 pooled. The defensible statement is that warpage
      OVERSTATES the benefit by 3-5x (29.7-52.6 % against 5.6-17.2 % over the same thickness
      range). This NARROWS rather than contradicts Phase 0H, whose finding concerned SMEARED
      INTERFACE SHEAR, which was a poor proxy."
    NO_MATERIAL_RELIABILITY_EFFECT_FOUND: "rejected -- there is one and it is large: 35.8 % in
      damage between the backside and embedded architectures. NOTE, Phase 0I-R: the
      '1.9-3.8x in relative life' that originally closed this sentence is WITHDRAWN. It
      rested on an unsourced fatigue exponent m = 1.5-3 that entered as a figure annotation;
      over m = 0.5-5 the ratio spans 1.25-9.18. The 35.8 % metric difference stands."
    INSUFFICIENT_MATERIAL_MISSION_DATA_FOR_RELIABILITY_VERDICT: "rejected as the verdict,
      though true of the LIFE LAW and the MISSION specifically. The constitutive model was
      sourced for the correct alloy, validated 4/4 and cross-checked twice, and a real
      architecture-dependent response was measured."
  rejected_verdicts:
    MECHANICAL_CRITERION_ACQUIRED_G2_PASSES: "rejected -- 0 of 9 candidates admitted"
    MECHANICAL_CRITERION_ACQUIRED_NON_BINDING: "rejected -- no criterion was acquired at all;
                                                every candidate failed admissibility"
    LOCAL_RELIABILITY_METRIC_REPLACES_GLOBAL_WARPAGE: "rejected -- global warpage IS
      disqualified (Sec. 7), but neither local candidate survived Sec. 10 validation, so
      nothing replaces it. Claiming a replacement would overstate what was achieved."
    INSUFFICIENT_MATERIAL_ASSEMBLY_DATA_TO_TEST_A_CANDIDATE: "rejected as the PRIMARY verdict,
      though true as a sub-finding: mechanism B is NOT TESTABLE WITH PRESENT DATA (Sec. 9).
      The dominant fact is admissibility, not data volume -- criteria were found and none
      applies to the operational mounted state."
  g2_status: NOT_TESTED
  g2_note_phase0k: >-
    STILL NOT TESTED, and Phase 0K establishes WHY it cannot be closed by mission definition
    alone. Two independent pieces are open. (1) MISSION: no field or product requirement exists
    anywhere in the repository or the supplied material; N_required is USER INPUT REQUIRED and
    is now enforced mechanically by a contract file that refuses unprovenanced numbers.
    (2) ABSOLUTE-LIFE CALIBRATION: the four admitted formulations span 5.2x within a single
    architecture while the architectures separate by only 1.21-1.38x, so NO N_required exists at
    which all models agree Z1 fails and Z2 passes -- the conditions are disjoint (Z1 fails only
    above 2499, Z2 passes only below 581). Zero of 601 grid points give a robust reversal.
    Relative life alone does not pass G2 and is not claimed to. What IS established is
    ARCHITECTURE-DEPENDENT RELATIVE FATIGUE LIFE.
  g2_note_phase0jr: >-
    STILL NOT TESTED, and now blocked by ONE requirement instead of two. Requirement 1, a
    defensible predicted fatigue life, is PARTIALLY MET: four primary-source laws admitted for
    RELATIVE life, the source calibration reproduced on tolerances declared in advance, and the
    averaging volume matched to the source's 25 um layers. Absolute life remains CONDITIONAL
    because the two admitted metric families disagree 4.1x on our joint. Requirement 4 is MET
    and strengthened -- Z2/Z1 = 1.21-1.38 across two authors, two alloy variants, two metric
    families and a 30x dwell range. Requirement 2, a defensible required life, is UNCHANGED.
    Phase 0J-R called it the SOLE blocker; PHASE 0K WITHDRAWS THAT, having tested it formally:
    knowing N_required does not by itself produce a unique pass/fail, because the admitted
    absolute-life formulations differ by 4.1x and therefore disagree about feasibility over a
    wide band of N_required. TWO OPEN PIECES for absolute G2: (1) the system mission /
    required life, and (2) an absolute-life calibration, OR a decision region demonstrably
    robust to the model-form spread. What Phase 0J-R does establish, which the brief
    explicitly permits, is ARCHITECTURE-DEPENDENT RELATIVE FATIGUE LIFE.
  g2_note_phase0j: >-
    STILL NOT TESTED, and now bounded on both sides. LEFT side: closed and strengthened --
    three metrics frozen natively (M1 path, M2 range, M3 energy), all convergent, all agreeing
    on architecture ranking. RIGHT side: absent for TWO independent reasons, not one. (a) NO
    ADMISSIBLE LAW -- 0 of 10 candidates passed the ten predeclared criteria, and the one
    conditionally transferable candidate failed the reproduction gate because its calibration
    data are unretrievable. (b) NO REQUIRED LIFE -- no category-B field mission requirement
    exists, and Sec.14 forbids promoting the 1000-cycle qualification count. Requirement 4 of
    the Sec.23 set IS met: the ranking survives uncertainty. Requirements 1 and 2 fail outright
    and 3 is not evaluable.
  g2_note_phase0ir: "Unchanged, and now precisely bounded. The LEFT side of
    g_mech(x) <= g_allow is closed: an exactly defined, creep-inclusive, convergent local metric
    verified against the solver's own output. The RIGHT side is absent and is DATA, not physics
    -- a SAC305 fatigue relation matched to the accumulated-path-length form of this metric, and
    a mission requirement. Phase 0J is recommended to acquire exactly those two things."
  optimiser_gate:
    phase: "0G"
    recommended: false
    condition_1_assembly_response_survives: PARTIAL
    condition_1_detail: "The thickness RESPONSE survives calibrated board and thermal-boundary
                         uncertainty with 0 sign flips in 20 combinations. But the
                         assembly-state REVERSAL the condition was posed about does not
                         survive -- it does not exist."
    condition_2_criterion_or_epsilon_alters_feasible_set: false
    condition_2_detail: "No criterion exists, so nothing can alter the feasible set. Phase 0G
                         additionally argued the computed range sits far below conventional
                         tolerances; Phase 0H Sec.18 RETRACTED that comparison as unsourced,
                         which strengthens rather than weakens the conclusion -- whether the
                         range is safe or constraining is UNKNOWN."
    conclusion: "BOTH conditions were required. Condition 2 fails outright and condition 1
                 fails in the sense it was posed. The global ETM optimizer is NOT recommended
                 and was NOT built."
    phase0h_note: "Phase 0H reached the same conclusion by a different route -- 0 of 9
                   candidate criteria admitted -- and this gate is retained as the Phase-0G
                   historical record rather than rewritten."
  g2_note: >-
    NOT TESTED since Phase 0B, and the reason has narrowed twice. Phase 0H could test nothing
    because it had neither a failure-relevant metric nor an allowable. Phase 0I supplied the
    metric -- convergent, verified in 0I-R, tied to a documented mechanism -- so
    g_mech(x) <= g_allow is writable in FORM. Phase 0J-R then obtained the primary life-law
    sources and reproduced Syed 2004's author-corrected calibration, so ACCESS is no longer
    the blocker. What remains is g_allow itself, blocked for TWO independent reasons, either
    sufficient: no required life exists anywhere in this repository or in any supplied source,
    and absolute N_f is unvalidated because the constitutive model that feeds it is fitted on
    Sn3.9Ag0.6Cu far below the stresses the package reaches. Phase 0K withdrew the framing
    that N_required was the sole blocker.
  g2_note_superseded_note: >-
    The previous text said g_allow was missing because "a SAC305 life law (both candidate
    sources return HTTP 403)". That was Phase-0J's blocker and Phase 0J-R removed it; the
    sentence nevertheless sat in a current-facing generated block for five phases. DEFECT #53.

next_gate:
  id: "POST-0M -- (1) MATERIAL CHARACTERISATION of SAC305 above 16 MPa, with primary-paper acquisition in parallel; (2) ADOPT the Phase-0M physical cooling model into the ETM loop; (3) PUT THE RDL IN THE MECHANICAL MESH, which is the largest unmodelled mechanism that could change ranking."
  supersedes_0l_framing: >-
    The next_gate block named Phase 0L as next long after Phases 0L, 0L-R and
    0M had run. Repaired in Phase 0M Part 0-B.
  supersedes_0k_framing: >-
    Phase 0K RAN. Its framing of itself as gated on system-owner input alone is superseded by
    its own result: a calibration experiment is independently necessary because no robust
    Z1-fail / Z2-pass band exists under the current model-form spread.
  recommendation: "MISSION + EXPERIMENT IN PARALLEL -- they are independent, both required, and
    neither blocks the other"
  supersedes_0k_framing: >-
    The Phase-0J framing of 0K as gated on LIFE-LAW ACCESS is SUPERSEDED. Access happened: the
    primary papers were supplied, four laws are admitted, and the calibration was reproduced.
    The remaining blocker is NOT mechanics and NOT literature.
  blockers_TWO_not_one: >-
    PHASE 0K CORRECTION. Phase 0J-R recorded N_required as the SOLE blocker. Formal decision
    analysis withdraws that: TWO pieces are open -- (1) the system mission / required life, and
    (2) an absolute-life calibration OR a demonstrated decision region robust to the 4.1x
    model-form spread. See results/phase0k/G2_DECISION_REGIONS.md.
  piece_1_mission: >-
    N_required, from the system owner. Minimum set in results/phase0jr/MISSION_INPUT_TEMPLATE.md
    -- expected service lifetime, required survival probability, whether the target is a field
    mission or a qualification gate, cold boots per day, workload cycles per day and their
    depth, and whether the system is ever fully powered down.
  cheapest_high_value_addition: >-
    ONE board-level thermal-cycle test of the actual DVPD package. A single measured life at a
    single condition fixes the constant directly, collapses the 4.1x model-form spread on
    absolute life, and converts every relative result in Phase 0J-R into an absolute one.
  supersedes: "the Phase-0I-R next_gate, which named 0J. Phase 0J ran and returned a negative:
    the laws exist, they are paywalled, and none of the accessible reprints carries a
    calibration dataset."
  what_0K_needs: >-
    Exactly two things, both ACQUISITION and neither modelling. (1) A SAC305 fatigue relation
    matched to one of M1/M2/M3, WITH its constants, its averaging volume, its calibration
    dT/dwell, AND its own calibration data so the Sec.8 reproduction can actually be run.
    Institutional access to IEEE Xplore and ASME would supply all three canonical papers
    immediately and is the cheapest possible unblock. (2) A required life DECLARED BY THE
    SYSTEM OWNER. If (1) arrives with a calibration cycle far from ours, a justified
    acceleration relation or a re-run on that cycle becomes a third requirement -- and the
    Norton surrogate's 7.5-16 MPa window must be re-validated at whatever temperatures it uses.
  gated_on: >-
    Phase 0J WAS authorised because Phase-0I-R metric closure passed, and it ran. Its outcome
    is recorded in verdict.phase0j: the metric side was correct and the DATA side was not
    available. Phase 0K is therefore gated on ACCESS, not on any further modelling result.
    Historical note -- Phase 0J was authorised because All five Sec.24
    conditions are met: the metric is exactly defined; plastic and creep are both proven
    present by experiment; stabilised-cycle extraction is correct; the Z2 separation is
    resolved at 5.8x its perturbation spread; and the metric is compatible in principle with
    a known class of SAC305 fatigue law, subject to matching the law to the accumulated-
    path-length form or converting by the measured factor 3.72.
  rationale: >-
    Phase 0M found five first-order physical models that exist as validated SCREENING tools
    and do not drive the production path: intra-VR routing, geometry-specific transition
    resistance, physical cooling, RDL thermal anisotropy and component-level z partitioning.
    Phase 0M-R wires the ones with sufficient evidence into production and re-asks which
    Phase-0M conclusions survive. In parallel, and NOT blocking it, high-stress SAC305
    material characterisation remains the dominant scientific blocker.
  rationale_superseded_note: >-
    The previous text read "Phase 0I built the half of G2 that was missing physics: a
    convergent, validated, failure-relevant local damage metric with a SOURCED SAC305
    constitutive model." Two of those words are now false: the creep half of that card is
    fitted on Sn3.9Ag0.6Cu and it is not validated at package stresses (Phases 0L, 0L-R). The
    sentence sat in a current-facing generated block for six phases. DEFECT #53.
  priority_order:
    - "1. HIGH-STRESS SAC305 CONSTITUTIVE DATA at 15-100+ MPa over 45-150 C. The life LAW is
       no longer the blocker -- Phase 0J-R obtained the primary sources and reproduced Syed
       2004's author-corrected calibration. The HTTP-403 statement is HISTORICAL and belonged
       to Phase 0J. What is still missing is the constitutive model the life law consumes."
    - "2. A required life for the target product -- cycles to survive, from a qualification
       target or a stated product requirement. Not published for the reference system, and
       Sec.20 forbids inventing one."
    - "3. RDL / interposer damage. Still absent from the mechanical mesh entirely and one of
       the three mechanisms June-2026 names. ARCH_Z4 and ARCH_Z5 load it hardest."
    - "4. Cohesive-zone delamination -- the remaining June-named mechanism and the convergent
       replacement for the peel metric excluded since Phase 0C."
    - "5. Joint-to-joint variation; only the single worst joint is modelled."
  publication_framing: >-
    AUDITED CROSS-DOMAIN DVPD MODELLING AND FALSIFICATION, unchanged in kind since Phase 0H
    and strengthened in content. Vertical integration is a real design variable with a
    measured architecture-dependent reliability response; the reliability chain is convergent
    and verified; the ordering is robust for a structural reason and its magnitude is
    conditional. Phase 0M adds geometry-resolved interconnect, routing and cooling models,
    and is explicit about which of them drive the production path. There is still no active
    mechanical constraint.
  explicitly_not_next: "the global ETM optimizer"

phase0g_defects:
  - id: 29
    title: "DUPLICATED CURRENT CLAIMS CAN BECOME SEMANTICALLY STALE"
    detail: "The report stated the same claim in Executive Summary, Positive Results, Negative
             Results, the uncertainty ladder and Next Steps; each phase updated only some.
             Every individual sentence was true when written, so regex assertions could not
             catch the contradiction."
    fix: "This file is the single source of truth. Current-status sections are GENERATED from
          it and semantic tests compare the generated text against it."
    status: FIXED
  - id: 30
    title: "UNIT INCONSISTENCY BETWEEN PER-REGULATOR AND SYSTEM-WIDE LOSS TERMS"
    detail: "vertical_tier() returns a PER-REGULATOR loss; rdl_network_solve() returns a
             SYSTEM-WIDE loss. Phases 0D-R, 0E and 0F summed them directly, understating every
             vertical tier by n_vr -- 4x at 240 W, 49x at 1 kW."
    detected_by: "Phase 0G Sec. 2 curve decomposition, after the convergence-tolerance
                  hypothesis had been tested and eliminated"
    impact: "INVERTED the Phase-0F architecture conclusion. ARCH_B's interior optimum was an
             artifact; corrected ARCH_B is monotonic with its optimum on the thin boundary."
    fix: "scripts/phase0e/architecture0e.py -- both terms expressed system-wide; guard test
          added; 151 tests pass."
    status: FIXED
  - id: 31
    title: "THE SEMANTIC LEDGER WAS VACUOUS -- IT COULD NOT FAIL"
    detail: "The Phase-0F semantic ledger scored each withdrawn claim against a +-800-character
             window and accepted 'was ', 'were ', 'became', 'becomes' and 'earlier' as
             exonerating context. In English technical prose at least one of those appears in
             any such window, so EVERY ledger entry passed unconditionally. The mechanism built
             to catch DEFECT #29 could not catch anything."
    detected_by: "a deliberate NEGATIVE TEST -- three unqualified re-assertions of withdrawn
                  claims were injected into the report and the ledger stayed green. The guards
                  had never been checked for the ability to fail."
    impact: "Five genuinely stale statements were standing in the Executive Summary, the
             uncertainty ladder and Next Steps, all of them invisible to a green build."
    fix: "The exonerating vocabulary is restricted to markers that can only be present
          deliberately; the window is the containing PARAGRAPH or table cell instead of a page
          of prose; scoring runs on the Markdown so headings are unambiguous; and a claim is
          exonerated by its enclosing heading CHAIN, so a subsection inside a superseded phase
          inherits that framing. Verified in BOTH directions: the real report passes 49 checks,
          and five injected re-assertions are each caught."
    status: FIXED
    lesson: "A guard that has never been observed to fail has not been tested. Every assertion
             added from Phase 0G onward is negative-tested before it is trusted."
  - id: 32
    title: "CURRENT_SCIENTIFIC_STATUS DID NOT CONTROL ALL CURRENT-FACING REPORT CONTENT"
    detail: "Phase 0G brought the CLAIMS LEDGER under this file and generated it, then declared
             DEFECT #29 fixed. But the Executive Summary, governing equations, validation
             status, novelty statement, current limitations, publication-defensible claims and
             next steps were still hand-written, and the Phase-0G ledger deliberately exonerates
             any withdrawn claim whose enclosing heading names a historical phase -- which is
             right for narrative sections and wrong for sections that speak in the present
             tense. Seven current-facing statements were therefore stale behind a green build:
             thickness still called win/win/win and 'survived every correction'; 'no
             architecture-dependent thickness tradeoff exists'; the withdrawn ARCH_B interior
             optimum; footprint still advertised as the ETM opposition novelty; R_field =
             R_single / n_req with n_alloc absent from the symbol table; the full 3-D MOOSE
             package validation still called NOT DONE when Phase 0E completed it as TH-1..TH-5;
             and BC-B still described as a compliant mounted support after Phase 0G proved it a
             three-DOF clamp."
    fix: "All seven are now GENERATED from this file into sentinel-delimited blocks, the report
          is checked to carry each block verbatim, and a CURRENT-FACING SECTION AUDIT forbids
          nine stale-claim signatures inside present-tense sections with per-pattern
          exonerations for ledger rows, negations and retractions. Verified in both directions:
          the clean report passes, and nine injected stale claims are each caught."
    status: FIXED
    secondary_finding: "While negative-testing the new guards, two of the nine were found to be
                        INCAPABLE OF MATCHING: the patterns had been corrupted when written to
                        disk -- a lost backslash in one, and \\b interpreted as literal
                        backspace bytes in the other. They reported PASS on text they were
                        supposed to reject. This is DEFECT #31 recurring in a new form: the
                        failure was not in the guard's logic but in its source, and only the
                        negative test could see it. A control-character scan of every guard
                        source is now part of the check."
  - id: 33
    title: "REALIZABILITY WAS ARCHITECTURE-BLIND"
    detail: "kw1.design_1kw() takes no architecture argument, so the EMBEDDED geometric rule
             t_cell + h_tsv <= h_sub was applied to every architecture -- including ARCH_B,
             which converts BELOW the substrate, and ARCH_C, which converts BESIDE the die.
             At h_sub = 0.30 mm the code answers 'no inductor fits h_sub=300 um (budget 30 um)'
             identically for all three. The electrical model has varied the converter's vertical
             position since Phase 0D-R; the geometric and mechanical models never did."
    detected_by: "Phase 0I Sec.2, on treating z-placement as an architecture variable"
    impact: "Every 'unbuildable' verdict Phase 0H issued against a thin substrate is
             EMBEDDED-SPECIFIC. Non-embedded architectures reach 0.300 mm against the embedded
             1.276 mm -- a 4.3x wider range including exactly the region the corrected
             electrical model prefers."
    fix: "scripts/phase0i/zarch.py -- realizable(arch, h_sub) applies the embedded stack rule
          only where the converter is embedded, and the source-demonstrated TSV-layer rule
          (June-2026 Table III, d = 30 um at h = 300 um, AR 10:1) elsewhere."
    status: FIXED
    lesson: "A coupling is only modelled if EVERY domain sees it. The electrical model carried
             z-placement for five phases while geometry and mechanics silently did not, and no
             test could catch it because each domain was self-consistent on its own terms."
  - id: 34
    title: "PHASE-0G AND 0H FIGURES WERE NEVER EMBEDDED IN THE PDF"
    detail: "pandoc is invoked with cwd = results/, so a figure path written relative to the
             REPO ROOT ('results/phase0g/FIG.png') resolves to results/results/... . pandoc
             emitted 'Could not fetch resource ... replacing image with description' for all 21
             such references and substituted the alt text. Every Phase-0G and Phase-0H figure
             was missing from the PDF, and the Phase-0I figures would have been too."
    detected_by: "Phase 0I, when a LaTeX error surfaced the pandoc warning stream that had
                  been carrying these messages unread since Phase 0G"
    impact: "Two full phases of figures absent from the delivered PDF while the build reported
             VERIFIED. No numerical result is affected; the deliverable was."
    why_the_guards_missed_it: "Both existing checks were structurally incapable of catching it.
             'all figure files exist' evaluated Path(r).is_file() from the REPO ROOT, where the
             path does exist -- it validated the wrong directory. 'figures embedded in pdf'
             compared image-object count >= figure count, and a PDF whose surviving figures
             each contain two image objects satisfies that inequality with a third of the
             figures missing. Verified: with one figure deliberately broken, the count check
             still PASSES (80 objects vs 41 figures)."
    fix: "Figure references are absolute, matching the convention every phase before 0G used.
          Two new checks: paths are resolved FROM PANDOC'S WORKING DIRECTORY, and the pandoc
          warning stream is scanned for 'Could not fetch resource'. Negative-tested: reverting
          one path to repo-relative fails both."
    status: FIXED
    lesson: "A build warning nobody reads is not a warning. The verification suite now consumes
             the toolchain's own warning stream instead of only inspecting its output."
  - id: 35
    title: "PHASE-0I SCIENCE NOT FULLY PROPAGATED INTO CURRENT-FACING REPORT SECTIONS"
    detail: "Phase 0I added reliability physics but left seven current-facing statements in the
             Phase-0H state. The Executive Summary still framed the answer as 'Phases 0G and 0H
             find'; the limitations still said 'Neither local metric is fit for decisions',
             which referred to the two REJECTED Phase-0H proxies and not to the new M2 metric
             that passes every convergence test; they still said 'GaN and MLCC layer heights are
             still open' when GaN is source-backed; 'Exact next work' still recommended
             publication reframing; the validation status still described the mechanics as 'M0
             -- no plasticity, creep or fatigue' when a temperature-dependent
             elastic/plastic/creep submodel now exists; the governing equations stopped at M0
             thermoelasticity with no M2 constitutive law, damage-metric definition or
             stabilised-cycle definition; and the method still counted eight gates."
    detected_by: "Phase 0I-R Sec.18, a dedicated re-read of the current-facing sections against
                  the Phase-0I evidence"
    impact: "The report understated its own capability -- it described a model without failure
             physics after failure physics had been added -- and pointed the reader at the wrong
             next step."
    fix: "All eight items (A-H) repaired at the single source of truth and regenerated. The
          validation block now splits GLOBAL M0 from LOCAL M2 explicitly, and four M2 governing
          equations were added: the constitutive law, the damage-metric definition, the
          stabilised-cycle definition, and an explicit no_life_equation entry recording that no
          lifetime equation is current. Two further items were found while verifying A-H and are
          also fixed: the current-facing guard scope excluded the LIVE phase narrative even
          though it is headed 'current authoritative', so three over-claims inside it had never
          been checked; and the report build was not idempotent, because the new
          reliability_metric fragment was anchored on a heading that a later splice consumes."
    correction_to_this_entry: "This fix was FIRST LOGGED BEFORE IT WAS APPLIED. The original
          text read 'All seven repaired ... and regenerated' while items A, B, E and H were still
          in the Phase-0H state; only C, D, F and G had actually been done. Caught in the Sec.20
          follow-up by re-reading the GENERATED REPORT rather than the intent, and recorded as
          DEFECT #36. All eight are now applied and verified in the generated text."
    status: FIXED
    lesson: "A phase that ADDS capability must audit the current-facing text as carefully as a
             phase that withdraws a claim. DEFECT #29, #32 and #35 are the same failure in three
             directions: stale withdrawal, stale scope, and now stale capability."
  - id: 36
    title: "SIX NEW GUARDS WERE NEGATIVE-TESTED AGAINST PARAPHRASES, NOT THE REAL SENTENCES"
    detail: "Sec.20 requires every new semantic guard to be shown FAILING on an injected
             violation before it is trusted. All six Phase-0I-R guards passed that test. The
             test was invalid. The injected sentences were written by the same author, in the
             same sitting, as the regexes -- so each injection was phrased to match its own
             pattern. Checked afterwards against the sentences that had ACTUALLY appeared in
             the report, ALL SIX guards missed: the real text said 'Z5 is eliminated' where the
             guard looked only for the literal string '2.5D'; 'A 0.300 mm substrate is
             realizable' where the guard looked for 'manufacturable'; 'Z1 keeps a 30 mW edge'
             where the guard looked for 'electrically better'; 'the relative-life ratio is
             parameter-free' where the guard required the unhyphenated 'relative life'; and 'of
             eight failure mechanisms only ONE is computable' where the guard required the
             reversed word order 'only one of eight failure mechanisms'."
    detected_by: "Phase 0I-R Sec.20 follow-up, by testing each pattern against text quoted from
                  the report itself rather than against text written for the test"
    impact: "Six guards reporting PASS while blind to their own subject matter, and one real
             consequence: the stale Executive Summary sentence 'of eight failure mechanisms
             only ONE is computable' sat in a current-facing section, in guard scope, and was
             not flagged. It was found by manual re-reading, which is exactly what the guard
             existed to replace."
    second_finding: "Even after the patterns were widened, the mechanism guard still passed on
                     the real sentence -- its exoneration context contained 'phase 0h', and the
                     stale sentence attributed the count to Phase 0H. An exoneration term that
                     appears in the violating sentence nullifies the guard silently. The bare
                     term 'open' in the 0.300 mm guard had the same weakness and was tightened
                     to 'is open' / 'remains open'."
    third_finding: "DEFECT #35 was logged as FIXED before the fix was applied. Its log read
                    'All seven repaired at the single source of truth and regenerated' while
                    four -- the Executive Summary attribution, the mechanism count, the next-work
                    recommendation and the gate count -- were still in the Phase-0H state. Three
                    of the seven had genuinely been repaired, which is what made the log
                    plausible. All are now actually repaired and verified by re-reading the
                    generated report, not the intent."
    fix: "Patterns rewritten against the verbatim historical sentences. A PERMANENT self-test
          replaces the one-off injection: GUARD_SELFTEST pairs every one of the fifteen
          current-facing guards with the exact sentence it exists to reject, and the build fails
          if any pattern misses its sentence OR if an exoneration context clears it. A coverage
          check makes it impossible to add a guard without a self-test sentence. The eight
          pre-0I-R guards were retro-fitted with the same self-test."
    negative_tested: "Yes, twice, on the self-test itself. Narrowing the Z5 pattern back to its
                      paraphrase-only form fails with 'PATTERN MISSES ITS OWN SENTENCE'.
                      Re-adding the 'phase 0h' exoneration fails with 'EXONERATED BY ITS OWN
                      CONTEXT'. Both are the exact defects the self-test was built to detect."
    status: FIXED
    lesson: "A negative test written by the author of the guard, at the same time as the guard,
             tests the author's model of the failure and not the failure. The injection must be
             the REAL text -- recovered from the artifact or its history -- and it must be
             asserted permanently in the suite, not performed once by hand. DEFECT #31 said a
             check never seen to fail has not been tested; #36 adds that a check seen to fail on
             a straw man has still not been tested."

  - id: 37
    title: "OLD LOCAL-PROXY RESULT SURVIVED AFTER THE M2 METRIC REPLACED IT"
    detail: "The Executive Summary stated, as a CURRENT result, that 'the opposition is resolved
             ONLY in global warpage: in the one local metric available the thickness effect is
             1.96 %, which is 7x below that metric's own uncertainty.' Both halves belonged to
             Phase 0H. The '1.96 %' is the thickness effect in the SMEARED INTERFACE SHEAR proxy,
             and the '7x below its own uncertainty' is that proxy's 14.14 % floor. Phase 0H
             REJECTED that proxy as non-monotone under refinement, and Phase 0I replaced it with
             a convergent M2 solder metric -- but the sentence describing the rejected proxy
             stayed in the current-facing text and kept asserting that no local metric resolves
             the thickness effect."
    detected_by: "Phase 0J Sec.38, a directed re-read of the Executive Summary against the
                  Phase-0I-R state"
    impact: "The report asserted, as current, that the thickness opposition is invisible locally.
             Phase 0J measures it directly at all eleven z-sweep points and finds it monotone in
             every architecture: -5.6 % (Z1), -6.1 % (Z2), -17.2 % (Z4) in accumulated inelastic
             path. The trend is real, preserved, and simply 3-5x smaller than global warpage
             makes it look."
    fix: "Replaced at the single source of truth with the measured M1 values and the explicit
          statement that the 1.96 % figure is withdrawn as a current result and retained only in
          the Phase-0H historical section, which Sec.38 forbids editing."
    status: FIXED
    lesson: "A phase that REPLACES a metric must retire the replaced metric's CONCLUSIONS, not
             only its numbers. DEFECT #29, #32, #35 and now #37 are four faces of one failure:
             stale withdrawal, stale scope, stale capability, and stale superseded-instrument."
  - id: 38
    title: "PHASE-0J-R LIFE-LAW STATUS NOT FULLY PROPAGATED INTO CURRENT-FACING REPORT TEXT"
    detail: "Nine current-facing statements still described a project that could not predict
             life, three phases after it could: 'No lifetime is predicted anywhere'; 'the
             EXPONENT m does NOT cancel, and no m is sourced'; 'Over m = 0.5 to 5 the Z2/Z1 ratio
             spans 1.25 to 9.18'; 'solder fatigue ... has no life law and so yields no
             pass/fail'. All were in the Executive Summary and all were generated from the
             single source of truth."
    detected_by: "Phase 0K Sec.1"
    impact: "The report understated its own capability -- no life law after four had been
             admitted, no sourced exponent after two primary sources had bounded it at -1 and
             -1.3."
    fix: "Repaired at the source of truth and regenerated, separating the four things that must
          not be conflated: RELATIVE LIFE validated at 1.21-1.38x, CONDITIONAL ABSOLUTE LIFE not
          validated at a 4.1x spread, REQUIRED LIFE open, G2 not tested. Six guards added, each
          self-tested on the VERBATIM standing sentence and each negative-tested to failure."
    status: FIXED
    lesson: "A phase that converts a negative result into a positive one must retire the
             negative's language as carefully as a phase that withdraws a claim retires the
             claim. Understating your own model never trips a scepticism check."
  - id: 39
    title: "PHASE-0K NARRATIVE CURRENT, BUT GENERATED STATUS AND NEXT-WORK FRAGMENTS PRE-0K"
    detail: "The Executive Summary's 'Exact next work' still read 'PHASE 0K -- SYSTEM-OWNER
             MISSION DEFINITION' and still asserted 'the remaining blocker is ... a REQUIRED
             LIFE' -- the exact claim Phase 0K withdrew. Worse than one stale sentence: NO
             Phase-0K result appeared in current-facing text at all. The 474/3206 decision
             regions, the two-blocker finding, the G2 decision map and the experiment design each
             occurred ZERO times."
    detected_by: "Phase 0K-R Sec.1"
    impact: "The report recommended as next work a phase that had already run, and named one
             blocker where its own analysis had established two."
    fix: "next_work rewritten from the source of truth. Sec.2 typed contract added
          (relative_life_0kr, absolute_life_0kr, mission_0kr, g2_0kr, experiment_0kr,
          next_step_0kr) so current status is GENERATED rather than remembered. Four guards with
          verbatim self-tests, all negative-tested. Sec.34 post-build audit added: the FINAL
          Markdown and the text extracted from the FINAL PDF are re-read AFTER generation --
          8 current-facing headings, 15 stale patterns, 0 hits."
    status: FIXED
    lesson: "DEFECTS #29, #32, #35, #37, #38 and #39 are six instances of ONE failure: the
             narrative advances and the generated status does not. The structural fix is not
             another guard but a typed contract plus the rule that the BUILT ARTIFACT is what
             gets audited -- all three most recent report defects occurred at or after the
             generation step, not in the source."

  - id: 40
    title: "CREEP CALIBRATION VARIABLE DOES NOT MATCH THE SOLVER'S DRIVING VARIABLE"
    detail: "fit_norton_data (solder_model.py:84-96) regresses log(rate) on log(sigma_APPLIED)
             -- the total uniaxial stress of a constant-load creep test, with no yield
             subtraction. CalculiX integrates eps_dot = A*(sigma_vm - sigma_y(eps_in))^n and
             gives IDENTICALLY ZERO inelastic strain when sigma_vm <= sigma_y (incplas.f:310-311,
             599-605). These are different independent variables."
    detected_by: "Phase 0L Parts III-V: CalculiX 2.23 source trace, then 7603 single-element
                  solver increments against three candidate laws."
    impact: "The overstress is NEGATIVE at 16 of the 19 calibration points, so in the solver's
             own variable the calibration experiment lies entirely inside the elastic domain.
             Solver probe TEST F: the card reproduces 0 of 19 of its own source points; 16 give
             exactly 0.0 and the other three are low by 4.7e7x, 1.8e12x and 2.4e5x. The quoted
             8.3 % rms fit residual measures a curve in a variable the solver never evaluates."
    fix: "NOT repaired silently. Part VI shows the consistent refit FIT-B is NOT CONSTRUCTIBLE
          (0 usable points at 45 and 80 C, 1 at 115, 2 at 150). The only consistent route is
          sigma_y -> 0, which is what the CalculiX manual itself prescribes for creep below
          yield, and is carried as model M1 in the Part XI replay."
    status: CONFIRMED
    lesson: "A fit residual is only evidence if the residual is computed in the variable the
             consumer uses. The check that caught this -- feed the calibration points back
             through the solver and see if it returns them -- costs one afternoon and was never
             run in eleven phases."

  - id: 41
    title: "THE CREEP DATA IS Sn3.9Ag0.6Cu, AND ALL THREE YUAN TABLE CITATIONS ARE WRONG"
    detail: "solder_model.py cites Yuan 2023 'Table 26' for the 19 creep points, 'Table 27' for
             the Garofalo constants and 'Table 31' for the Chaboche constants. The paper was
             retrieved in full (PMC10381129). It has ELEVEN tables. The correct sources are
             Table 5, Table 6 and Table 10; the VALUES all match, only the table numbers are
             wrong. Yuan section 4.1 states the creep dataset 'is drawn from Xiao and Armstrong
             [10]', whose title is 'Tensile creep and microstructural characterization of bulk
             Sn3.9Ag0.6Cu lead-free solder'."
    detected_by: "Phase 0L Part V, by fetching the cited paper instead of the citation."
    impact: "The creep half of the SAC305 card is calibrated on Sn3.9Ag0.6Cu -- 3.9 wt% Ag
             against SAC305's 3.0 wt%. The yield half traces to Motalab SAC305 data through an
             Anand fit and then synthetic curves, so the two halves of one card are different
             alloys, and the overstress law subtracts one from the other. The brief forbids
             transplanting high-Ag SAC sets without transferability evidence; Part VII searched
             344 works and found none."
    fix: "Citations corrected in solder_model.py (values unchanged, so no result moves). The
          alloy mismatch is NOT repairable from available data and is carried as a standing
          condition on every creep-derived result."
    status: CONFIRMED
    lesson: "A citation that names a table number is checkable in minutes and was carried for
             eleven phases, into the report and into the Phase-0K-R domain audit, unchecked."

  - id: 42
    title: "*CREEP TEMPERATURE GRID: LINEAR-IN-A INTERPOLATION AND CLAMPING ABOVE 125 C"
    detail: "creeps.f:300-330 and materialdata_me.f:413-429 interpolate A, n and m LINEARLY
             between card rows and CLAMP outside them. norton_at() builds the rows on an
             Arrhenius basis, so solver and intent agree only AT the rows. Production decks
             (run_zcompare.py:36, run_convergence.py:27) write rows at -40/0/25/50/75/100/125 C."
    detected_by: "Phase 0L Part IV TEST G (measured 0.9996-0.9999 against linear-in-A, and
                  1.33x / 2.80x / 20.0x against Arrhenius) plus card_grid_audit.py."
    impact: "Between rows over 45-150 C the solver's rate is 0.83x to 3.88x the intended value;
             worst on the grid is 8.94x. Above the 125 C top row the card clamps, and because
             the clamped exponent is wrong too the error is stress-dependent: 0.62x at 20 MPa
             rising to 8.70x at 100 MPa. The 110->150 C candidate experiment profile runs
             entirely above the top row."
    fix: "Part XI replays every model on a corrected 18-row grid spanning -40..150 C, which cuts
          the between-row span to 0.81-1.51x and removes the clamping. M0_COARSE is retained in
          the replay so the grid effect is separable from the constitutive effect."
    status: CONFIRMED
    lesson: "A material card is an interpolation table, not a function. Whatever the card
             generator believes about the functional form is discarded at the solver boundary."

  - id: 43
    title: "OMITTING *PLASTIC IS UNDEFINED BEHAVIOUR, NOT A ZERO YIELD SURFACE"
    detail: "The manual says that without a *PLASTIC card 'a zero yield surface without any
             hardening is assumed'. In fact materialdata_me.f:331-333 sets plconloc(801)=0.5,
             incplas.f:130 therefore sets user_hardening=1, and incplas.f:288 calls uhardening().
             The shipped src/uhardening.f is an empty stub that never assigns fiso, which
             incplas.f never initialises."
    detected_by: "Phase 0L Part IV TEST A, which probed both routes precisely because the
                  source said they need not agree."
    impact: "LATENT, not active: every current deck carries a *PLASTIC card. In this binary the
             two routes agree to 3e-6, so the uninitialised value reads as zero here -- an
             observation about one build, not a guarantee."
    fix: "Rule adopted and used in all Phase-0L decks: to obtain a zero yield surface, write an
          explicit flat *PLASTIC card at sigma_y = 1e-6 MPa rather than omitting the card."
    status: DOCUMENTED (latent, not triggered)
    lesson: "Where the manual and the source disagree about a default, the source wins and the
             behaviour must be probed rather than assumed."

  - id: 44
    title: "PHASE-0L CONSTITUTIVE AND RELIABILITY STATUS NOT PROPAGATED INTO CURRENT-FACING TEXT"
    detail: "A directed comparison of both reports against the Phase-0L findings, on thirteen
             named claim patterns, found 21 stale current-facing hits. In the historical report
             they cluster in three GENERATED blocks: the Executive Summary (8 hits, and NO
             mention of Phase 0L anywhere in it), the governing-equation status (2 hits,
             including 'C still cancels in a ratio, so the RELATIVE ratio Z2/Z1 = 1.21-1.38 is
             validated', which is wrong in the number, in the word validated and in the
             cancellation claim), and the mechanical validation status ('M0 rung only ... no
             plasticity, creep or fatigue', which describes the GLOBAL model as if it were the
             whole mechanical model). In the standalone report there are three genuine defects
             plus one wrong mechanism, the worst being an INTERNAL CONTRADICTION: section 17.4
             says 68 specimens per cell and section 23.1 says 34."
    detected_by: "Phase 0L-R Part 1, scripts/phase0lr/propagation_audit.py"
    impact: "A reader of either Executive Summary would take away a superseded relative-life
             range, the word VALIDATED where only CONDITIONAL is earned, an experiment described
             as ready to execute when it is blocked, and a specimen count superseded twice over."
    fix: "Repaired at the source. All three historical blocks are generated from
          current_facing.* in this file, so the YAML was rewritten and the blocks regenerated;
          the five standalone defects were repaired in place. A scanner bug was also fixed
          during the audit: '##' subsections did not inherit their parent chapter's scope, which
          made superseded chapters read as current."
    status: CONFIRMED AND FIXED
    lesson: "This is the SEVENTH instance of one failure -- the narrative advances and the
             generated status does not. Phase 0K-R added a typed contract to stop it and the
             contract itself was not extended by Phase 0L. A contract only works if the phase
             that changes the science is required to change the contract in the same breath."

  - id: 45
    title: "BOARD-LEVEL CAMPAIGN WAS DESIGNED BEFORE THE DOMINANT CONSTITUTIVE UNCERTAINTY WAS CLOSED"
    detail: "The 4-cell, 34-per-cell, 136-package campaign was designed in Phase 0K-R and costed
             in Phase 0L on the assumption that specimen count was the binding constraint. It is
             not. With the corrected model the ceiling on the discrimination Z-score is 3.61
             against a target of 3.0, and that ceiling is set by the SIMULATION-uncertainty floor
             of 0.06, which no number of boards reduces. Halving that floor takes the campaign
             from 48 specimens per cell to 18, i.e. from 192 packages to 72."
    detected_by: "Phase 0L-R Part 16 value-of-information analysis,
                  results/phase0lr/sample_count_vs_simulation_uncertainty.csv"
    impact: "Worse than inefficiency. The campaign's headline output is an absolute-life
             constant, and fitting that constant on top of an extrapolated constitutive model
             buries the constitutive error INSIDE the fitted constant, where it can never be
             separated again. Running the campaign first does not merely under-inform, it
             contaminates the quantity it is run to obtain."
    fix: "Not a code defect -- classified as a SEQUENCING defect. The campaign is re-sequenced
          behind material characterisation, not cancelled. Sample count is marked PROVISIONAL and
          must not be frozen while constitutive uncertainty dominates."
    status: CONFIRMED (sequencing, not code)
    lesson: "A design of experiments is only as good as the uncertainty decomposition behind it.
             Phase 0K-R optimised the term it could compute -- Weibull scatter -- without
             checking which term actually bound the answer."

  - id: 46
    title: "STEP-BOUNDARY TEMPERATURE ALIASING INFLATED EVERY INELASTIC-ENERGY NUMBER BY 18.5 %"
    detail: "parse_temperature() kept the FIRST temperature block at a given printed time while
             parse_tensors() keeps the LAST. CalculiX prints the same rounded time on both sides
             of a step boundary, so tensors and temperature were taken from OPPOSITE sides of
             every boundary -- 11 of 690 time points, at which the parsed temperature was wrong
             by about 55 K. The thermal strain is hydrostatic, so this injected a spurious
             VOLUMETRIC inelastic strain of 1.2e-3 into a quantity that must be isochoric: the
             trace of the reconstructed inelastic strain was 8.7e-4 against 2.9e-6 for a
             reconstruction using the solver's own mechanical strain."
    detected_by: "Phase 0L-R Part 4. An independent reimplementation using the solver's ME
                  output disagreed with production by a suspiciously STABLE 18.5 %; splitting the
                  work into deviatoric and volumetric parts localised it immediately -- the
                  deviatoric parts were identical to six figures and the whole discrepancy was
                  volumetric."
    impact: "Every energy-derived quantity produced before this phase is affected: M3/M5, w_acc,
             w/eps, the discrimination ratio D, the energy-based life-law ratios and hence the
             experiment sample count. PEEQ and every strain-based metric are UNAFFECTED, because
             PEEQ is read from the solver rather than reconstructed. Measured on the M1 Z1
             baseline, W falls from 1.45725 to 1.19157 MJ/m3 once fixed."
    fix: "parse_temperature now keeps the LAST block at each time, matching parse_tensors;
          agreement with the independent implementation improves from 18.5 % to 0.76 %. The
          decision-relevant replay cells were re-run with the fix. RECOMMENDED PERMANENT FIX,
          not applied in this phase because it requires re-running every deck: request ME in the
          decks and compute eps_in = ME - eps_elastic, which removes the temperature from the
          energy path entirely."
    status: CONFIRMED AND FIXED
    lesson: "The audit that found this was written to check quadrature and convergence. What it
             actually caught was a parser disagreeing with its sibling about which side of a
             discontinuity to stand on. An independent reimplementation is worth more than a
             more careful reading of the same one -- and the first version of THIS audit was
             itself wrong in the opposite direction, for the same class of reason, until its own
             temperature parser was checked against the solver's thermal strain."


  - id: 47
    title: "PER-VIA CURRENT LIMIT WAS A PRIMITIVE IN AMPERES, AND IT IS THE ONLY THING THAT
            SETS FIELD RESISTANCE"
    detail: "configs/phase0dr/power_path_graphs.yaml carries i_max_a per tier -- BGA 0.5 A,
             C4 0.2 A, TSV 0.033 A, microbump 0.02 A -- as a primitive number. Phase 0M Part 3
             derives that under the allocation policy the framework actually uses,
             R_field = rho h J_max / I with the conductor cross-section cancelling identically,
             so J_max is the ONLY parameter that sets the field resistance and it was entered
             rather than derived."
    detected_by: "Phase 0M Part 1 parameter classification"
    impact: "The via-field resistance, IR drop and Joule loss of every architecture depend on a
             primitive. The geometry the framework carefully models cancels out."
    fix: "i_max_a is replaced by J_max * A_conductor, with J_max a PROCESS limit swept over the
          sourced 1e8 to 4e8 A/m2 envelope and A_conductor DERIVED from r and the liner."
    status: CONFIRMED, MODEL REPLACED IN scripts/phase0m/interconnect.py

  - id: 48
    title: "ONE GLOBAL CURRENT-CROWDING CONSTANT APPLIED TO FOUR DIFFERENT INTERCONNECT CLASSES"
    detail: "scripts/phase0e/architecture0e.py sets CROWDING_DEFAULT = 1.326, measured in HFSS on
             ONE P/G TSV loop, and multiplies the single-conductor resistance of BGA, C4, TSV and
             microbump by it alike."
    detected_by: "Phase 0M Parts 7 and 8"
    impact: "K_crowd measured over 107 converged transition geometries spans
             0.606 to 1.483, a factor of 2.45. A generous landing pad gives
             K < 1; a narrow trace entry gives K > 1.4. The excess resistance dR is
             length-INDEPENDENT while K_crowd is not, so K_crowd is not even the right form."
    fix: "A 3-D DC conduction solver derives K_crowd per geometry
          (results/phase0m/current_crowding_transition_sweep.csv). dR, not K_crowd, is the
          transferable quantity."
    status: CONFIRMED, FUNCTION AVAILABLE, NOT YET WIRED INTO THE PRODUCTION PATH

  - id: 49
    title: "THE TSV LINER IS ABSENT FROM THE CONDUCTOR AREA"
    detail: "ppdn.tier_area_m2() uses the full drilled diameter as conductor. A real TSV has a
             dielectric liner between the copper and the silicon."
    detected_by: "Phase 0M Part 2"
    impact: "The conducting area is overstated by [r/(r-t_ox)]^2 = 7.0 % at r = 15 um,
             t_ox = 0.5 um. R_field is UNAFFECTED under minimum-capability allocation because
             the cross-section cancels, but the per-via current, the copper fraction and every
             derived thermal and mechanical effective property are wrong -- and Part 21 shows
             the liner fraction t_ox/r is what makes a fine-pitch field thermally worse in
             plane at equal copper."
    fix: "TSVGeometry carries t_liner and uses r_cu = r - t_liner for all conducting areas."
    status: CONFIRMED, MODEL REPLACED

  - id: 50
    title: "THE CONVERTER AREA MODEL SILENTLY ASSUMES FOUR-LAYER VERTICAL STACKING, AND SAYS
            THE OPPOSITE"
    detail: "Scalable_Integrated_VR/src/HVR_FULL_OPT_EPC_V2.py::_compute_area returns
             max(N*fp_hs, K*fp_ls, K*fp_ind, (N-1)*fp_cap). Its docstring says 'Total estimated
             component footprint' and the file header claims the function was 'fixed: area = SUM
             of all component footprints (not max)'. It is a max. The sibling implementation in
             HVR_FULL_OPT_sizing.py is honest about it: 'Vertical stacking model: total footprint
             is the max across layers'."
    detected_by: "Phase 0M Part 14"
    impact: "The reported 5.61 mm2 per VR cell is a PER-LAYER footprint. The summed component
             footprint of the compiled 1-kW cell is 18.01 mm2,
             3.21x larger. Component-level z
             partitioning is therefore ALREADY assumed -- by the area model and by nothing else.
             Nothing checks that the four layers exist in a given architecture, and a
             single-level VR misses the 500 mm2 die shadow by 1.76x."
    fix: "configs/phase0m/component_partition_templates.yaml makes the partition explicit and
          checks each template for height, per-level area, array footprint against the die
          shadow, voltage-domain mixing and level crossings."
    status: CONFIRMED, DOCUMENTED, UPSTREAM NOT EDITED (separate repository)

  - id: 51
    title: "INTRA-CONVERTER ROUTING IS ABSENT FROM EVERY LOSS TERM"
    detail: "The framework models VR-to-package and package-to-POL routing. It models no metal
             between the converter's own components. The upstream loss model contains
             R_DS(on), the inductor DCR, the capacitor ESR and the switching losses, and no
             metallization at all."
    detected_by: "Phase 0M Part 10"
    impact: "4.06 to 39.31 W system-wide, 0.41 to 3.93 %
             of the load, against a converter loss of 125.26 W. Common-mode across Z1, Z2 and Z4,
             so it does not reorder them, but it is not small. It also exposes a feasibility
             failure the framework could not see: the VR output plane needs 8.6x the available
             tile width to stay inside the sourced copper current-density envelope."
    fix: "scripts/phase0m/routing.py models it at R0/R1/R2 fidelity."
    status: "CLOSED IN PHASE 0M-R. Status at discovery (Phase 0M): CONFIRMED, MODEL
             BUILT, NOT YET WIRED INTO THE PRODUCTION LOSS TOTAL. Superseded by Phase
             0M-R, which put intra-VR routing into the production loss ledger as
             P_intraVR_metal and P_intraVR_vertical, template-aware."

  - id: 52
    title: "THE CALIBRATED COOLING BOUNDARY IS INCONSISTENT WITH THE SOURCE'S OWN FLOW RATE
            BY A FACTOR OF 16.8"
    detail: "h_top = 166 000 W/m2K was inverse-calibrated to reach 84 C. Derived from geometry
             and flow, no laminar microchannel architecture reaches it: the best laminar case
             gets 0.70x and reaching the calibrated value appeared to need 50 g/s in the
             transitional regime, 74 W of pumping and 1.46 MPa -- three figures WITHDRAWN
             in Phase 0M-R2 and retained here only as the status at discovery. Withdrawn
             because: the 50 g/s point sits at Re = 2342, between the laminar ceiling
             of 2300 and Gnielinski's floor of 3000, where no validated correlation
             exists. What survives is the qualitative finding that no laminar
             microchannel architecture reaches the calibrated value. Separately, at the source's stated 1.6 g/s
             the coolant temperature rise for 1125 W of heat is 168 K, which single-phase water
             cannot do; 26.9 g/s is needed for a 10 K rise."
    detected_by: "Phase 0M Parts 23-25"
    impact: "The Robin boundary absorbs a caloric resistance that DOMINATES the thermal path at
             low flow and presents it as a surface property. It charges no pumping power --
             7.4 % of the load at the calibrated operating point. And because its sink is a
             single temperature it cannot produce a streamwise gradient: imposing the real
             coolant rise moves the die warpage by up to 8.19 %
             and T_max by 11.3 K."
    fix: "scripts/phase0m/cooling.py derives h from channel geometry and flow with source-backed
          correlations and charges the pressure drop and pumping power."
    status: "CLOSED IN PHASE 0M-R. Status at discovery (Phase 0M): CONFIRMED, MODEL
             BUILT, NOT YET ADOPTED BY THE ETM LOOP. Superseded by Phase 0M-R, which
             placed the physical microchannel cooler in the production ETM loop. The
             correlation-domain question this row raises about the 50 g/s point is
             itself re-audited in Phase 0M-R2."

  - id: 53
    title: "THE CURRENT-STATUS GENERATOR PRINTED A SUPERSEDED PHASE'S BASIS UNDER THE CURRENT
            PHASE'S VERDICT HEADING"
    detail: "`verdict.basis` was written at Phase 0H and never phase-scoped, so every later
             phase printed six Phase-0H bullets beneath its own verdict heading while the same
             report's Executive Summary said the opposite. Cross-report consistency was 25/25
             throughout, because both reports were generated from the same stale field and
             therefore agreed with each other."
    detected_by: "Phase 0M-R Section 2"
    impact: "Eight phases of reports carried a basis that did not belong to their verdict.
             Agreement between two reports generated from one stale source is not evidence."
    fix: "scripts/phase0g/generate_status_sections.py scopes the key as `basis_<phase>` with the
          unscoped key as a fallback only for the phase that wrote it; scripts/phase0mr/state_contract.py
          owns the authoritative field set."
    status: "CLOSED IN PHASE 0M-R. Registered retroactively in Phase 0M-R2: Phase 0M-R
             documented this defect in results/phase0mr/DEFECT53_REPORT_STATE_AUDIT.md and
             referenced it in three superseded notes, but never added it as a numbered row, so
             the defect register itself stopped at 52 while the prose spoke of #53."

  - id: 55
    title: "THE TSV-FIELD MATERIAL OVERRIDE WAS KEYED ON IN-PLANE FOOTPRINT, SO THE PCB, THE
            BGA FIELD AND THE BACKSIDE CONVERTER WERE MODELLED AS A COPPER/SILICON COMPOSITE"
    detail: "etm.mesh decided which layers CONTAIN the TSV field from the same `footprint`
             field that says how far a layer extends IN PLANE. Every assembly layer added
             below z = 0 in Phase 0G -- the PCB, the BGA field, and for ARCH_Z2 the backside
             converter -- spans the substrate extent and therefore had its material
             overwritten with `tsv_homog` inside every tile."
    detected_by: "Phase 0M-R2 Section 2, while building the ARCH_Z4 power die"
    impact: "522 to 859 mm3 of misassigned volume against 20 to 77 mm3 of real via field,
             and the ratio is architecture-dependent (25.7x for Z1, 11.2x for Z2, 6.8x for
             Z4), so it did not cancel in the comparison. Where FR4 belongs the model had
             k too high by 530x, E by 6.3x and CTE too low by 3.4x -- in precisely the
             layers that set package warpage and corner-joint shear, the deciding metric.
             Correcting it moved Z1 die warpage from 25.37 to 44.50 um (+75 %) and the Z1
             corner driver from 4.2803 to 4.9803 um (+16.4 %), and moved the Z1/Z2 driver
             ratio from 1.2552 to 1.1942."
    fix: "etm.mesh.Layer gains an explicit `tsv_host` flag. `footprint` and `tsv_host` are
          now separate questions, and only layers the field actually passes through carry
          it. Negative-tested in tests/phase0mr2/test_geometry_and_cooling.py."
    status: "CONFIRMED AND CLOSED IN PHASE 0M-R2"

  - id: 54
    title: "PHASE-0M-R PRODUCTION STATE DID NOT PROPAGATE THROUGH ALL CURRENT-FACING REPORT
            SECTIONS, AND THE CHECKER COULD NOT SEE IT"
    detail: "The Phase-0M-R cross-report checker matched each report as ONE FLAT STRING. A
             REQUIRED phrase found anywhere satisfied the check for the whole document, so
             `microchannel` occurring in the Phase-0M-R chapter passed the cooling check while
             the Validation Status block three thousand lines earlier still described the
             frozen inverse-calibrated Robin boundary. The checker also had no way to detect an
             OMISSION: a current-facing section that never mentions a production model cannot

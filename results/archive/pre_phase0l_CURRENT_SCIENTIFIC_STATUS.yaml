# SINGLE SOURCE OF TRUTH for what this project currently claims.
#
# WHY THIS FILE EXISTS (Phase-0G defect #29)
# The full report stated the same claim in several places -- Executive Summary, Positive
# Results, Negative Results, the uncertainty ladder, Next Steps -- and each phase updated
# only some of them. By Phase 0F the document simultaneously asserted that "200 -> 500 um is
# win/win/win and survived every correction" and that those thicknesses are unbuildable; that
# "no architecture-dependent thickness tradeoff exists" and that one appears at 1 kW; and it
# still listed kW-scale behaviour as NOT TESTED after the 1-kW gate had run.
#
# Regex assertions cannot catch that: every individual sentence was true when written. The
# fix is structural. Every current-status section of the report is now GENERATED from this
# file, and tests compare the generated text against it.
#
# STATUS VOCABULARY
#   PROVEN      numerically converged AND cross-checked against an independent solver
#   SUPPORTED   converged in one solver, no independent cross-check
#   CONDITIONAL true only under an input that is still open; the condition is named
#   SUPERSEDED  was asserted in an earlier phase and is no longer current; names what replaced it
#   OPEN        not determined
#   NOT_TESTED  a gate that has never been evaluated

meta:
  current_phase: "0K-R"
  phase_name: "Experimental-domain, statistical-power and report-consistency closure"
  supersedes_verdict_of: "0H"
  rescopes_verdict_of: "0I"
  extends_verdict_of: "0I-R"
  supersedes_verdict_of_also: "0J"
  date: "2026-09-14"
  extends_verdict_of_also: "0J-R"
  note_on_0j: >-
    The Phase-0J verdict NO ADMISSIBLE SAC305 LIFE LAW is SUPERSEDED. It was correct on the
    evidence then available and explicitly recorded its own cause as ACCESS, not physics.
    The primary papers were subsequently supplied and 7 of its 10 database entries change.
  note_on_0h: "The Phase-0H verdict is NOT withdrawn. It was correct for the M0
    thermoelastic model and the single architecture then modelled, and it said so.
    Phase 0I adds the two things it named as missing -- z-placement as a real
    variable, and temperature-dependent failure physics -- and reports what changes."
  optimiser_built: false
  optimiser_recommended: false   # see verdict.optimiser_gate

authoritative_model:
  geometry:
    status: PROVEN
    hvr_cell_height_um: 720
    basis: "500 um inductor (SOURCED, upstream INDUCTOR_LIBRARY) + GaN and MLCC layers (OPEN,
            nominal bound) + 2 x 10 um inter-layer RDL"
    substrate_rule: "t_cell + h_tsv <= h_sub, h_tsv >= 50 um"
    realizable_substrate_range_mm: [0.80, 2.00]
    note: "h_sub = 200 um and 500 um are GEOMETRICALLY INFEASIBLE for the selected converter.
           All Phase-0B..0E absolute magnitudes rest on a geometry that cannot be built."
  cooling:
    status: SUPPORTED
    model: "equivalent Robin boundary on the TIM top surface"
    h_top_W_m2K_at_1kW: 166000.0
    calibrated_to: "June-2026 T_j,max = 84 C at 1 kW"
    phase0b_value_W_m2K: 17521.6
    ratio: 9.47
    caveat: "June cools with substrate-embedded micro-channels adjacent to the GaN layer.
             That topology cannot reach 84 C in this package model at any film coefficient
             (floors near 91 C), so the top-cooled field is the only one consistent with the
             junction target. The through-thickness gradient direction is therefore an
             assumption."
    phase0g_bound: "Phase 0G bounded this rather than leaving it open. Swapping to the
                    substrate-side topology changes warpage magnitudes by up to +45 % and
                    halves S_h (-0.886 -> -0.431), but flips NO sign and changes NO ordering.
                    Across a 4x band in h_top the MOUNTED normalized response is invariant to
                    0.07 % (S_h = -0.4419 / -0.4421 / -0.4422). Substrate-side-only cooling is
                    separately THERMALLY INFEASIBLE at 1 kW (floors at 90.96 C, reaching
                    110.4 C at h = 2.00 mm)."
    evidence: "results/phase0g/cooling_topology_comparison.csv,
               results/phase0g/thermal_boundary_closure.md"
  rdl_stack:
    status: PROVEN
    source: "ECTC-2024 Table I"
    t_cu_um: 10
    line_space_um: [10, 2]
    layers: {vdd: 2, gnd: 2}
    occupancy_derived: 0.8333
    r_sheet_per_net_mohm_sq: 1.020
  tsv_allocation:
    status: PROVEN
    rule: "n_required <= n_allocated <= n_available; R_field = R_single / n_ALLOCATED"
    provisioning_J_cu_A_per_m2: {conservative: 1.0e+8, aggressive: 4.0e+8}
    reliability_limit: OPEN
  reference_point_1kw:
    load_w: 1000
    m_vr: 49
    j_target_A_per_mm2: 3.5
    areal_utilisation_pct: 55.0
    note: "June's own optimum is M = 70; 70 tiles of this footprint cannot be placed under
           this project's 0.5 mm keepout and gap rules."

claims:
  proven:
    - id: geometry_realizability
      statement: "A DVPD converter's component stack sets a hard lower bound on substrate
                  thickness, and that bound excluded both thicknesses swept in Phases 0B-0E."
      evidence: "results/phase0f/GEOMETRY_REALIZABILITY_AUDIT.md"
      phase: "0F"
    - id: rail_dependence
      statement: "The rail carried by a vertical interconnect changes its loss by ~1960x for
                  fixed transferred power, and which rail it carries is architecture-specific."
      evidence: "results/phase0dr/POWER_PATH_AUDIT.md"
      phase: "0D-R"
    - id: allocation_policy
      statement: "A via field's loss is proportional to current only under minimum-capability
                  provisioning; under geometric allocation the same field obeys P ~ I^2."
      evidence: "results/phase0e/tsv_allocation_sensitivity.csv"
      phase: "0E"
    - id: no_ac_correction
      statement: "No AC correction to the vertical interconnect is required at the switching
                  frequency; HFSS shows loop resistance flat to 0.18 % below the 19.1 MHz
                  skin crossover."
      evidence: "results/phase0e/em_validation.md"
      phase: "0E"
    - id: thermal_ordering
      statement: "An independent 3-D thermal solver reproduces candidate ordering exactly at
                  both 240 W and 1 kW."
      evidence: "results/phase0e/thermal_validation.md, results/phase0f/thermal_moose_1kw.csv"
      phase: "0E,0F"
    - id: unit_consistency_defect
      statement: "Vertical-tier losses were evaluated per regulator and summed with a
                  system-wide lateral loss, understating every vertical tier by n_vr -- 4x at
                  240 W and 49x at the 1 kW reference."
      quantitative: "P_TSV / P_TSV,corrected = 49.004 to 49.055 at all nine thicknesses;
                     independent hand check 89.7768 mW/VR x 49 = 4.399 W agrees"
      evidence: "results/phase0g/electrical_crossover_uncertainty.md, DEFECT #30"
      phase: "0G"
    - id: bcb_is_a_clamp
      statement: "The compact BC-B foundation restrains all three DOF on the underside plane,
                  so it models a clamp and not a board. It never recovers its own free limit:
                  at vanishing stiffness it gives 0.739 um where the free package on the
                  identical mesh gives 8.287 um."
      quantitative: "S_h > 0 at all 12 stiffnesses over 7 decades -- no crossover k* exists"
      evidence: "results/phase0g/support_stiffness_sweep.csv,
                 results/phase0g/board_foundation_calibration.md"
      phase: "0G"
    - id: thickness_ordering_universal
      statement: "Thicker substrate reduces warpage in the free package and in every
                  explicitly constructed assembly, across the whole board envelope from
                  compliant to metal-backed, at every stress-free reference temperature and
                  under every thermal boundary tested."
      quantitative: "S_h = -0.039 to -0.886 in 5 board cases; sign stable across 3 reference
                     temperatures and 4 thermal boundaries; 0 sign flips in 20 combinations"
      evidence: "results/phase0g/explicit_board_crosscheck.csv,
                 results/phase0g/footprint_m1_1kw.csv,
                 results/phase0g/cooling_topology_comparison.csv"
      phase: "0G"

    - id: gan_height_sourced
      statement: "The GaN device heights are no longer open. Manufacturer datasheets give
                  685 um nominal (815 max) for the high-side EPC2212 and 606 um for the
                  low-side EPC2090, against the 0/100/250 um envelope Phases 0F-0G invented."
      quantitative: "for the EMBEDDED architecture this raises h_sub,min from 0.770 mm to
                     1.176-1.426 mm"
      evidence: "results/phase0h/geometry_height_closure.md"
      phase: "0H"
      amended_by: "Phase 0I -- see architecture_dependent_realizability. The heights are
                   sourced and unchanged; what changed is that the BOUND they imply applies
                   only to the architecture that embeds them."
    - id: architecture_dependent_realizability
      statement: "COMPONENT-HEIGHT REALIZABILITY IS ARCHITECTURE DEPENDENT. Component height
                  constrains substrate thickness ONLY for the embedded architecture. Where the
                  converter is below, above or beside the substrate, nothing it contains
                  constrains h_sub, and the binding constraint becomes TSV manufacturability."
      quantitative: "h_sub,min = 1.276 mm embedded (MLCC nominal) against 0.300 mm for
                     backside, power-die and 2.5D -- the source-demonstrated TSV layer
                     thickness (June-2026 Table III, d = 30 um at h = 300 um, AR 10:1).
                     A 4.3x wider realizable range."
      supersedes: "the Phase-0H phrasing, which stated the bound universally"
      evidence: "results/phase0i/REALIZABILITY_BY_Z_ARCHITECTURE.md, DEFECT #33"
      phase: "0I"
    - id: warpage_is_not_a_reliability_proxy
      statement: "Global die warpage does not predict the local interconnect loading for this
                  architecture, and the relationship is not even sign-stable across assembly
                  states."
      quantitative: "70 paired runs: Spearman rho = 0.112 (all cases), 0.349 (mounted),
                     -0.793 (free) against interface shear. Across the mounted thickness sweep
                     warpage varies 3.0x (9.66 -> 29.23 um) while shear stays within +-9 %."
      evidence: "results/phase0h/warpage_local_correlation.csv,
                 results/phase0h/local_metric_selection.md"
      phase: "0H"
    - id: defect30_changed_a_240w_ranking
      statement: "DEFECT #30 inverted an architecture comparison at 240 W as well as at 1 kW.
                  Replaying the eleven Phase-0E candidates with the scope-guarded evaluator
                  moves three ranking positions."
      quantitative: "ARCH_B distributed j=2.0 h=0.5 shifts +356.83 mW (+1.576 %) and falls from
                     third-best to worst of the five distributed cases; ARCH_A cases shift
                     16-25 mW because their vias carry only leakage-scale current"
      evidence: "results/phase0h/DEFECT30_GLOBAL_PROPAGATION_AUDIT.md"
      phase: "0H"

  supported:
    - id: footprint_agreement_mounted
      statement: "In a mounted assembly the electrical and mechanical preferences on the
                  footprint lever AGREE: the larger, finer-partitioned footprint is both
                  lower loss and lower warpage."
      quantitative: "electrical -6.633 W for M = 36 -> 49 (259.2 -> 329.3 mm2);
                     mechanical S_A = -0.166 to -0.290 in all 5 board cases"
      evidence: "results/phase0g/footprint_board_envelope.csv,
                 results/phase0g/footprint_placement_recheck.md"
      corroboration: "June-2026 Sec. I asserts the same direction qualitatively -- distributed
                      VRs produce localized deformation rather than global package deflection,
                      reducing overall warpage sensitivity. Direction only; no number is given."
      phase: "0G"
    - id: count_inert
      statement: "Regulator count is mechanically inert at constant total footprint and heat."
      evidence: "results/phase0b, results/phase0c"
      phase: "0B,0C"
    - id: rdl_dominates_arch_conditional
      statement: "Package distribution loss is dominated by lateral RDL spreading for ARCH_A at
                  every realizable thickness, but NOT for ARCH_B, whose via field exceeds the
                  RDL by up to 11x above roughly 0.9 mm."
      quantitative: "ARCH_A: RDL 0.642 W against TSV 0.010-0.163 W. ARCH_B: TSV 0.450 W at
                     0.80 mm rising to 7.210 W at 2.00 mm against a flat 0.642 W RDL."
      evidence: "results/phase0h/interconnect_decomposition_1kw.csv"
      phase: "0H"
      supersedes: "rdl_dominates (Phase 0D-R), which stated it unconditionally"

  conditional:
    - id: archA_interior_optimum
      statement: "ARCH_A retains a numerically resolved interior electrical optimum at
                  h_sub = 0.90 mm."
      condition: "resolved but NOT actionable -- the optimum is 8.634 mW deep on a 125 W
                  budget (0.0069 %). The ARCH_A/ARCH_B gap at fixed thickness is 52x larger
                  than the entire depth of this optimum."
      quantitative: "numerical floor 0.0977 mW; depth vs 0.80 mm = 88.4x floor, vs 1.00 mm
                     = 9.6x floor"
      evidence: "results/phase0g/crossover_hires_ARCH_A_fixedA.csv"
      phase: "0G"
    - id: thickness_opposition
      statement: "Substrate thickness is a genuine ETM opposition: electrically thinner is
                  better, mechanically thicker is better."
      condition: "the opposition is real and sign-stable, but NO criterion exists to make it
                  binding (G2 NOT TESTED), so it cannot restrict a feasible set. It is a
                  response coupling, not a constraint."
      quantitative: "electrical +6.706 W for 0.80 -> 2.00 mm (ARCH_B nominal);
                     mechanical -44 % warpage over the same range (FR-4 1.6 mm board)"
      evidence: "results/phase0g/electrical_crossover_uncertainty.md,
                 results/phase0g/explicit_board_crosscheck.csv"
      phase: "0G"
    - id: mounted_warpage_floor
      statement: "A mounted assembly cannot reach the warpage levels the free package
                  suggests: its floor is 14.03 um where the free package reaches 1.27 um."
      condition: "magnitudes are NOT validated -- board CTE, board modulus envelope and the
                  absence of a solder-mask/copper-plane laminate structure are engineering
                  values, not measurements of the reference system."
      evidence: "results/phase0g/mechanical_epsilon_corrected.csv"
      phase: "0G"
  superseded:
    - id: footprint_opposition
      statement: "HVR footprint is simultaneously an electrical and a mechanical design
                  variable and the two OPPOSE: larger footprint lowers electrical loss and
                  raises warpage. Sign preserved in both assembly states."
      superseded_by: "Phase 0G: the sign is ASSEMBLY-STATE DEPENDENT. It is positive in the
                      free package (+0.203) and the compact clamp (+0.058) and NEGATIVE in all
                      five explicit assemblies (-0.166 to -0.290). In a mounted assembly the
                      two disciplines AGREE. The reference paper asserts the mounted direction.
                      Replaced by claim footprint_agreement_mounted."
      phases_asserted: "0C,0D,0D-R,0E,0F"
    - id: assembly_state_reversal
      statement: "The mechanical thickness preference REVERSES between assembly states: free
                  packages prefer thicker substrates, mounted packages prefer thinner ones."
      superseded_by: "Phase 0G: an artifact of BC-B's three-DOF in-plane clamp. No explicit
                      assembly reproduces it -- S_h < 0 in all five board cases, at three
                      reference temperatures and four thermal boundaries. BC-B cannot recover
                      its own free limit (0.739 vs 8.287 um) and no support stiffness k*
                      exists over seven decades."
      phases_asserted: "0F"
    - id: archB_interior_optimum
      statement: "ARCH_B has an interior electrical thickness optimum near h_sub = 1.0 mm."
      superseded_by: "Phase 0G: an artifact of DEFECT #30. The minimum SURVIVED a 25x tighter
                      convergence tolerance -- it was not numerical -- but vanished when the
                      vertical-tier unit error was fixed. Corrected ARCH_B is monotonically
                      increasing with the optimum on the thin boundary in 9 corners of 9."
      phases_asserted: "0F"
    - id: win_win_win_200_500
      statement: "Substrate thickness 200 -> 500 um is win/win/win and survived every
                  correction."
      superseded_by: "Phase 0F: both thicknesses are GEOMETRICALLY INFEASIBLE for the selected
                      converter. The trend DIRECTION survives on realizable geometry
                      (800 -> 1500 um, -81.9 % warpage) but the magnitudes and the swept range
                      do not."
      phases_asserted: "0B,0C,0D,0D-R,0E"
    - id: no_arch_dependent_thickness
      statement: "No architecture-dependent thickness tradeoff exists."
      superseded_by: "Phase 0F: at 1 kW ARCH_B's electrical optimum is interior while its
                      mechanical preference is monotone. Phase 0G audits whether that
                      interior optimum is numerically resolved."
      phases_asserted: "0D-R,0E"
    - id: archB_infeasible
      statement: "ARCH_B is infeasible."
      superseded_by: "Phase 0E: feasible under every source-backed current density; the
                      verdict rested on an unsourced 4.8 mA per-via limit."
      phases_asserted: "0D-R"
    - id: placement_spread_188
      statement: "The electrical spread across placements is 188.8 %."
      superseded_by: "Phase 0E: 46.7 % on the sourced RDL stack."
      phases_asserted: "0D-R"
    - id: exchange_rate_16
      statement: "The footprint ETM exchange rate is 16.2 W/um."
      superseded_by: "Phase 0E: 11.48 W/um; Phase 0F at 1 kW: 12.86 W/um."
      phases_asserted: "0D-R"
    - id: ansys_unavailable
      statement: "ANSYS cross-validation is impossible because the licence server is down."
      superseded_by: "Licence restored 2026-09-06. HFSS and Icepak used; Q3D is not licensed."
      phases_asserted: "0B,0C,0D,0D-R,0E"

open:
  - id: gan_mlcc_layer_heights
    what: "GaN device and MLCC layer heights"
    why_it_matters: "sets the HVR cell height and hence the minimum realizable substrate"
  - id: em_lifetime_limit
    what: "electromigration lifetime current density for copper TSVs"
    why_it_matters: "the provisioning density is closed; the reliability limit is not"
  - id: rdl_dielectric_and_stitching
    what: "RDL dielectric stack and inter-layer stitching via density"
  - id: board_laminate_structure
    what: "real board laminate structure -- copper plane fractions, solder mask, stiffener,
           and the board's true in-plane CTE"
    why_it_matters: "Phase 0G CLOSED the question the Phase-0F reversal rested on: BC-B is a
                     clamp, no k* exists, and every explicit board gives the free-package
                     sign. What remains open is only MAGNITUDE. The 9.7-29.2 um range is an
                     engineering envelope, not a prediction, and must not be quoted as
                     predicted warpage."
    status_change: "was board_foundation_stiffness (OPEN, Phase 0F) -- the SIGN question is
                    now closed; only magnitude remains"
  - id: cooling_topology
    what: "whether the real package is cooled from the top or from inside the substrate"
    why_it_matters: "sets the sign of the through-thickness thermal gradient"
    status_change: "BOUNDED in Phase 0G rather than closed. It moves warpage magnitudes by up
                    to 45 % and halves S_h, but flips no sign in any configuration tested.
                    The mounted normalized response is invariant to 0.07 % across a 4x h_top
                    band. Substrate-side-only cooling is separately thermally infeasible at
                    1 kW."
  - id: assembly_pre_stress
    what: "assembly / cure / cooldown reference state (M1)"
    why_it_matters: "all warpage here is INCREMENTAL OPERATIONAL, not TOTAL ASSEMBLED"
    status_change: "BOUNDED in Phase 0G. Raising the reference to 150/175 C changes MAGNITUDES
                    by up to +54 % (25.1 -> 38.7 um mounted) but leaves the mounted normalized
                    response stable to 0.5 % (S_h = -0.4421 / -0.4397 / -0.4400) and flips no
                    ordering. Every absolute warpage number in this project is therefore a
                    LOWER BOUND. A validated pre-stress model still requires the cure schedule,
                    cure shrinkage, viscoelastic relaxation and reflow profile -- none
                    available for the reference system."
  - id: mechanical_criterion
    what: "an admissible operational-state warpage or RDL-shear allowable for this stack"
    why_it_matters: "this is the single blocking item for G2 and for any constraint-based
                     optimizer. Phase 0G searched the full corpus and found none: June-2026
                     names the failure mechanisms (global package warpage, delamination, RDL
                     shear) but attaches no number to any of them. External standards are
                     unretrievable in this environment AND inadmissible on inspection --
                     package-outline coplanarity governs the ball plane of a component as
                     supplied at a defined measurement temperature for solderability at
                     reflow, which matches neither the package state, the temperature, the
                     measurement definition nor the failure mechanism analysed here."
    evidence: "results/phase0g/mechanical_criterion_audit.md"

not_tested:
  - id: G2
    what: "feasible-set reversal under a mechanical criterion"
    why: "no source-backed criterion matching this package state, temperature, size,
          measurement definition and failure mechanism could be found"
    consequence: "the epsilon sweep is PARAMETRIC CONSTRAINT SENSITIVITY, never feasibility"
  - id: transient
    what: "transient electrothermal and mechanical response"
  - id: m1_full
    what: "full assembly-pre-stress model with plasticity and lifetime"

verdict:
  phase0g: "NO ACTIVE MECHANICAL CONSTRAINT -- RESPONSE COUPLING ONLY"
  phase0h: "NO ADMISSIBLE MECHANICAL CRITERION FOUND -- RESPONSE COUPLING ONLY"
  phase0i: "ARCHITECTURE-DEPENDENT RELIABILITY RESPONSE -- NO ACTIVE CONSTRAINT"
  phase0ir: "PHASE-0I METRIC VALID AFTER REDEFINITION -- READY FOR LIFE-LAW ACQUISITION"
  phase0j: "NO ADMISSIBLE SAC305 LIFE LAW FOUND FOR THE CURRENT METRIC / REGIME"
  phase0j_supersession: >-
    SUPERSEDED by Phase 0J-R. The verdict string above is retained VERBATIM as the
    historical record. Phase 0J recorded its own cause as ACCESS rather than physics;
    the primary calibration papers were subsequently supplied and 7 of its 10 database
    entries change. See verdict.phase0jr.
  phase0jr: "SAC/SnAgCu LIFE LAW ADMITTED FOR RELATIVE LIFE ONLY"
  phase0k: "MISSION REQUIREMENT STILL OPEN -- ABSOLUTE-LIFE CALIBRATION ALSO REQUIRED"
  phase0kr: "LOW-TEMPERATURE DATA INSUFFICIENT -- ORIGINAL PROFILE WITHDRAWN"
  wording_rule: "The word CONSTRAINT is reserved for a defined mechanical inequality that
                 binds. A change of sign in a mechanical response is a RESPONSE REVERSAL, not
                 a constraint. A published number is a CRITERION only if it survives the
                 six-condition admissibility test."
  basis:
    - "Nine candidate thresholds were tested against the six admissibility conditions and NONE
       passed. The best scored 3 of 6. Zero admitted (criterion_admissibility.csv)."
    - "Every published package-warpage allowable located is CATEGORY 1 -- manufacturing and
       solderability. JEP95 80 um room-temperature ball-plane coplanarity, SPP-024 -120/+170 um
       peak-reflow warpage, and wafer-level-packaging yield guidance of 0.2 mm (0.1 mm
       preferred). All govern the package as supplied, at reflow or handling temperature, for
       joint-formation defects."
    - "JESD22-B112C is a MEASUREMENT METHOD, not an allowable. The allowables live in JEP95 and
       SPP-024. IPC-9641, read directly, governs printed BOARD flatness through a reflow
       profile and contains no limit at all."
    - "Of eight enumerated failure mechanisms, ONE is computable at M0 -- global bending -- and
       it is not a failure mechanism. Two of the three mechanisms June-2026 itself names
       (RDL shear, delamination) are outside the mechanical model entirely."
    - "Global warpage does not predict local interconnect loading (Spearman 0.112 overall) and
       inverts sign between assembly states (-0.793 free, +0.349 mounted), so it cannot serve
       as a reliability surrogate."
    - "Neither local candidate survives validation for decision use: interface shear is
       non-monotone under refinement (7.6 % spread, samples a bimaterial corner) and relative
       displacement carries 26.5 % material spread from an underfill modulus the project has
       never sourced."
  what_this_is_not: "This is NOT a finding that the mechanics is wrong or irrelevant. The
                     response model is converged, cross-validated and sign-stable. It is a
                     finding that no admissible inequality exists to turn that response into a
                     constraint, and that the project has been measuring the LOAD rather than
                     the DAMAGE."
  rejected_verdicts_phase0kr:
    EXPERIMENT_DESIGN_FROZEN_CURRENT_MATERIAL_MODEL_SUFFICIENT: >-
      rejected -- the model is not sufficient. The -40 C profile sits 85 K below the creep
      calibration floor, and the creep card is evaluated 3.4-7.2x above its fitted stress window
      in EVERY profile including the operating baseline.
    EXPERIMENT_DESIGN_FROZEN_AFTER_WITHIN_DOMAIN_PROFILE_REDESIGN: >-
      rejected although the redesign SUCCEEDED and is adopted. "FROZEN" requires all eight Sec.31
      acceptance criteria, and criterion 2 -- stress inside or defensibly near the calibration
      domain -- fails irreducibly. Claiming frozen would paper over the single most important
      finding of this phase. The design is READY TO EXECUTE WITH A DECLARED LIMITATION.
    LOW_TEMPERATURE_SAC305_MODEL_VALIDATED_ORIGINAL_PROFILE_RETAINED: >-
      rejected -- no sub-zero SAC305 steady-state creep data exists. The low-temperature
      literature for this alloy is high-strain-rate impact work, which the creep framework
      explicitly excludes. Nothing was validated because nothing was extended.
    STATISTICAL_POWER_INSUFFICIENT_SAMPLE_COUNT_MUST_INCREASE: >-
      rejected as the VERDICT although it is true and is recorded as a secondary correction:
      n = 16 answers the life-law question but not the Z2/Z1 architecture question at the
      observed worst Weibull slope of 5.1, and the count rises to 34 per cell. It is a fix
      applied within this phase, not the dominant finding.
    EXPERIMENT_DESIGN_NOT_YET_IDENTIFIABLE: >-
      rejected -- the design IS identifiable. The within-domain pair gives D = 1.4395, a 44.0 %
      separation between the two laws' predicted life ratios, at an expected discrimination
      Z-score of 3.44 with a stated specimen count.
  rejected_verdicts_phase0k:
    MISSION_REQUIREMENT_ACQUIRED_CURRENT_MODELS_ROBUSTLY_PASS_G2: >-
      rejected -- no mission requirement exists. The entire repository and all supplied source
      material were searched and nothing was found; every n_required here is the TSV via count.
    MISSION_REQUIREMENT_ACQUIRED_G2_ROBUSTLY_NON_BINDING: "rejected -- no mission requirement
      exists."
    MISSION_REQUIREMENT_ACQUIRED_MODEL_FORM_UNCERTAINTY_PREVENTS_G2_DECISION: >-
      rejected -- the second half is exactly right and is the central Phase-0K finding, but the
      first half is false. No requirement was acquired.
    ABSOLUTE_LIFE_CALIBRATION_REQUIRED_BEFORE_G2_CAN_BE_DECIDED: >-
      rejected as INCOMPLETE, though true as far as it goes. It is silent on the mission, which
      is equally open and equally blocking. Choosing it would repeat the Phase-0J-R error of
      naming one blocker when there are two -- the error this phase exists to correct.
    MISSION_REQUIREMENT_STILL_OPEN_CURRENT_RELATIVE_LIFE_RESULT_IS_THE_MAXIMUM_DEFENSIBLE_CLAIM: >-
      rejected as UNDERSTATING the phase. It is true that relative life is the maximum currently
      VALIDATED claim, but this verdict implies nothing further is obtainable. Phase 0K shows
      precisely what is obtainable, how, and at what cost: 64 packages, two temperature ranges,
      6.19 sigma of model discrimination.
  rejected_verdicts_phase0jr:
    SAC305_LIFE_LAW_ADMITTED_ABSOLUTE_FATIGUE_LIFE_PREDICTION_VALIDATED: >-
      rejected -- the two admitted Syed models disagree by 4.10x on our joint (2499 vs 610
      cycles for Z1) while agreeing to 4-7 % on the author's own independent validation
      package. The cause is measured, not speculative: our w_acc/eps_acc is 124-136 MPa against
      his 28.8-30.0 MPa. Each metric interpolates inside his range; the PAIR sits 4.3x off the
      calibration locus.
    PRIMARY_SOURCES_ACCESSED_LIFE_LAW_TRANSFER_REMAINS_CONDITIONAL: >-
      rejected as too weak. It would understate a reproduced calibration (11.7 % worst error,
      4.2 % constant consistency), an averaging volume matched to the source's own 25 um layers,
      and a relative ratio robust across four independent formulations. "Conditional" is the
      right word for the ABSOLUTE result and is used for it; it is the wrong word for the phase.
    PRIMARY_SOURCES_CONFIRM_NO_ADMISSIBLE_LIFE_LAW_FOR_CURRENT_REGIME: >-
      rejected -- four formulations are admitted for relative life, one as methodology and one
      for acceleration scaling. This was the Phase-0J verdict and the supplied papers overturn
      it, exactly as Phase 0J said access would.
    SAC_LIFE_LAW_FAMILIES_DISAGREE_MODEL_FORM_UNCERTAINTY_DOMINATES: >-
      rejected for the RANKING, which is identical across every law, exponent and dwell tested
      (Z2 > Z1 > Z4, Z2/Z1 = 1.21-1.38). Model-form uncertainty dominates the ABSOLUTE value
      only, at 4.1x, and that is reported as such rather than promoted to the verdict.
    CURRENT_ZERO_DWELL_LOAD_PROFILE_IS_INCOMPATIBLE_WITH_AVAILABLE_CALIBRATIONS: >-
      rejected, and DOUBLY false. The premise is wrong -- the solver's own NT output shows a
      STEP followed by a 300 s HOLD at each extreme, not a ramp, so there is a real 300 s dwell
      that matches Syed's TC3 exactly. And the conclusion is wrong -- over a 30x dwell change
      the relative result moves by only +-2 %.
  rejected_verdicts_phase0j:
    G2_PASSED_RELIABILITY_CONSTRAINT_CHANGES_THE_FEASIBLE_SET: >-
      rejected -- both halves of the inequality are missing. No admissible life law and no
      required life. Sec.24 is explicit that G2 is not passed merely because lifetimes differ.
    LIFE_LAW_ACQUIRED_ALL_ARCHITECTURES_PASS: "rejected -- no law was acquired."
    LIFE_LAW_ACQUIRED_ALL_ARCHITECTURES_FAIL: "rejected -- no law was acquired."
    ARCHITECTURE_DEPENDENT_FATIGUE_LIFE_PROVEN_NO_REQUIRED_LIFE_FOUND: >-
      rejected although half of it is true. The METRIC difference is proven and resolved at
      5.8x its paired-perturbation spread, and no required life was found. But FATIGUE LIFE is
      not proven, because no admissible law converts the metric into a life. Saying "proven"
      would claim the bridge this phase failed to acquire.
    FATIGUE_LIFE_RANKING_IS_MODEL_FORM_DEPENDENT: >-
      rejected -- the OPPOSITE is true and it is a genuine positive result. The ranking
      Z2 > Z1 > Z4 is identical across all three law families and every exponent tested.
      Reporting this verdict would invert a finding.
    LIFE_LAW_FOUND_BUT_LOADING_OUTSIDE_ITS_VALID_DOMAIN: >-
      rejected as the verdict, though the cycle IS incompatible (zero dwell against 15 min,
      dT 2.9x apart). It is not the operative blocker, and the domain is not even knowable
      because no accessible source states it. Verdict F names the primary cause.
  rejected_verdicts_phase0ir:
    PHASE_0I_LOCAL_RELIABILITY_METRIC_VALIDATED_AS_IS: "rejected -- the metric's VALUE is
      correct and its creep content is verified, but its LABEL was wrong. Phase 0I called it a
      strain range; it is an accumulated inelastic PATH LENGTH per cycle, larger than the range
      by a factor of 3.72 here. A future life law matched to a range would be misapplied by that
      factor. That is a redefinition, so 'validated as is' overstates the outcome."
    PHASE_0I_DAMAGE_METRIC_OMITTED_CREEP_CONTRIBUTION: "rejected -- DISPROVED by experiment.
      This was the specific failure mode the audit was commissioned to look for, and it did not
      occur. With a creep-only material and no *PLASTIC card, PEEQ / eq(eps_inelastic) = 1.0000.
      No replay of the Phase-0I results is required and none was performed."
    PHASE_0I_LOCAL_RELIABILITY_METRIC_NOT_PHYSICALLY_CLOSED: "rejected -- it is closed. The
      quantity is exactly defined, its plastic and creep content is verified, the stabilised
      cycle is correctly extracted, and it converges on mesh, creep tolerance and corner
      regularisation."
    PHASE_0I_ARCHITECTURE_CLAIMS_VALID_BUT_LIFE_INTERPRETATION_WITHDRAWN: "rejected as the
      VERDICT although both halves are true and are recorded. The life interpretation IS
      withdrawn (see relative_life) and the architecture claims ARE valid and resolved. It is
      rejected only because it omits the operative finding: the metric itself needed redefining,
      and once redefined it satisfies every condition for Phase 0J."
  rejected_verdicts_phase0i:
    RELIABILITY_CONSTRAINT_PROVEN_MECHANICS_ENTERS_SYNTHESIS: "rejected -- a constraint needs
      both halves of an inequality. The local metric now exists and is validated; the allowable
      does not. No admissible SAC305 life law was retrievable and no mission requirement exists."
    GLOBAL_WARPAGE_DOES_NOT_TRACK_LOCAL_DAMAGE: "rejected -- it DOES track: Spearman +1.000
      within every architecture and +0.909 pooled. The defensible statement is that warpage
      OVERSTATES the benefit by 3-5x (29.7-52.6 % against 5.6-17.2 % over the same thickness
      range). This NARROWS rather than contradicts Phase 0H, whose finding concerned SMEARED
      INTERFACE SHEAR, which was a poor proxy."
    NO_MATERIAL_RELIABILITY_EFFECT_FOUND: "rejected -- there is one and it is large: 35.8 % in
      damage between the backside and embedded architectures. NOTE, Phase 0I-R: the
      '1.9-3.8x in relative life' that originally closed this sentence is WITHDRAWN. It
      rested on an unsourced fatigue exponent m = 1.5-3 that entered as a figure annotation;
      over m = 0.5-5 the ratio spans 1.25-9.18. The 35.8 % metric difference stands."
    INSUFFICIENT_MATERIAL_MISSION_DATA_FOR_RELIABILITY_VERDICT: "rejected as the verdict,
      though true of the LIFE LAW and the MISSION specifically. The constitutive model was
      sourced for the correct alloy, validated 4/4 and cross-checked twice, and a real
      architecture-dependent response was measured."
  rejected_verdicts:
    MECHANICAL_CRITERION_ACQUIRED_G2_PASSES: "rejected -- 0 of 9 candidates admitted"
    MECHANICAL_CRITERION_ACQUIRED_NON_BINDING: "rejected -- no criterion was acquired at all;
                                                every candidate failed admissibility"
    LOCAL_RELIABILITY_METRIC_REPLACES_GLOBAL_WARPAGE: "rejected -- global warpage IS
      disqualified (Sec. 7), but neither local candidate survived Sec. 10 validation, so
      nothing replaces it. Claiming a replacement would overstate what was achieved."
    INSUFFICIENT_MATERIAL_ASSEMBLY_DATA_TO_TEST_A_CANDIDATE: "rejected as the PRIMARY verdict,
      though true as a sub-finding: mechanism B is NOT TESTABLE WITH PRESENT DATA (Sec. 9).
      The dominant fact is admissibility, not data volume -- criteria were found and none
      applies to the operational mounted state."
  g2_status: NOT_TESTED
  g2_note_phase0k: >-
    STILL NOT TESTED, and Phase 0K establishes WHY it cannot be closed by mission definition
    alone. Two independent pieces are open. (1) MISSION: no field or product requirement exists
    anywhere in the repository or the supplied material; N_required is USER INPUT REQUIRED and
    is now enforced mechanically by a contract file that refuses unprovenanced numbers.
    (2) ABSOLUTE-LIFE CALIBRATION: the four admitted formulations span 5.2x within a single
    architecture while the architectures separate by only 1.21-1.38x, so NO N_required exists at
    which all models agree Z1 fails and Z2 passes -- the conditions are disjoint (Z1 fails only
    above 2499, Z2 passes only below 581). Zero of 601 grid points give a robust reversal.
    Relative life alone does not pass G2 and is not claimed to. What IS established is
    ARCHITECTURE-DEPENDENT RELATIVE FATIGUE LIFE.
  g2_note_phase0jr: >-
    STILL NOT TESTED, and now blocked by ONE requirement instead of two. Requirement 1, a
    defensible predicted fatigue life, is PARTIALLY MET: four primary-source laws admitted for
    RELATIVE life, the source calibration reproduced on tolerances declared in advance, and the
    averaging volume matched to the source's 25 um layers. Absolute life remains CONDITIONAL
    because the two admitted metric families disagree 4.1x on our joint. Requirement 4 is MET
    and strengthened -- Z2/Z1 = 1.21-1.38 across two authors, two alloy variants, two metric
    families and a 30x dwell range. Requirement 2, a defensible required life, is UNCHANGED.
    Phase 0J-R called it the SOLE blocker; PHASE 0K WITHDRAWS THAT, having tested it formally:
    knowing N_required does not by itself produce a unique pass/fail, because the admitted
    absolute-life formulations differ by 4.1x and therefore disagree about feasibility over a
    wide band of N_required. TWO OPEN PIECES for absolute G2: (1) the system mission /
    required life, and (2) an absolute-life calibration, OR a decision region demonstrably
    robust to the model-form spread. What Phase 0J-R does establish, which the brief
    explicitly permits, is ARCHITECTURE-DEPENDENT RELATIVE FATIGUE LIFE.
  g2_note_phase0j: >-
    STILL NOT TESTED, and now bounded on both sides. LEFT side: closed and strengthened --
    three metrics frozen natively (M1 path, M2 range, M3 energy), all convergent, all agreeing
    on architecture ranking. RIGHT side: absent for TWO independent reasons, not one. (a) NO
    ADMISSIBLE LAW -- 0 of 10 candidates passed the ten predeclared criteria, and the one
    conditionally transferable candidate failed the reproduction gate because its calibration
    data are unretrievable. (b) NO REQUIRED LIFE -- no category-B field mission requirement
    exists, and Sec.14 forbids promoting the 1000-cycle qualification count. Requirement 4 of
    the Sec.23 set IS met: the ranking survives uncertainty. Requirements 1 and 2 fail outright
    and 3 is not evaluable.
  g2_note_phase0ir: "Unchanged, and now precisely bounded. The LEFT side of
    g_mech(x) <= g_allow is closed: an exactly defined, creep-inclusive, convergent local metric
    verified against the solver's own output. The RIGHT side is absent and is DATA, not physics
    -- a SAC305 fatigue relation matched to the accumulated-path-length form of this metric, and
    a mission requirement. Phase 0J is recommended to acquire exactly those two things."
  optimiser_gate:
    phase: "0G"
    recommended: false
    condition_1_assembly_response_survives: PARTIAL
    condition_1_detail: "The thickness RESPONSE survives calibrated board and thermal-boundary
                         uncertainty with 0 sign flips in 20 combinations. But the
                         assembly-state REVERSAL the condition was posed about does not
                         survive -- it does not exist."
    condition_2_criterion_or_epsilon_alters_feasible_set: false
    condition_2_detail: "No criterion exists, so nothing can alter the feasible set. Phase 0G
                         additionally argued the computed range sits far below conventional
                         tolerances; Phase 0H Sec.18 RETRACTED that comparison as unsourced,
                         which strengthens rather than weakens the conclusion -- whether the
                         range is safe or constraining is UNKNOWN."
    conclusion: "BOTH conditions were required. Condition 2 fails outright and condition 1
                 fails in the sense it was posed. The global ETM optimizer is NOT recommended
                 and was NOT built."
    phase0h_note: "Phase 0H reached the same conclusion by a different route -- 0 of 9
                   candidate criteria admitted -- and this gate is retained as the Phase-0G
                   historical record rather than rewritten."
  g2_note: "Unchanged since Phase 0B, but the reason has narrowed. Phase 0H could not test
            G2 because it had neither a failure-relevant metric nor an allowable. Phase 0I
            supplies the metric -- convergent, validated, tied to a documented mechanism -- so
            g_mech(x) <= g_allow is now writable in FORM. What is still missing is g_allow: a
            SAC305 life law (both candidate sources return HTTP 403) and a required life (not
            published for the reference system). Half the gate is now built."

next_gate:
  id: "0L -- MISSION INPUT AND BOARD-LEVEL CALIBRATION IN PARALLEL, then RDL / delamination"
  supersedes_0k_framing: >-
    Phase 0K RAN. Its framing of itself as gated on system-owner input alone is superseded by
    its own result: a calibration experiment is independently necessary because no robust
    Z1-fail / Z2-pass band exists under the current model-form spread.
  recommendation: "MISSION + EXPERIMENT IN PARALLEL -- they are independent, both required, and
    neither blocks the other"
  supersedes_0k_framing: >-
    The Phase-0J framing of 0K as gated on LIFE-LAW ACCESS is SUPERSEDED. Access happened: the
    primary papers were supplied, four laws are admitted, and the calibration was reproduced.
    The remaining blocker is NOT mechanics and NOT literature.
  blockers_TWO_not_one: >-
    PHASE 0K CORRECTION. Phase 0J-R recorded N_required as the SOLE blocker. Formal decision
    analysis withdraws that: TWO pieces are open -- (1) the system mission / required life, and
    (2) an absolute-life calibration OR a demonstrated decision region robust to the 4.1x
    model-form spread. See results/phase0k/G2_DECISION_REGIONS.md.
  piece_1_mission: >-
    N_required, from the system owner. Minimum set in results/phase0jr/MISSION_INPUT_TEMPLATE.md
    -- expected service lifetime, required survival probability, whether the target is a field
    mission or a qualification gate, cold boots per day, workload cycles per day and their
    depth, and whether the system is ever fully powered down.
  cheapest_high_value_addition: >-
    ONE board-level thermal-cycle test of the actual DVPD package. A single measured life at a
    single condition fixes the constant directly, collapses the 4.1x model-form spread on
    absolute life, and converts every relative result in Phase 0J-R into an absolute one.
  supersedes: "the Phase-0I-R next_gate, which named 0J. Phase 0J ran and returned a negative:
    the laws exist, they are paywalled, and none of the accessible reprints carries a
    calibration dataset."
  what_0K_needs: >-
    Exactly two things, both ACQUISITION and neither modelling. (1) A SAC305 fatigue relation
    matched to one of M1/M2/M3, WITH its constants, its averaging volume, its calibration
    dT/dwell, AND its own calibration data so the Sec.8 reproduction can actually be run.
    Institutional access to IEEE Xplore and ASME would supply all three canonical papers
    immediately and is the cheapest possible unblock. (2) A required life DECLARED BY THE
    SYSTEM OWNER. If (1) arrives with a calibration cycle far from ours, a justified
    acceleration relation or a re-run on that cycle becomes a third requirement -- and the
    Norton surrogate's 7.5-16 MPa window must be re-validated at whatever temperatures it uses.
  gated_on: >-
    Phase 0J WAS authorised because Phase-0I-R metric closure passed, and it ran. Its outcome
    is recorded in verdict.phase0j: the metric side was correct and the DATA side was not
    available. Phase 0K is therefore gated on ACCESS, not on any further modelling result.
    Historical note -- Phase 0J was authorised because All five Sec.24
    conditions are met: the metric is exactly defined; plastic and creep are both proven
    present by experiment; stabilised-cycle extraction is correct; the Z2 separation is
    resolved at 5.8x its perturbation spread; and the metric is compatible in principle with
    a known class of SAC305 fatigue law, subject to matching the law to the accumulated-
    path-length form or converting by the measured factor 3.72.
  rationale: "Phase 0I built the half of G2 that was missing physics: a convergent, validated,
              failure-relevant local damage metric with a sourced SAC305 constitutive model.
              The other half is not physics, it is DATA -- a life law and a required life.
              Adding a second failure mechanism before that would produce another well-resolved
              response with nothing to compare it against."
  priority_order:
    - "1. SAC305 life law N_f = f(Delta-eps_in) with its constants, metric definition and the
       package it was calibrated on. Both candidate open-access sources return HTTP 403 here;
       institutional access or a different route is needed."
    - "2. A required life for the target product -- cycles to survive, from a qualification
       target or a stated product requirement. Not published for the reference system, and
       Sec.20 forbids inventing one."
    - "3. RDL / interposer damage. Still absent from the mechanical mesh entirely and one of
       the three mechanisms June-2026 names. ARCH_Z4 and ARCH_Z5 load it hardest."
    - "4. Cohesive-zone delamination -- the remaining June-named mechanism and the convergent
       replacement for the peel metric excluded since Phase 0C."
    - "5. Joint-to-joint variation; only the single worst joint is modelled."
  publication_framing: "Unchanged from Phase 0H in kind, strengthened in content: AUDITED
    CROSS-DOMAIN DVPD MODELLING AND FALSIFICATION. Phase 0I adds vertical integration as a
    real design variable, a validated reliability-physics chain, and a measured
    architecture-dependent reliability response -- all without an active constraint."
  explicitly_not_next: "the global ETM optimizer"

phase0g_defects:
  - id: 29
    title: "DUPLICATED CURRENT CLAIMS CAN BECOME SEMANTICALLY STALE"
    detail: "The report stated the same claim in Executive Summary, Positive Results, Negative
             Results, the uncertainty ladder and Next Steps; each phase updated only some.
             Every individual sentence was true when written, so regex assertions could not
             catch the contradiction."
    fix: "This file is the single source of truth. Current-status sections are GENERATED from
          it and semantic tests compare the generated text against it."
    status: FIXED
  - id: 30
    title: "UNIT INCONSISTENCY BETWEEN PER-REGULATOR AND SYSTEM-WIDE LOSS TERMS"
    detail: "vertical_tier() returns a PER-REGULATOR loss; rdl_network_solve() returns a
             SYSTEM-WIDE loss. Phases 0D-R, 0E and 0F summed them directly, understating every
             vertical tier by n_vr -- 4x at 240 W, 49x at 1 kW."
    detected_by: "Phase 0G Sec. 2 curve decomposition, after the convergence-tolerance
                  hypothesis had been tested and eliminated"
    impact: "INVERTED the Phase-0F architecture conclusion. ARCH_B's interior optimum was an
             artifact; corrected ARCH_B is monotonic with its optimum on the thin boundary."
    fix: "scripts/phase0e/architecture0e.py -- both terms expressed system-wide; guard test
          added; 151 tests pass."
    status: FIXED
  - id: 31
    title: "THE SEMANTIC LEDGER WAS VACUOUS -- IT COULD NOT FAIL"
    detail: "The Phase-0F semantic ledger scored each withdrawn claim against a +-800-character
             window and accepted 'was ', 'were ', 'became', 'becomes' and 'earlier' as
             exonerating context. In English technical prose at least one of those appears in
             any such window, so EVERY ledger entry passed unconditionally. The mechanism built
             to catch DEFECT #29 could not catch anything."
    detected_by: "a deliberate NEGATIVE TEST -- three unqualified re-assertions of withdrawn
                  claims were injected into the report and the ledger stayed green. The guards
                  had never been checked for the ability to fail."
    impact: "Five genuinely stale statements were standing in the Executive Summary, the
             uncertainty ladder and Next Steps, all of them invisible to a green build."
    fix: "The exonerating vocabulary is restricted to markers that can only be present
          deliberately; the window is the containing PARAGRAPH or table cell instead of a page
          of prose; scoring runs on the Markdown so headings are unambiguous; and a claim is
          exonerated by its enclosing heading CHAIN, so a subsection inside a superseded phase
          inherits that framing. Verified in BOTH directions: the real report passes 49 checks,
          and five injected re-assertions are each caught."
    status: FIXED
    lesson: "A guard that has never been observed to fail has not been tested. Every assertion
             added from Phase 0G onward is negative-tested before it is trusted."
  - id: 32
    title: "CURRENT_SCIENTIFIC_STATUS DID NOT CONTROL ALL CURRENT-FACING REPORT CONTENT"
    detail: "Phase 0G brought the CLAIMS LEDGER under this file and generated it, then declared
             DEFECT #29 fixed. But the Executive Summary, governing equations, validation
             status, novelty statement, current limitations, publication-defensible claims and
             next steps were still hand-written, and the Phase-0G ledger deliberately exonerates
             any withdrawn claim whose enclosing heading names a historical phase -- which is
             right for narrative sections and wrong for sections that speak in the present
             tense. Seven current-facing statements were therefore stale behind a green build:
             thickness still called win/win/win and 'survived every correction'; 'no
             architecture-dependent thickness tradeoff exists'; the withdrawn ARCH_B interior
             optimum; footprint still advertised as the ETM opposition novelty; R_field =
             R_single / n_req with n_alloc absent from the symbol table; the full 3-D MOOSE
             package validation still called NOT DONE when Phase 0E completed it as TH-1..TH-5;
             and BC-B still described as a compliant mounted support after Phase 0G proved it a
             three-DOF clamp."
    fix: "All seven are now GENERATED from this file into sentinel-delimited blocks, the report
          is checked to carry each block verbatim, and a CURRENT-FACING SECTION AUDIT forbids
          nine stale-claim signatures inside present-tense sections with per-pattern
          exonerations for ledger rows, negations and retractions. Verified in both directions:
          the clean report passes, and nine injected stale claims are each caught."
    status: FIXED
    secondary_finding: "While negative-testing the new guards, two of the nine were found to be
                        INCAPABLE OF MATCHING: the patterns had been corrupted when written to
                        disk -- a lost backslash in one, and \\b interpreted as literal
                        backspace bytes in the other. They reported PASS on text they were
                        supposed to reject. This is DEFECT #31 recurring in a new form: the
                        failure was not in the guard's logic but in its source, and only the
                        negative test could see it. A control-character scan of every guard
                        source is now part of the check."
  - id: 33
    title: "REALIZABILITY WAS ARCHITECTURE-BLIND"
    detail: "kw1.design_1kw() takes no architecture argument, so the EMBEDDED geometric rule
             t_cell + h_tsv <= h_sub was applied to every architecture -- including ARCH_B,
             which converts BELOW the substrate, and ARCH_C, which converts BESIDE the die.
             At h_sub = 0.30 mm the code answers 'no inductor fits h_sub=300 um (budget 30 um)'
             identically for all three. The electrical model has varied the converter's vertical
             position since Phase 0D-R; the geometric and mechanical models never did."
    detected_by: "Phase 0I Sec.2, on treating z-placement as an architecture variable"
    impact: "Every 'unbuildable' verdict Phase 0H issued against a thin substrate is
             EMBEDDED-SPECIFIC. Non-embedded architectures reach 0.300 mm against the embedded
             1.276 mm -- a 4.3x wider range including exactly the region the corrected
             electrical model prefers."
    fix: "scripts/phase0i/zarch.py -- realizable(arch, h_sub) applies the embedded stack rule
          only where the converter is embedded, and the source-demonstrated TSV-layer rule
          (June-2026 Table III, d = 30 um at h = 300 um, AR 10:1) elsewhere."
    status: FIXED
    lesson: "A coupling is only modelled if EVERY domain sees it. The electrical model carried
             z-placement for five phases while geometry and mechanics silently did not, and no
             test could catch it because each domain was self-consistent on its own terms."
  - id: 34
    title: "PHASE-0G AND 0H FIGURES WERE NEVER EMBEDDED IN THE PDF"
    detail: "pandoc is invoked with cwd = results/, so a figure path written relative to the
             REPO ROOT ('results/phase0g/FIG.png') resolves to results/results/... . pandoc
             emitted 'Could not fetch resource ... replacing image with description' for all 21
             such references and substituted the alt text. Every Phase-0G and Phase-0H figure
             was missing from the PDF, and the Phase-0I figures would have been too."
    detected_by: "Phase 0I, when a LaTeX error surfaced the pandoc warning stream that had
                  been carrying these messages unread since Phase 0G"
    impact: "Two full phases of figures absent from the delivered PDF while the build reported
             VERIFIED. No numerical result is affected; the deliverable was."
    why_the_guards_missed_it: "Both existing checks were structurally incapable of catching it.
             'all figure files exist' evaluated Path(r).is_file() from the REPO ROOT, where the
             path does exist -- it validated the wrong directory. 'figures embedded in pdf'
             compared image-object count >= figure count, and a PDF whose surviving figures
             each contain two image objects satisfies that inequality with a third of the
             figures missing. Verified: with one figure deliberately broken, the count check
             still PASSES (80 objects vs 41 figures)."
    fix: "Figure references are absolute, matching the convention every phase before 0G used.
          Two new checks: paths are resolved FROM PANDOC'S WORKING DIRECTORY, and the pandoc
          warning stream is scanned for 'Could not fetch resource'. Negative-tested: reverting
          one path to repo-relative fails both."
    status: FIXED
    lesson: "A build warning nobody reads is not a warning. The verification suite now consumes
             the toolchain's own warning stream instead of only inspecting its output."
  - id: 35
    title: "PHASE-0I SCIENCE NOT FULLY PROPAGATED INTO CURRENT-FACING REPORT SECTIONS"
    detail: "Phase 0I added reliability physics but left seven current-facing statements in the
             Phase-0H state. The Executive Summary still framed the answer as 'Phases 0G and 0H
             find'; the limitations still said 'Neither local metric is fit for decisions',
             which referred to the two REJECTED Phase-0H proxies and not to the new M2 metric
             that passes every convergence test; they still said 'GaN and MLCC layer heights are
             still open' when GaN is source-backed; 'Exact next work' still recommended
             publication reframing; the validation status still described the mechanics as 'M0
             -- no plasticity, creep or fatigue' when a temperature-dependent
             elastic/plastic/creep submodel now exists; the governing equations stopped at M0
             thermoelasticity with no M2 constitutive law, damage-metric definition or
             stabilised-cycle definition; and the method still counted eight gates."
    detected_by: "Phase 0I-R Sec.18, a dedicated re-read of the current-facing sections against
                  the Phase-0I evidence"
    impact: "The report understated its own capability -- it described a model without failure
             physics after failure physics had been added -- and pointed the reader at the wrong
             next step."
    fix: "All eight items (A-H) repaired at the single source of truth and regenerated. The
          validation block now splits GLOBAL M0 from LOCAL M2 explicitly, and four M2 governing
          equations were added: the constitutive law, the damage-metric definition, the
          stabilised-cycle definition, and an explicit no_life_equation entry recording that no
          lifetime equation is current. Two further items were found while verifying A-H and are
          also fixed: the current-facing guard scope excluded the LIVE phase narrative even
          though it is headed 'current authoritative', so three over-claims inside it had never
          been checked; and the report build was not idempotent, because the new
          reliability_metric fragment was anchored on a heading that a later splice consumes."

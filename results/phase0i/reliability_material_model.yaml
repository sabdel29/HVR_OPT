creep:
  status: SOURCED (fitted to primary measured data)
  law_used: Norton, eps_dot = A sigma^n t^m with m = 0 (secondary creep)
  fitted_to: Yuan 2023 Table 26 -- 19 measured SAC305 steady-state creep points at 45, 80, 115 and
    150 C
  measured_stress_range_MPa:
  - 7.51
  - 15.92
  validity: The card is valid over the MEASURED stress window 7.51-15.92 MPa. Rate-independent plasticity
    caps the attainable von Mises stress at sigma_0 + C/gamma (30.3 MPa at 25 C falling to 13.0 MPa
    at 125 C), so the operating range of a joint sits inside or just above this window. The fraction
    of inelastic work occurring outside it is reported with every run.
  per_temperature_fits:
  - T_c: 45.0
    A: 4.113138395596853e-18
    n: 8.295282060451559
    n_points: 4
    window_MPa:
    - 10.54
    - 15.92
    max_rel_error_pct: 13.03
    rms_rel_error_pct: 12.17
  - T_c: 80.0
    A: 2.7230686734663922e-17
    n: 8.186421752526927
    n_points: 5
    window_MPa:
    - 10.43
    - 14.46
    max_rel_error_pct: 14.8
    rms_rel_error_pct: 9.75
  - T_c: 115.0
    A: 1.9336838454242813e-15
    n: 7.240124859265489
    n_points: 5
    window_MPa:
    - 8.73
    - 12.41
    max_rel_error_pct: 6.17
    rms_rel_error_pct: 4.11
  - T_c: 150.0
    A: 3.058942419442877e-12
    n: 5.075270649531406
    n_points: 5
    window_MPa:
    - 7.51
    - 11.52
    max_rel_error_pct: 7.9
    rms_rel_error_pct: 5.71
  interpolation: Arrhenius in the creep RATE at sigma_ref = 10.0 MPa, with the exponent interpolated
    linearly. Interpolating ln A against 1/T directly is wrong because A absorbs the temperature-dependent
    exponent; doing so returns an apparent 139 kJ/mol against a literature 62-65.
  activation_energy_check:
    implied_by_this_fit_kJ_per_mol: 64.4
    at_8_MPa: 71.7
    at_12_MPa: 58.5
    literature_xiao_armstrong_kJ_per_mol: 62.0
    literature_yuan_einn_kJ_per_mol: 65.0
    verdict: AGREES. Fitting the solver's own law to the primary data reproduces the published activation
      energy to within the spread of the published values themselves.

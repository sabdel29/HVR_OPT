  cte_per_K: 2.15e-05
  status: ASSUMPTION
  note: commonly quoted 21-24 ppm/K for SAC305; not sourced in this phase
open_items:
- E(T) slope is an assumption; only a room-temperature range is sourced
- CTE is an assumption
- no SAC305 fatigue LIFE law (N_f) has yet been admitted -- see the criterion audit
- the measured creep data stop at 150 C and start at 45 C; values outside are extrapolated

    anand_SAC305_Motalab_and_EINN: parameter sets exist (Yuan 2023 Tables 28/30) but CalculiX has
      no Anand model, so they cannot be evaluated by this solver
    anand_SnAgCuCe: DIFFERENT ALLOY -- rejected under the no-mixing rule
    anand_SAC405: DIFFERENT ALLOY -- rejected
    garofalo_direct: the correct physical form, but not implemented in CalculiX; used here only as
      the cross-check on activation energy

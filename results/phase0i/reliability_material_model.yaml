meta:
  alloy: SAC305 (Sn-3.0Ag-0.5Cu)
  phase: 0I
  date: '2026-09-10'
  purpose: temperature-dependent constitutive model for the local solder-joint submodel
  solver: CalculiX 2.23 -- *ELASTIC + *PLASTIC + *CREEP,LAW=NORTON in *VISCO steps
  alloy_mixing_rule: NO parameter is taken from a different alloy. Every plasticity and creep number
    below is SAC305. The SnAgCuCe and SAC405 Anand sets found in the search were REJECTED for that
    reason.
solver_capability:
  verified: true
  evidence: results/phase0i/solver_audit/ -- a single C3D8 SAC-like cube under cyclic shear in *VISCO
    steps reversed stress +-91 MPa, accumulated PEEQ monotonically 9.85e-5 -> 1.82e-2, and relaxed
    stress -38.0 % during a constant-strain hold.
  not_available:
  - Anand viscoplasticity (no native model in CalculiX)
  - user creep subroutine (needs a recompiled solver)
  - cohesive-zone fracture
  consequence: An Anand parameter set cannot be used even where one exists for SAC305. The sourced
    Garofalo law is therefore represented by the solver's Norton law, and because a single power law
    cannot span Garofalo's curvature (its effective exponent runs 3.1 at 2 MPa to 19.2 at 30 MPa),
    the Norton card is fitted DIRECTLY to the measured creep points instead.
